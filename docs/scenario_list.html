<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scenario</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #161410;
  color: #e9e5da;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 15px;
  line-height: 1.6;
  padding: 40px 20px;
}
.container { max-width: 1200px; margin: 0 auto; }

header { text-align: center; margin-bottom: 40px; }
header h1 {
  font-family: 'Playfair Display', serif;
  font-size: 56px;
  letter-spacing: 3px;
  color: #c98a3c;
  font-weight: 700;
}

.controls {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  margin-bottom: 36px;
}
.search-box { width: 100%; max-width: 360px; }
.search-box input {
  width: 100%;
  padding: 8px 12px;
  background: #242320;
  border: 1px solid #4a4842;
  color: #e9e5da;
  border-radius: 3px;
  font-size: 13px;
}
.search-box input::placeholder { color: #666; }
.search-box input:focus { outline: none; border-color: #c98a3c; }

.filter-tags {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
}
.filter-tag {
  padding: 5px 14px;
  background: #242320;
  border: 1px solid #4a4842;
  color: #999;
  border-radius: 16px;
  font-size: 11px;
  cursor: pointer;
  transition: all .2s;
  user-select: none;
}
.filter-tag:hover { border-color: #c98a3c; color: #e9e5da; }
.filter-tag.active {
  background: #c98a3c;
  border-color: #c98a3c;
  color: #161410;
  font-weight: 600;
}

.results-info {
  text-align: center;
  margin-bottom: 28px;
  color: #999;
  font-size: 12px;
}

.loading { text-align: center; padding: 60px 20px; color: #999; }
.error {
  background: #4a2a2a;
  border: 1px solid #8a4a4a;
  color: #ff9999;
  padding: 16px;
  border-radius: 4px;
  margin: 20px 0;
}

.system-section { margin-bottom: 48px; }
.system-heading {
  font-size: 15px;
  font-weight: 700;
  color: #c98a3c;
  letter-spacing: 1px;
  padding-bottom: 8px;
  margin-bottom: 20px;
  border-bottom: 1px solid #4a4842;
  display: flex;
  align-items: baseline;
  gap: 10px;
}
.system-heading .count {
  font-size: 11px;
  color: #666;
  font-weight: 400;
}

ul.cards {
  list-style: none;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 22px;
}
li.cards__item { list-style: none; }

.card {
  display: flex;
  flex-direction: column;
  height: 100%;
  background: #242320;
  border: 1px solid #4a4842;
  border-radius: 6px;
  overflow: hidden;
  transition: all .3s;
  text-decoration: none;
  color: inherit;
  cursor: pointer;
}
.card:hover {
  border-color: #c98a3c;
  box-shadow: 0 4px 14px rgba(201, 138, 60, .18);
  transform: translateY(-4px);
}

.card__image {
  width: 100%;
  height: 170px;
  background: linear-gradient(135deg, #3a3833 0%, #242320 100%);
  overflow: hidden;
  flex-shrink: 0;
}
.card__image img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card__image--default {
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, #4a4842 0%, #242320 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Playfair Display', serif;
  font-size: 40px;
  color: rgba(201, 138, 60, .35);
}

.card__content {
  padding: 18px;
  display: flex;
  flex-direction: column;
  flex: 1;
}
.card__system {
  display: inline-block;
  align-self: flex-start;
  background: #c98a3c;
  color: #161410;
  padding: 3px 9px;
  border-radius: 2px;
  font-size: 10px;
  font-weight: 700;
  margin-bottom: 10px;
}
.card__title {
  font-size: 17px;
  font-weight: 700;
  color: #e9e5da;
  margin-bottom: 8px;
  line-height: 1.4;
}
.card__text {
  font-size: 12.5px;
  color: #9d998f;
  flex: 1;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
}

footer {
  text-align: center;
  color: #666;
  font-size: 12px;
  padding-top: 24px;
  border-top: 1px solid #4a4842;
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Scenario</h1>
  </header>

  <div class="controls">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="検索...">
    </div>
    <div class="filter-tags" id="filterTags"></div>
  </div>

  <div class="results-info">
    <span id="resultsCount">読み込み中...</span>
  </div>

  <div class="loading" id="loading">シナリオを取得中...</div>
  <div class="error" id="error" style="display:none;"></div>
  <div id="scenarioSections"></div>

  <footer>
    <p>© 2026 Scenario Generator | Powered by GitHub</p>
  </footer>
</div>

<script>
(async function() {
  const REPO = 'notenog/memo';
  const FOLDER = 'docs/scenario';
  const GITHUB_PAGES_BASE = 'https://notenog.github.io/memo/scenario';
  let allScenarios = [];
  let allSystems = [];

  let token = localStorage.getItem('gh_token_list_page');
  if (!token) {
    token = prompt('GitHub Personal Access Token を入力してください:\n(Contents読み取り権限があれば十分です)');
    if (token) localStorage.setItem('gh_token_list_page', token);
  }
  const headers = token ? { Authorization: `token ${token}` } : {};

  try {
    const listRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${FOLDER}`, { headers });
    if (!listRes.ok) throw new Error(`API Error: ${listRes.status}`);

    const files = await listRes.json();
    const htmlFiles = files.filter(f => f.name.endsWith('.html') && f.type === 'file');
    if (htmlFiles.length === 0) throw new Error('HTMLファイルが見つかりません');

    for (const file of htmlFiles) {
      try {
        const fileRes = await fetch(file.download_url);
        if (!fileRes.ok) continue;
        const html = await fileRes.text();

        const doc = new DOMParser().parseFromString(html, 'text/html');
        const title = doc.querySelector('meta[name="scenario-title"]')?.content || file.name.replace('.html', '');
        const system = doc.querySelector('meta[name="scenario-genre"]')?.content || 'その他';
        const description = doc.querySelector('meta[name="scenario-description"]')?.content || '(説明なし)';

        let imageUrl = null;
        const imgMatch = html.match(/<img[^>]+src="([^"]+)"/);
        if (imgMatch) imageUrl = imgMatch[1];

        allScenarios.push({
          name: file.name,
          title,
          system: system.trim() || 'その他',
          description,
          url: `${GITHUB_PAGES_BASE}/${file.name}`,
          image: imageUrl
        });
      } catch (e) {
        console.error(`Failed to fetch ${file.name}:`, e);
      }
    }

    allScenarios.sort((a, b) => a.title.localeCompare(b.title, 'ja'));
    allSystems = Array.from(new Set(allScenarios.map(s => s.system))).sort((a, b) => a.localeCompare(b, 'ja'));

    document.getElementById('loading').style.display = 'none';
    renderFilterTags();
    render(allScenarios);

    document.getElementById('searchInput').addEventListener('input', () => render(filterScenarios()));

  } catch (error) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = 'block';
    document.getElementById('error').textContent = `エラー: ${error.message}`;
    console.error(error);
  }

  function renderFilterTags() {
    const container = document.getElementById('filterTags');
    container.innerHTML = allSystems.map(sys =>
      `<div class="filter-tag" data-system="${escapeAttr(sys)}">${escapeHtml(sys)}</div>`
    ).join('');
    container.querySelectorAll('.filter-tag').forEach(el => {
      el.addEventListener('click', () => {
        el.classList.toggle('active');
        render(filterScenarios());
      });
    });
  }

  function filterScenarios() {
    const searchText = document.getElementById('searchInput').value.toLowerCase().trim();
    const activeSystems = Array.from(document.querySelectorAll('.filter-tag.active')).map(t => t.dataset.system);

    return allScenarios.filter(s => {
      const matchSearch = !searchText ||
        s.title.toLowerCase().includes(searchText) ||
        s.description.toLowerCase().includes(searchText) ||
        s.system.toLowerCase().includes(searchText);
      const matchSystem = activeSystems.length === 0 || activeSystems.includes(s.system);
      return matchSearch && matchSystem;
    });
  }

  function render(scenarios) {
    const wrap = document.getElementById('scenarioSections');
    document.getElementById('resultsCount').textContent = `${scenarios.length}件のシナリオ`;

    if (scenarios.length === 0) {
      wrap.innerHTML = '<div style="text-align:center;color:#999;padding:40px;">該当するシナリオがありません</div>';
      return;
    }

    const groups = {};
    scenarios.forEach(s => {
      (groups[s.system] = groups[s.system] || []).push(s);
    });
    const systemOrder = Object.keys(groups).sort((a, b) => a.localeCompare(b, 'ja'));

    wrap.innerHTML = systemOrder.map(sys => `
      <section class="system-section">
        <h2 class="system-heading">${escapeHtml(sys)}<span class="count">${groups[sys].length}件</span></h2>
        <ul class="cards">
          ${groups[sys].map(cardHTML).join('')}
        </ul>
      </section>
    `).join('');
  }

  function cardHTML(s) {
    const imageHtml = s.image
      ? `<img src="${escapeAttr(s.image)}" alt="${escapeAttr(s.title)}">`
      : `<div class="card__image--default">${escapeHtml(s.title.substring(0, 1))}</div>`;
    return `
      <li class="cards__item">
        <a class="card" href="${escapeAttr(s.url)}" target="_blank" rel="noopener">
          <div class="card__image">${imageHtml}</div>
          <div class="card__content">
            <span class="card__system">${escapeHtml(s.system)}</span>
            <div class="card__title">${escapeHtml(s.title)}</div>
            <p class="card__text">${escapeHtml(s.description)}</p>
          </div>
        </a>
      </li>
    `;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : str;
    return div.innerHTML;
  }
  function escapeAttr(str) {
    return escapeHtml(str).replace(/"/g, '&quot;');
  }
})();
</script>
</body>
</html>
