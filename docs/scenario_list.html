<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scenario</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #161410;
  color: #e9e5da;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 15px;
  line-height: 1.6;
  padding: 40px 20px;
}
.container {
  max-width: 1200px;
  margin: 0 auto;
}
header {
  text-align: center;
  margin-bottom: 50px;
}
header h1 {
  font-family: 'Playfair Display', serif;
  font-size: 56px;
  letter-spacing: 3px;
  color: #c98a3c;
  margin-bottom: 16px;
  font-weight: 700;
}
header p {
  color: #999;
  font-size: 13px;
  letter-spacing: 1px;
}

.controls {
  display: flex;
  justify-content: center;
  margin-bottom: 40px;
}
.search-box {
  width: 100%;
  max-width: 400px;
}
.search-box input {
  width: 100%;
  padding: 8px 12px;
  background: #242320;
  border: 1px solid #4a4842;
  color: #e9e5da;
  border-radius: 3px;
  font-size: 13px;
}
.search-box input::placeholder {
  color: #666;
}
.search-box input:focus {
  outline: none;
  border-color: #c98a3c;
}

.results-info {
  text-align: center;
  margin-bottom: 32px;
  color: #999;
  font-size: 12px;
}

.loading {
  text-align: center;
  padding: 60px 20px;
  color: #999;
}
.error {
  background: #4a2a2a;
  border: 1px solid #8a4a4a;
  color: #ff9999;
  padding: 16px;
  border-radius: 4px;
  margin: 20px 0;
}

ul.cards {
  list-style: none;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 24px;
  margin-bottom: 40px;
}
li.cards__item {
  list-style: none;
}

.card {
  display: flex;
  flex-direction: column;
  height: 100%;
  background: #242320;
  border: 1px solid #4a4842;
  border-radius: 6px;
  overflow: hidden;
  transition: all .3s;
}
.card:hover {
  border-color: #c98a3c;
  box-shadow: 0 4px 12px rgba(201, 138, 60, 0.2);
  transform: translateY(-4px);
}

.card__image {
  width: 100%;
  height: 200px;
  background: linear-gradient(135deg, #4a4842 0%, #242320 100%);
  position: relative;
  overflow: hidden;
}
.card__image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* デフォルト画像パターン */
.card__image--default {
  background: linear-gradient(135deg, #c98a3c 0%, #8a5c2a 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Playfair Display', serif;
  font-size: 24px;
  color: rgba(255,255,255,.3);
  text-align: center;
  padding: 20px;
}

.card__content {
  padding: 20px;
  display: flex;
  flex-direction: column;
  flex: 1;
}
.card__title {
  font-family: 'Playfair Display', serif;
  font-size: 18px;
  font-weight: 700;
  color: #c98a3c;
  margin-bottom: 8px;
  line-height: 1.3;
}
.card__system {
  font-size: 11px;
  color: #999;
  margin-bottom: 12px;
}
.card__text {
  font-size: 13px;
  color: #ccc;
  flex: 1;
  margin-bottom: 12px;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
}
.card__tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.tag {
  display: inline-block;
  background: #1a1a17;
  border: 1px solid #4a4842;
  color: #999;
  padding: 4px 8px;
  border-radius: 2px;
  font-size: 10px;
}
.tag.system {
  background: #c98a3c;
  border-color: #c98a3c;
  color: #161410;
  font-weight: 600;
}

.card__btn {
  margin-top: 12px;
  padding: 8px 12px;
  background: #c98a3c;
  border: none;
  color: #161410;
  border-radius: 3px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s;
}
.card__btn:hover {
  background: #d99f4a;
}

footer {
  text-align: center;
  color: #666;
  font-size: 12px;
  padding-top: 20px;
  border-top: 1px solid #4a4842;
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Scenario</h1>
  </header>

  <div class="controls">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="検索...">
    </div>
  </div>

  <div class="results-info">
    <span id="resultsCount">読み込み中...</span>
  </div>

  <div class="loading" id="loading">
    シナリオを取得中...
  </div>
  <div class="error" id="error" style="display: none;"></div>
  <ul class="cards" id="scenarioGrid"></ul>

  <footer>
    <p>© 2026 Scenario Generator | Powered by GitHub</p>
  </footer>
</div>

<script>
(async function() {
  const REPO = 'notenog/memo';
  const FOLDER = 'docs/scenario';
  const GITHUB_PAGES_BASE = 'https://notenog.github.io/memo/scenario';
  let allScenarios = [];

  let token = localStorage.getItem('gh_token_list_page');
  if (!token) {
    token = prompt('GitHub Personal Access Token を入力してください:\n(Contents読み取り権限があれば十分です)');
    if (token) {
      localStorage.setItem('gh_token_list_page', token);
    }
  }

  const headers = token ? { Authorization: `token ${token}` } : {};

  try {
    // ファイル一覧取得
    const listRes = await fetch(
      `https://api.github.com/repos/${REPO}/contents/${FOLDER}`,
      { headers }
    );
    if (!listRes.ok) throw new Error(`API Error: ${listRes.status}`);

    const files = await listRes.json();
    const htmlFiles = files.filter(f => f.name.endsWith('.html') && f.type === 'file');

    if (htmlFiles.length === 0) {
      throw new Error('HTMLファイルが見つかりません');
    }

    // 各HTMLをfetchしてメタデータ抽出
    for (const file of htmlFiles) {
      try {
        const fileRes = await fetch(file.download_url);
        if (!fileRes.ok) continue;
        const html = await fileRes.text();

        const doc = new DOMParser().parseFromString(html, 'text/html');
        const title = doc.querySelector('meta[name="scenario-title"]')?.content || file.name.replace('.html', '');
        const genre = doc.querySelector('meta[name="scenario-genre"]')?.content || '';
        const tags = doc.querySelector('meta[name="scenario-tags"]')?.content || '';
        const description = doc.querySelector('meta[name="scenario-description"]')?.content || '(説明なし)';
        
        // 最初の img タグを画像として抽出
        let imageUrl = null;
        const imgMatch = html.match(/<img[^>]+src="([^"]+)"/);
        if (imgMatch) {
          imageUrl = imgMatch[1];
        }

        const tagArray = tags ? tags.split(/[,、]/).map(t => t.trim()).filter(t => t) : [];

        const pageUrl = `${GITHUB_PAGES_BASE}/${file.name}`;

        allScenarios.push({
          name: file.name,
          title,
          genre,
          tags: tagArray,
          description,
          url: pageUrl,
          image: imageUrl
        });
      } catch (e) {
        console.error(`Failed to fetch ${file.name}:`, e);
      }
    }

    // ソート(タイトル順)
    allScenarios.sort((a, b) => a.title.localeCompare(b.title, 'ja'));

    // UI初期化
    document.getElementById('loading').style.display = 'none';
    renderScenarios(allScenarios);

    // 検索
    document.getElementById('searchInput').addEventListener('input', () => {
      renderScenarios(filterScenarios());
    });

  } catch (error) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = 'block';
    document.getElementById('error').textContent = `エラー: ${error.message}`;
    console.error(error);
  }

  function filterScenarios() {
    const searchText = document.getElementById('searchInput').value.toLowerCase();

    return allScenarios.filter(s => {
      return s.title.toLowerCase().includes(searchText) ||
             s.description.toLowerCase().includes(searchText) ||
             s.genre.toLowerCase().includes(searchText) ||
             s.tags.some(t => t.toLowerCase().includes(searchText));
    });
  }

  function renderScenarios(scenarios) {
    const grid = document.getElementById('scenarioGrid');
    document.getElementById('resultsCount').textContent = `${scenarios.length}件のシナリオ`;

    if (scenarios.length === 0) {
      grid.innerHTML = '<li style="grid-column: 1/-1; text-align: center; color: #999; padding: 40px;">該当するシナリオがありません</li>';
      return;
    }

    grid.innerHTML = scenarios.map(s => {
      const imageHtml = s.image 
        ? `<img src="${s.image}" alt="${escapeHtml(s.title)}">`
        : `<div class="card__image--default">${s.title.substring(0, 1)}</div>`;
      
      return `
        <li class="cards__item">
          <div class="card">
            <div class="card__image">
              ${imageHtml}
            </div>
            <div class="card__content">
              <div class="card__title">${escapeHtml(s.title)}</div>
              ${s.genre ? `<div class="card__system">${escapeHtml(s.genre)}</div>` : ''}
              <p class="card__text">${escapeHtml(s.description)}</p>
              <div class="card__tags">
                ${s.genre ? `<span class="tag system">${escapeHtml(s.genre)}</span>` : ''}
                ${s.tags.map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join('')}
              </div>
              <a href="${s.url}" target="_blank" rel="noopener" style="text-decoration: none;">
                <button class="card__btn">View Scenario →</button>
              </a>
            </div>
          </div>
        </li>
      `;
    }).join('');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
})();
</script>
</body>
</html>
