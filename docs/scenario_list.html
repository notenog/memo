<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scenario</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root[data-theme="dark"] {
  --bg: #161410;
  --bg-blur: rgba(22,20,16,.94);
  --surface: #242320;
  --border: #33312b;
  --border-strong: #4a4842;
  --text: #e9e5da;
  --text-dim: #9d998f;
  --text-faint: #6d6a61;
  --accent: #c98a3c;
  --accent-contrast: #161410;
  --badge-bg: #c98a3c;
  --badge-text: #161410;
  --overlay: 12,11,9;
  --card-shadow: rgba(0,0,0,.45);
  --err-bg: #3a2422;
  --err-border: #7a4a45;
  --err-text: #e59a95;
  --default-l1: 30%;
  --default-l2: 15%;
  --default-s: 30%;
  --default-letter: rgba(255,255,255,.22);
  --header-bg: rgba(26,35,43,.94);
  --header-title: #c98a3c;
  --header-text: #f2efe6;
  --header-dim: rgba(255,255,255,.6);
  --header-border: rgba(255,255,255,.14);
  --field-bg: rgba(255,255,255,.07);
  --field-border: rgba(255,255,255,.2);
  --chip-active-bg: #c98a3c;
  --chip-active-text: #161410;
}
:root[data-theme="light"] {
  --bg: #fdfdfd;
  --bg-blur: rgba(253,253,253,.92);
  --surface: #ffffff;
  --border: #e5e5e5;
  --border-strong: #d8d8d8;
  --text: #2b2b2b;
  --text-dim: #4e4e4e;
  --text-faint: #b8b8b8;
  --accent: #284b63;
  --accent-contrast: #ffffff;
  --badge-bg: #ffffff;
  --badge-text: #284b63;
  --overlay: 28,42,54;
  --card-shadow: rgba(40,75,99,.16);
  --err-bg: #fdf0ef;
  --err-border: #e0b4b0;
  --err-text: #a04a44;
  --default-l1: 55%;
  --default-l2: 35%;
  --default-s: 22%;
  --default-letter: rgba(255,255,255,.5);
  --header-bg: rgba(40,75,99,.96);
  --header-title: #ffffff;
  --header-text: #ffffff;
  --header-dim: rgba(255,255,255,.72);
  --header-border: rgba(255,255,255,.2);
  --field-bg: rgba(255,255,255,.14);
  --field-border: rgba(255,255,255,.32);
  --chip-active-bg: #ffffff;
  --chip-active-text: #284b63;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

#hoverBackdrop {
  position: fixed;
  inset: -40px;
  z-index: 0;
  background-size: cover;
  background-position: center;
  filter: blur(14px) saturate(1.12);
  opacity: 0;
  transition: opacity .55s ease;
  pointer-events: none;
}
:root[data-theme="dark"] #hoverBackdrop.on { opacity: .30; }
:root[data-theme="light"] #hoverBackdrop.on { opacity: .22; }
.site-header, main, footer { position: relative; z-index: 1; }
body {
  background: var(--bg);
  color: var(--text-dim);
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 15px;
  line-height: 1.6;
  transition: background .25s, color .25s;
}
.container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

/* ---- ヘッダー ---- */
.site-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--header-bg);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--header-border);
}
.header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px 28px;
  padding: 40px 20px;
  flex-wrap: wrap;
  transition: padding .3s ease;
}
.site-title {
  font-family: 'Playfair Display', serif;
  font-size: 44px;
  letter-spacing: 2px;
  color: var(--header-title);
  font-weight: 700;
  line-height: 1;
  transition: font-size .3s ease;
}
.header-right {
  display: flex;
  align-items: center;
  gap: 10px 18px;
  margin-left: auto;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.header-tools {
  display: flex;
  align-items: center;
  gap: 10px;
}

/* スクロール後の縮小状態 */
.site-header.minimized .header-inner { padding: 10px 20px; }
.site-header.minimized .site-title { font-size: 24px; }
.site-header.minimized .nav-item {
  transition: padding .3s ease, font-size .3s ease; padding: 4px 11px; font-size: 11px; }
.search-box { position: relative; }
.search-box svg.icon-search {
  position: absolute;
  left: 9px;
  top: 50%;
  transform: translateY(-50%);
  width: 13px;
  height: 13px;
  stroke: var(--header-dim);
  fill: none;
  stroke-width: 2;
  pointer-events: none;
}
.search-box input {
  width: 210px;
  padding: 7px 10px 7px 28px;
  background: var(--field-bg);
  border: 1px solid var(--field-border);
  color: var(--header-text);
  border-radius: 3px;
  font-size: 13px;
  font-family: inherit;
  transition: border-color .2s, width .2s;
}
.search-box input::placeholder { color: var(--header-dim); }
.search-box input:focus { outline: none; border-color: var(--header-text); width: 250px; }

.sort-select {
  padding: 7px 10px;
  background: var(--field-bg);
  border: 1px solid var(--field-border);
  color: var(--header-text);
  border-radius: 3px;
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
}
.sort-select option { color: #222; background: #fff; }
.sort-select:focus { outline: none; border-color: var(--header-text); }

.theme-toggle {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  background: var(--field-bg);
  border: 1px solid var(--field-border);
  border-radius: 3px;
  cursor: pointer;
  transition: border-color .2s;
  flex-shrink: 0;
}
.theme-toggle:hover { border-color: var(--header-text); }
.theme-toggle svg {
  width: 15px;
  height: 15px;
  stroke: var(--header-text);
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
}
:root[data-theme="dark"] .icon-sun { display: block; }
:root[data-theme="dark"] .icon-moon { display: none; }
:root[data-theme="light"] .icon-sun { display: none; }
:root[data-theme="light"] .icon-moon { display: block; }

.system-nav {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.nav-item {
  padding: 6px 14px;
  background: transparent;
  border: 1px solid var(--field-border);
  color: var(--header-text);
  border-radius: 14px;
  font-size: 11.5px;
  cursor: pointer;
  transition: all .2s;
  user-select: none;
  white-space: nowrap;
}
.nav-item:hover { border-color: var(--header-text); background: var(--field-bg); }
.nav-item.active {
  background: var(--chip-active-bg);
  border-color: var(--chip-active-bg);
  color: var(--chip-active-text);
  font-weight: 700;
}
.nav-item .count { opacity: .6; margin-left: 5px; font-size: 10px; }

/* ---- 本文 ---- */
main { padding: 32px 0 60px; }
.results-info {
  color: var(--text-faint);
  font-size: 11.5px;
  margin-bottom: 26px;
  letter-spacing: .5px;
}
.loading { text-align: center; padding: 60px 20px; color: var(--text-faint); }
.error {
  background: var(--err-bg);
  border: 1px solid var(--err-border);
  color: var(--err-text);
  padding: 14px 16px;
  border-radius: 4px;
  margin: 20px 0;
  font-size: 13px;
}

.system-section { margin-bottom: 52px; scroll-margin-top: 110px; }
.system-heading {
  font-size: 14px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 1.5px;
  padding-bottom: 8px;
  margin-bottom: 22px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: baseline;
  gap: 10px;
}
.system-heading .count { font-size: 11px; color: var(--text-faint); font-weight: 400; }

/* ---- ポスター型カード ---- */
ul.cards {
  list-style: none;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 20px;
}
li.cards__item { list-style: none; }

.card {
  position: relative;
  display: block;
  aspect-ratio: 2 / 3;
  border-radius: 6px;
  overflow: hidden;
  background: var(--surface);
  border: 1px solid var(--border);
  text-decoration: none;
  color: inherit;
  cursor: pointer;
  transition: border-color .3s, box-shadow .3s, transform .3s;
}
.card:hover {
  border-color: var(--accent);
  box-shadow: 0 8px 22px var(--card-shadow);
  transform: translateY(-4px);
}

.card__image { position: absolute; inset: 0; overflow: hidden; }
.card__image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform .5s ease;
}
.card:hover .card__image img { transform: scale(1.06); }
.card__image--default {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Playfair Display', serif;
  font-size: 58px;
  color: var(--default-letter);
  transition: transform .5s ease;
}
.card:hover .card__image--default { transform: scale(1.06); }

.card__overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top,
    rgba(var(--overlay),.95) 0%,
    rgba(var(--overlay),.8) 32%,
    rgba(var(--overlay),.14) 62%,
    rgba(var(--overlay),0) 100%);
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 16px 15px;
}
.card__system {
  align-self: flex-start;
  background: var(--badge-bg);
  color: var(--badge-text);
  padding: 3px 8px;
  border-radius: 2px;
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: .5px;
  margin-bottom: 8px;
}
.card__title {
  font-size: 15.5px;
  font-weight: 700;
  color: #fff;
  line-height: 1.4;
  text-shadow: 0 1px 4px rgba(0,0,0,.5);
}
.card__text {
  font-size: 11.5px;
  color: rgba(255,255,255,.82);
  line-height: 1.65;
  margin-top: 0;
  max-height: 0;
  opacity: 0;
  overflow: hidden;
  transition: max-height .35s ease, opacity .3s ease, margin-top .35s ease;
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
}
.card:hover .card__text { max-height: 90px; opacity: 1; margin-top: 8px; }

footer {
  text-align: center;
  color: var(--text-faint);
  font-size: 11.5px;
  padding: 24px 0 40px;
  border-top: 1px solid var(--border);
}

@media (hover: none) {
  .card__text { max-height: 70px; opacity: 1; margin-top: 8px; -webkit-line-clamp: 3; }
}
@media (max-width: 600px) {
  .header-inner { padding: 20px 20px; }
  .site-title { font-size: 28px; }
  .site-header.minimized .header-inner { padding: 10px 20px; }
  .site-header.minimized .site-title { font-size: 20px; }
  .header-right { justify-content: flex-start; }
  .system-nav { justify-content: flex-start; }
  .search-box input { width: 130px; }
  .search-box input:focus { width: 150px; }
  ul.cards { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
}
</style>
</head>
<body>

<div id="hoverBackdrop"></div>

<header class="site-header" id="siteHeader">
  <div class="container header-inner">
    <div class="site-title">Scenario</div>
    <div class="header-right">
      <nav class="system-nav" id="systemNav"></nav>
      <div class="header-tools">
        <div class="search-box">
          <svg class="icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
          <input type="text" id="searchInput" placeholder="検索...">
        </div>
        <select class="sort-select" id="sortSelect">
          <option value="newest">新着順</option>
          <option value="title">タイトル順</option>
        </select>
        <div class="theme-toggle" id="themeToggle" title="ライト / ダーク切り替え">
          <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><line x1="12" y1="1.5" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22.5"/><line x1="1.5" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22.5" y2="12"/><line x1="4.6" y1="4.6" x2="6.4" y2="6.4"/><line x1="17.6" y1="17.6" x2="19.4" y2="19.4"/><line x1="4.6" y1="19.4" x2="6.4" y2="17.6"/><line x1="17.6" y1="6.4" x2="19.4" y2="4.6"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24"><path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11z"/></svg>
        </div>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="container">
    <div class="results-info"><span id="resultsCount">読み込み中...</span></div>
    <div class="loading" id="loading">シナリオを取得中...</div>
    <div class="error" id="error" style="display:none;"></div>
    <div id="scenarioSections"></div>
  </div>
</main>

<footer>
  <p>© 2026 Scenario Generator | Powered by GitHub</p>
</footer>

<script>
// ---- スクロールでヘッダーを縮小 ----
(function() {
  const header = document.getElementById('siteHeader');
  const TRIGGER = 80;
  let ticking = false;
  function update() {
    header.classList.toggle('minimized', window.scrollY >= TRIGGER);
    ticking = false;
  }
  window.addEventListener('scroll', () => {
    if (!ticking) { ticking = true; requestAnimationFrame(update); }
  }, { passive: true });
  update();
})();

// ---- テーマ切り替え ----
(function() {
  const saved = localStorage.getItem('scenario_list_theme');
  if (saved) document.documentElement.setAttribute('data-theme', saved);
  document.getElementById('themeToggle').addEventListener('click', () => {
    const now = document.documentElement.getAttribute('data-theme');
    const next = now === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('scenario_list_theme', next);
  });
})();

(async function() {
  const REPO = 'notenog/memo';
  const FOLDER = 'docs/scenario';
  const GITHUB_PAGES_BASE = 'https://notenog.github.io/memo/scenario';
  let allScenarios = [];
  let allSystems = [];

  // 公開リポジトリなのでトークンなしでも読めます。
  // 保存済みトークンがある場合のみ、レート制限緩和のために使用します。
  const token = localStorage.getItem('gh_token_list_page');
  const headers = token ? { Authorization: `token ${token}` } : {};

  function systemHue(name) {
    let h = 0;
    for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
    return h;
  }

  async function fetchUpdatedAt(fileName) {
    try {
      const res = await fetch(
        `https://api.github.com/repos/${REPO}/commits?path=${encodeURIComponent(FOLDER + '/' + fileName)}&per_page=1`,
        { headers }
      );
      if (!res.ok) return null;
      const commits = await res.json();
      return commits[0]?.commit?.committer?.date || null;
    } catch (e) { return null; }
  }

  try {
    const listRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${FOLDER}`, { headers });
    if (!listRes.ok) {
      if (listRes.status === 403) {
        throw new Error('アクセスが一時的に制限されています。しばらく時間をおいてから再読み込みしてください。');
      }
      throw new Error(`シナリオ一覧を取得できませんでした (${listRes.status})`);
    }

    const files = await listRes.json();
    const htmlFiles = files.filter(f => f.name.endsWith('.html') && f.type === 'file');
    if (htmlFiles.length === 0) throw new Error('HTMLファイルが見つかりません');

    await Promise.all(htmlFiles.map(async file => {
      try {
        const [fileRes, updatedAt] = await Promise.all([
          fetch(file.download_url),
          fetchUpdatedAt(file.name)
        ]);
        if (!fileRes.ok) return;
        const html = await fileRes.text();

        const doc = new DOMParser().parseFromString(html, 'text/html');
        const title = doc.querySelector('meta[name="scenario-title"]')?.content || file.name.replace('.html', '');
        const system = (doc.querySelector('meta[name="scenario-genre"]')?.content || 'その他').trim() || 'その他';
        const description = doc.querySelector('meta[name="scenario-description"]')?.content || '';

        let imageUrl = null;
        const imgMatch = html.match(/<img[^>]+src="([^"]+)"/);
        if (imgMatch) imageUrl = imgMatch[1];

        allScenarios.push({
          name: file.name,
          title,
          system,
          description,
          url: `${GITHUB_PAGES_BASE}/${file.name}`,
          image: imageUrl,
          updatedAt: updatedAt ? new Date(updatedAt).getTime() : 0
        });
      } catch (e) {
        console.error(`Failed to fetch ${file.name}:`, e);
      }
    }));

    allSystems = Array.from(new Set(allScenarios.map(s => s.system))).sort((a, b) => a.localeCompare(b, 'ja'));

    document.getElementById('loading').style.display = 'none';
    renderNav();
    render();

    document.getElementById('searchInput').addEventListener('input', render);
    document.getElementById('sortSelect').addEventListener('change', render);

  } catch (error) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = 'block';
    document.getElementById('error').textContent = `エラー: ${error.message}`;
    console.error(error);
  }

  function renderNav() {
    const nav = document.getElementById('systemNav');
    nav.innerHTML = allSystems.map(sys => {
      const n = allScenarios.filter(s => s.system === sys).length;
      return `<div class="nav-item" data-system="${escapeAttr(sys)}">${escapeHtml(sys)}<span class="count">${n}</span></div>`;
    }).join('');
    nav.querySelectorAll('.nav-item').forEach(el => {
      el.addEventListener('click', () => {
        el.classList.toggle('active');
        render();
      });
    });
  }

  function getFiltered() {
    const searchText = document.getElementById('searchInput').value.toLowerCase().trim();
    const activeSystems = Array.from(document.querySelectorAll('.nav-item.active')).map(t => t.dataset.system);
    return allScenarios.filter(s => {
      const matchSearch = !searchText ||
        s.title.toLowerCase().includes(searchText) ||
        s.description.toLowerCase().includes(searchText) ||
        s.system.toLowerCase().includes(searchText);
      const matchSystem = activeSystems.length === 0 || activeSystems.includes(s.system);
      return matchSearch && matchSystem;
    });
  }

  function render() {
    const sortMode = document.getElementById('sortSelect').value;
    const scenarios = getFiltered().sort((a, b) =>
      sortMode === 'newest'
        ? (b.updatedAt - a.updatedAt) || a.title.localeCompare(b.title, 'ja')
        : a.title.localeCompare(b.title, 'ja')
    );

    const wrap = document.getElementById('scenarioSections');
    document.getElementById('resultsCount').textContent = `${scenarios.length} scenarios`;

    if (scenarios.length === 0) {
      wrap.innerHTML = '<div style="text-align:center;color:var(--text-faint);padding:60px 20px;font-size:13px;">該当するシナリオがありません</div>';
      return;
    }

    const groups = {};
    scenarios.forEach(s => { (groups[s.system] = groups[s.system] || []).push(s); });
    const order = Object.keys(groups).sort((a, b) => a.localeCompare(b, 'ja'));

    wrap.innerHTML = order.map(sys => `
      <section class="system-section" id="sys-${encodeURIComponent(sys)}">
        <h2 class="system-heading">${escapeHtml(sys)}<span class="count">${groups[sys].length}件</span></h2>
        <ul class="cards">${groups[sys].map(cardHTML).join('')}</ul>
      </section>
    `).join('');

    bindHoverBackdrop();
  }

  function bindHoverBackdrop() {
    const bd = document.getElementById('hoverBackdrop');
    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('mouseenter', () => {
        const img = card.dataset.img;
        const hue = card.dataset.hue;
        bd.style.backgroundImage = img
          ? `url("${img}")`
          : `linear-gradient(150deg, hsl(${hue} 45% 45%), hsl(${hue} 40% 25%))`;
        bd.classList.add('on');
      });
      card.addEventListener('mouseleave', () => bd.classList.remove('on'));
    });
  }

  function cardHTML(s) {
    const hue = systemHue(s.system);
    const imageHtml = s.image
      ? `<img src="${escapeAttr(s.image)}" alt="${escapeAttr(s.title)}">`
      : `<div class="card__image--default" style="background:linear-gradient(150deg, hsl(${hue} var(--default-s) var(--default-l1)) 0%, hsl(${hue} var(--default-s) var(--default-l2)) 100%)">${escapeHtml(s.title.substring(0, 1))}</div>`;
    return `
      <li class="cards__item">
        <a class="card" href="${escapeAttr(s.url)}" target="_blank" rel="noopener"
           data-img="${s.image ? escapeAttr(s.image) : ''}" data-hue="${hue}">
          <div class="card__image">${imageHtml}</div>
          <div class="card__overlay">
            <span class="card__system">${escapeHtml(s.system)}</span>
            <div class="card__title">${escapeHtml(s.title)}</div>
            ${s.description ? `<p class="card__text">${escapeHtml(s.description)}</p>` : ''}
          </div>
        </a>
      </li>
    `;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : str;
    return div.innerHTML;
  }
  function escapeAttr(str) {
    return escapeHtml(str).replace(/"/g, '&quot;');
  }
})();
</script>
</body>
</html>
