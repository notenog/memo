<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ネクロニカ データ図鑑＆パレット生成</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141019;
  --panel:#1d1822;
  --panel2:#241e2b;
  --border:#3a3040;
  --border-soft:#2a2430;
  --text:#e9e2e6;
  --text-muted:#948a97;
  --accent:#9c3350;
  --accent-soft:#5c2334;
  --accent-text:#f0a4b6;
  --legion:#4d6b4a;
  --legion-text:#9fc797;
  --ok:#5a8f5f;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Zen Kaku Gothic New', sans-serif;
  line-height:1.55;
  padding:0 0 4rem;
}
h1,h2,h3,h4{
  font-family:'Zen Old Mincho', serif;
  font-weight:700;
  margin:0 0 .3em;
}
header{
  padding:1.8rem 1.5rem 1.2rem;
  text-align:center;
  border-bottom:1px solid var(--border-soft);
}
header h1{font-size:1.5rem;letter-spacing:.06em;}
header p{color:var(--text-muted);font-size:.82rem;margin:0;}
nav.tabs{
  display:flex;
  gap:.5rem;
  justify-content:center;
  padding:1rem 1.5rem 0;
}
nav.tabs button{
  background:transparent;
  border:1px solid var(--border);
  color:var(--text-muted);
  padding:.5rem 1.2rem;
  font-family:'Zen Kaku Gothic New',sans-serif;
  font-size:.85rem;
  cursor:pointer;
  border-radius:2px;
}
nav.tabs button.active{
  color:var(--text);
  border-color:var(--accent);
  background:var(--accent-soft);
}
.section{display:none;padding:1.2rem 1.5rem;}
.section.active{display:block;}

/* ---- 登録パネル（折りたたみ式・小さめ） ---- */
.register-toggle{
  display:inline-flex;
  align-items:center;
  gap:.4rem;
  background:var(--panel2);
  border:1px solid var(--border);
  color:var(--text-muted);
  padding:.4rem .9rem;
  border-radius:20px;
  font-size:.8rem;
  cursor:pointer;
  margin-bottom:1rem;
}
.register-toggle:hover{color:var(--accent-text);border-color:var(--accent);}
.register-panel{
  display:none;
  background:var(--panel);
  border:1px solid var(--border-soft);
  border-radius:4px;
  padding:1rem 1.2rem;
  margin-bottom:1.2rem;
}
.register-panel.open{display:block;}
.register-panel textarea{
  width:100%;
  min-height:140px;
  background:var(--panel2);
  border:1px solid var(--border);
  color:var(--text);
  font-family:ui-monospace,'SFMono-Regular',monospace;
  font-size:.78rem;
  padding:.6rem;
  border-radius:3px;
  resize:vertical;
}
.hint{color:var(--text-muted);font-size:.76rem;margin-top:.4rem;}
button.act{
  background:var(--accent-soft);
  border:1px solid var(--accent);
  color:var(--accent-text);
  padding:.45rem 1rem;
  border-radius:3px;
  font-size:.82rem;
  cursor:pointer;
  margin-top:.5rem;
}
button.act:hover{background:var(--accent);color:#fff;}
button.ghost{
  background:transparent;
  border:1px solid var(--border);
  color:var(--text-muted);
  padding:.3rem .7rem;
  border-radius:3px;
  font-size:.72rem;
  cursor:pointer;
}
button.ghost:hover{color:var(--accent-text);border-color:var(--accent);}

/* ---- 横並び一覧（メイン） ---- */
.hlist{
  display:flex;
  gap:1rem;
  overflow-x:auto;
  padding-bottom:1rem;
  align-items:flex-start;
}
.hcard{
  flex:0 0 380px;
  max-width:420px;
  background:var(--panel);
  border:1px solid var(--border-soft);
  border-top:3px solid var(--accent);
  border-radius:4px;
  padding:1rem 1.1rem;
  position:relative;
}
.hcard.legion{border-top-color:var(--legion);}
.hcard .del{position:absolute;top:.7rem;right:.8rem;font-size:.68rem;color:var(--text-muted);cursor:pointer;background:none;border:none;}
.hcard h3{font-size:1.05rem;color:var(--accent-text);margin-bottom:.1em;padding-right:2.5rem;}
.legion h3{color:var(--legion-text);}
.hcard .sub{color:var(--text-muted);font-size:.74rem;margin-bottom:.5em;}
.hcard .notes{color:var(--text-muted);font-size:.72rem;margin-bottom:.6em;font-style:italic;}
.part-block{margin-bottom:.7rem;}
.part-block h4{
  font-family:'Zen Old Mincho',serif;
  font-size:.85rem;
  color:var(--accent-text);
  border-bottom:1px solid var(--border-soft);
  padding-bottom:.15em;
  margin:0 0 .35em;
}
.legion .part-block h4{color:var(--legion-text);}
.mline{
  font-size:.74rem;
  margin-bottom:.5em;
  padding-bottom:.5em;
  border-bottom:1px dashed var(--border-soft);
}
.mline:last-child{border-bottom:none;}
.mline .mname{font-weight:700;color:var(--text);}
.mline .mname.broken{color:#c0706f;text-decoration:line-through;}
.mline .mname.used{color:#c9a15a;}
.mline .mmeta{color:var(--text-muted);font-size:.66rem;}
.mline .meffect{margin-top:.15em;}
.mline-head{display:flex;align-items:center;gap:.6rem;margin-bottom:.15em;flex-wrap:wrap;}
.mchk{display:inline-flex;align-items:center;gap:.2rem;font-size:.66rem;color:var(--text-muted);cursor:pointer;user-select:none;}
.mchk input{margin:0;cursor:pointer;}
.mcopy{
  margin-left:auto;
  background:none;
  border:1px solid var(--border-soft);
  color:var(--text-muted);
  font-size:.62rem;
  padding:.1rem .5rem;
  border-radius:10px;
  cursor:pointer;
}
.mcopy:hover{color:var(--accent-text);border-color:var(--accent);}
#toast{
  position:fixed;
  bottom:1.2rem;
  left:50%;
  transform:translateX(-50%);
  background:var(--accent-soft);
  color:var(--accent-text);
  border:1px solid var(--accent);
  padding:.5rem 1.1rem;
  border-radius:20px;
  font-size:.8rem;
  display:none;
  z-index:999;
}
.card-actions{margin-bottom:.8rem;padding-bottom:.7rem;border-bottom:1px solid var(--border-soft);display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;}
.copy-msg{font-size:.68rem;color:var(--ok);}
textarea.palette-out{
  width:100%;
  min-height:160px;
  margin-top:.5rem;
  background:var(--panel2);
  border:1px solid var(--border);
  color:var(--text);
  font-family:ui-monospace,'SFMono-Regular',monospace;
  font-size:.72rem;
  padding:.6rem;
  border-radius:3px;
}
.notice{color:var(--text-muted);font-size:.85rem;text-align:center;padding:3rem 1rem;width:100%;}
</style>
</head>
<body>
<header>
  <h1>永い後日談のネクロニカ　データ図鑑＆パレット生成</h1>
  <p>登録したPC / 手駒を横並びで見比べつつ、Tekey用パレットも書き出せます</p>
</header>

<nav class="tabs">
  <button data-tab="pc" class="active">PC一覧</button>
  <button data-tab="enemy">手駒一覧</button>
</nav>

<!-- PC TAB -->
<div class="section active" id="tab-pc">
  <button class="register-toggle" onclick="toggleRegisterPanel('pc-register')">＋ PCを新規登録</button>
  <div class="register-panel" id="pc-register">
    <p class="hint">charasheet.vampire-blood.net の「テキスト」出力、またはキャラシページの生HTMLソースをそのまま貼ってください。どちらの形式かは自動判定します。</p>
    <textarea id="pc-input" placeholder="タイトル：ピュアレクコート&#10;キャラクター名：ウェスト&#10;..."></textarea>
    <div><button class="act" onclick="parseAndAddPC()">解析して登録</button></div>
    <div id="pc-parse-msg" class="hint"></div>
  </div>
  <div class="hlist" id="pc-hlist"></div>
</div>

<!-- ENEMY(手駒) TAB -->
<div class="section" id="tab-enemy">
  <button class="register-toggle" onclick="toggleRegisterPanel('enemy-register')">＋ 手駒を新規登録</button>
  <div class="register-panel" id="enemy-register">
    <p class="hint">「名前 / (タイプ・)最大行動値N(・悪意N) / 【マニューバ名】《タイミング/コスト/射程》効果...」の形式。タイプ（レギオン/ホラー/サヴァント）は本文中の記載から自動判定します（「悪意」があればホラー扱い）。複数体を空行区切りでまとめて貼ってもOKです。</p>
    <textarea id="enemy-input">ハウンド
悪意：2　最大行動値：9
【セイバートゥース】　《アクション/2/0》　肉弾攻撃2
【けもあし】　《アクション/2/自身》　移動1~2
【強化脊髄】　《オート/なし/自身》　最大行動値+2
【しっぽ】　《オート/なし/自身》　最大行動値+1
【はらわた】　《オート/なし/なし》　なし
アンデッドの軍用犬。半ば機械化された強靭な体で機敏な襲撃を繰り返す。</textarea>
    <div><button class="act" onclick="parseAndAddEnemies()">解析して登録</button></div>
    <div id="enemy-parse-msg" class="hint"></div>
  </div>
  <div class="hlist" id="enemy-hlist"></div>
</div>

<div id="toast"></div>

<script>
let PCS = [];
let ENEMIES = [];

// ---------- storage ----------
// window.storage はClaudeのアーティファクトプレビュー内でのみ使える特別なAPIで、
// GitHub Pagesやローカルで直接開いた場合には存在しない（保存が黙って失敗する）。
// このツールは実ブラウザで動かす前提なので、標準のlocalStorageを使う。
function loadStore(){
  try{ PCS = JSON.parse(localStorage.getItem('nechro_pcs') || '[]'); }catch(e){ PCS = []; }
  try{ ENEMIES = JSON.parse(localStorage.getItem('nechro_enemies') || '[]'); }catch(e){ ENEMIES = []; }
}
function savePCs(){
  try{ localStorage.setItem('nechro_pcs', JSON.stringify(PCS)); }catch(e){ console.error('PC保存に失敗:', e); }
}
function saveEnemies(){
  try{ localStorage.setItem('nechro_enemies', JSON.stringify(ENEMIES)); }catch(e){ console.error('手駒保存に失敗:', e); }
}

// ---------- tabs ----------
document.querySelectorAll('nav.tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.section').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
  });
});

function toggleRegisterPanel(id){
  const panel = document.getElementById(id);
  panel.classList.toggle('open');
  const btn = document.querySelector(`button[onclick="toggleRegisterPanel('${id}')"]`);
  if(btn){
    btn.textContent = panel.classList.contains('open')
      ? '－登録エリアを閉じる'
      : (id === 'pc-register' ? '＋ PCを新規登録' : '＋ 手駒を新規登録');
  }
}

// ---------- PC parsing ----------
const PART_LABELS = ['','ポジション','メインクラス','サブクラス','頭','腕','胴','足'];
const TIMING_LABELS = ['オート','アクション','ジャッジ','ダメージ','ラピッド'];

function parsePCHtml(html){
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const val = sel => { const el = doc.querySelector(sel); return el ? el.value.trim() : ''; };

  const title = val('input[name="data_title"]');
  const name = val('input[name="pc_name"]');
  const position = val('input[name="Position_Name"]');
  const mainClass = val('input[name="MCLS_Name"]');
  const subClass = val('input[name="SCLS_Name"]');
  const initialArea = val('input[name="sex"]') || '花園';
  const maxAction = parseInt(val('input[name="Act_Total"]'),10) || 10;

  const maneuvers = [];
  doc.querySelectorAll('#Table_Power tbody tr').forEach(tr=>{
    const nameInput = tr.querySelector('input[name="Power_name[]"]');
    if(!nameInput) return;
    const mname = nameInput.value.trim();
    if(!mname) return;
    const partIdx = parseInt(tr.querySelector('input[name="V_Power_hantei[]"]')?.value, 10) || 0;
    const timingIdx = parseInt(tr.querySelector('input[name="V_Power_timing[]"]')?.value, 10) || 0;
    const cost = tr.querySelector('input[name="Power_cost[]"]')?.value.trim() || 'なし';
    const range = tr.querySelector('input[name="Power_range[]"]')?.value.trim() || '';
    const effect = tr.querySelector('input[name="Power_memo[]"]')?.value.trim() || '';
    maneuvers.push({
      part: PART_LABELS[partIdx] || '',
      name: mname,
      timing: TIMING_LABELS[timingIdx] || 'オート',
      cost, range, effect
    });
  });

  doc.querySelectorAll('input[name="roice_name[]"]').forEach(inp=>{
    if(inp.value.trim() !== 'たからもの') return;
    const row = inp.closest('tr');
    const memo = row?.querySelector('input[name="roice_memo[]"]')?.value.trim() || '';
    const breakEff = row?.querySelector('input[name="roice_break[]"]')?.value.trim() || '';
    maneuvers.push({
      part: '未練',
      name: 'たからもの',
      timing: 'オート',
      cost: 'なし',
      range: '自身',
      effect: [memo, breakEff].filter(Boolean).join(' / ') || '(詳細は未練欄を参照)'
    });
  });

  return {
    id: 'pc_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
    title, name: name||'(無名)', position, mainClass, subClass,
    initialArea, maxAction, maneuvers
  };
}

function parsePCText(text){
  const get = (label)=>{
    const m = text.match(new RegExp(label+'：(.*)'));
    return m ? m[1].trim() : '';
  };
  const title = get('タイトル');
  const name = get('キャラクター名');
  const position = get('ポジション');
  const classLine = get('クラス');
  const [mainClass, subClass] = classLine.split('/').map(s=>s?s.trim():'');
  const initialArea = get('初期配置') || '花園';
  const maxActionM = text.match(/行動値：(\d+)/);
  const maxAction = maxActionM ? parseInt(maxActionM[1],10) : 10;

  const maneuvers = [];
  text.split('\n').forEach(line=>{
    const l = line.trim();
    if(!l.startsWith('[')) return;
    const partMatch = l.match(/^\[(.*?)\]/);
    if(!partMatch) return;
    const part = partMatch[1].trim();
    const rest = l.slice(partMatch[0].length);
    const fields = rest.split(':');
    if(fields.length < 4) return;
    const clean = s => s.replace(/[\s\u3000]+/g,'').trim();
    const name = clean(fields[0]);
    if(!name) return;
    const timing = clean(fields[1]);
    const cost = clean(fields[2]);
    const range = clean(fields[3]);
    const effect = fields.slice(4).join(':').trim();
    maneuvers.push({part, name, timing, cost, range, effect});
  });

  return {
    id: 'pc_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
    title, name: name||'(無名)', position, mainClass: mainClass||'', subClass: subClass||'',
    initialArea, maxAction, maneuvers
  };
}

function parseAndAddPC(){
  const text = document.getElementById('pc-input').value;
  const msg = document.getElementById('pc-parse-msg');
  if(!text.trim()){ msg.textContent = 'テキストを貼り付けてください。'; return; }
  try{
    const isHtml = /<!DOCTYPE|<html|<input\s/i.test(text);
    const pc = isHtml ? parsePCHtml(text) : parsePCText(text);
    if(pc.maneuvers.length === 0){
      msg.textContent = 'マニューバが1件も読み取れませんでした。フォーマットを確認してください。';
      return;
    }
    PCS.push(pc);
    savePCs();
    document.getElementById('pc-input').value = '';
    msg.textContent = `「${pc.name}」を登録しました（マニューバ${pc.maneuvers.length}件、${isHtml?'HTMLソース':'テキスト出力'}から読み取り）`;
    renderPCList();
  }catch(e){
    msg.textContent = '解析中にエラーが発生しました: '+e.message;
  }
}

// ---------- Enemy(手駒) parsing ----------
function parseEnemyBlock(block){
  const rawLines = block.split('\n').map(l=>l.trim()).filter(l=>l);
  if(rawLines.length===0) return null;
  const name = rawLines[0];

  let type = null;
  ['レギオン','ホラー','サヴァント'].forEach(t=>{ if(block.includes(t)) type = type || t; });
  const maliceMatch = block.match(/悪意[:：]?\s*([0-9]+)/);
  const malice = maliceMatch ? parseInt(maliceMatch[1],10) : null;
  const maxActionMatch = block.match(/最大行動値[:：]?\s*([0-9]+)/);
  const maxAction = maxActionMatch ? parseInt(maxActionMatch[1],10) : 8;
  if(!type) type = malice !== null ? 'ホラー' : 'レギオン';

  const maneuvers = [];
  const notes = [];
  rawLines.slice(1).forEach(l=>{
    const m = l.match(/^[□■]?\s*【(.*?)】\s*《(.*?)\/(.*?)\/(.*?)》\s*(.*)$/);
    if(m){
      maneuvers.push({name:m[1].trim(), timing:m[2].trim(), cost:m[3].trim(), range:m[4].trim(), effect:m[5].trim()});
      return;
    }
    if(/悪意|最大行動値/.test(l)) return;
    notes.push(l);
  });
  if(maneuvers.length===0) return null;

  return {
    id: 'en_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
    name, type, maxAction, malice, notes: notes.join(' '),
    maneuvers
  };
}

function parseAndAddEnemies(){
  const text = document.getElementById('enemy-input').value;
  const msg = document.getElementById('enemy-parse-msg');
  if(!text.trim()){ msg.textContent = 'テキストを貼り付けてください。'; return; }
  const blocks = text.split(/\n\s*\n/);
  let added = 0;
  blocks.forEach(b=>{
    const en = parseEnemyBlock(b);
    if(en){ ENEMIES.push(en); added++; }
  });
  saveEnemies();
  document.getElementById('enemy-input').value = '';
  msg.textContent = added>0 ? `${added}体を手駒として登録しました` : '解析できるデータが見つかりませんでした。フォーマットを確認してください。';
  renderEnemyList();
}

// ---------- rendering (横並び一覧がメイン) ----------
function symbolFor(m){
  if(m.broken) return '×';
  if(m.used) return '■';
  return '□';
}

function maneuverLine(m, entityId, isPc, idx){
  const nameClass = m.broken ? 'mname broken' : (m.used ? 'mname used' : 'mname');
  return `<div class="mline">
    <div class="mline-head">
      <label class="mchk"><input type="checkbox" ${m.broken?'checked':''} onchange="toggleFlag('${entityId}',${isPc},${idx},'broken')">損傷</label>
      <label class="mchk"><input type="checkbox" ${m.used?'checked':''} onchange="toggleFlag('${entityId}',${isPc},${idx},'used')">使用</label>
      <button class="mcopy" onclick="copyManeuverLine('${entityId}',${isPc},${idx})">行コピー</button>
    </div>
    <span class="${nameClass}">${symbolFor(m)}${m.name}</span>
    <span class="mmeta">（${m.timing}／${m.cost||'なし'}／${m.range}）</span>
    <div class="meffect">${m.effect||''}</div>
  </div>`;
}

function toggleFlag(entityId, isPc, idx, flag){
  const list = isPc ? PCS : ENEMIES;
  const entity = list.find(e=>e.id===entityId);
  if(!entity || !entity.maneuvers[idx]) return;
  entity.maneuvers[idx][flag] = !entity.maneuvers[idx][flag];
  if(isPc){ savePCs(); renderPCList(); } else { saveEnemies(); renderEnemyList(); }
}

function maneuverPaletteLine(m){
  return `${symbolFor(m)}【${m.name}】　《${m.timing}/${m.cost||'なし'}/${m.range}》　${m.effect}`.trim();
}

function copyManeuverLine(entityId, isPc, idx){
  const list = isPc ? PCS : ENEMIES;
  const entity = list.find(e=>e.id===entityId);
  if(!entity || !entity.maneuvers[idx]) return;
  const line = maneuverPaletteLine(entity.maneuvers[idx]);
  navigator.clipboard.writeText(line).then(()=>{
    showToast(`コピーしました: ${entity.maneuvers[idx].name}`);
  }).catch(()=>{
    showToast('コピーに失敗しました（権限がないかもしれません）');
  });
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>{ t.style.display = 'none'; }, 1600);
}

function buildPaletteText(entity){
  const lines = [`// ${entity.name}`];
  const hasPart = entity.maneuvers.some(m=>m.part);
  if(hasPart){
    const partOrder = [];
    entity.maneuvers.forEach(m=>{ if(m.part && !partOrder.includes(m.part)) partOrder.push(m.part); });
    partOrder.forEach(part=>{
      lines.push(`▼${part}`);
      entity.maneuvers.filter(m=>m.part===part).forEach(m=>{
        lines.push(maneuverPaletteLine(m));
      });
    });
  }else{
    entity.maneuvers.forEach(m=>{
      lines.push(maneuverPaletteLine(m));
    });
  }
  return lines.join('\n');
}

function togglePalette(id, isPc, btn){
  const box = document.getElementById((isPc?'pc-pal-':'en-pal-')+id);
  const entity = isPc ? PCS.find(p=>p.id===id) : ENEMIES.find(e=>e.id===id);
  if(!entity) return;
  if(box.style.display === 'none'){
    box.value = buildPaletteText(entity);
    box.style.display = 'block';
    btn.textContent = 'パレットを閉じる';
  }else{
    box.style.display = 'none';
    btn.textContent = 'パレット生成';
  }
}

async function copyPalette(id, isPc){
  const box = document.getElementById((isPc?'pc-pal-':'en-pal-')+id);
  box.select();
  try{
    await navigator.clipboard.writeText(box.value);
    const msg = document.getElementById((isPc?'pc-copy-':'en-copy-')+id);
    if(msg){ msg.textContent = 'コピーしました'; setTimeout(()=>{ msg.textContent=''; }, 1500); }
  }catch(e){ /* クリップボード権限なし: 選択状態は残るので手動コピー可能 */ }
}

function renderPCList(){
  const box = document.getElementById('pc-hlist');
  if(PCS.length===0){ box.innerHTML = '<p class="notice">まだPCが登録されていません。「＋ PCを新規登録」から追加してください。</p>'; return; }
  box.innerHTML = PCS.map(pc=>{
    const partOrder = [];
    pc.maneuvers.forEach(m=>{ if(m.part && !partOrder.includes(m.part)) partOrder.push(m.part); });
    const blocks = partOrder.map(part=>`
      <div class="part-block">
        <h4>${part}</h4>
        ${pc.maneuvers.filter(m=>m.part===part).map(m=>maneuverLine(m, pc.id, true, pc.maneuvers.indexOf(m))).join('')}
      </div>
    `).join('');
    return `
      <div class="hcard">
        <button class="del" onclick="deletePC('${pc.id}')">削除</button>
        <h3>${pc.name}</h3>
        <div class="sub">${pc.title||''}／${pc.position}／${pc.mainClass}・${pc.subClass}</div>
        <div class="sub">初期配置: ${pc.initialArea}／行動値: ${pc.maxAction}</div>
        <div class="card-actions">
          <button class="ghost" onclick="togglePalette('${pc.id}', true, this)">パレット生成</button>
          <span class="copy-msg" id="pc-copy-${pc.id}"></span>
        </div>
        <textarea class="palette-out" id="pc-pal-${pc.id}" style="display:none;" readonly onclick="this.select(); copyPalette('${pc.id}', true);"></textarea>
        ${blocks}
      </div>
    `;
  }).join('');
}
function deletePC(id){
  PCS = PCS.filter(p=>p.id!==id);
  savePCs();
  renderPCList();
}

function renderEnemyList(){
  const box = document.getElementById('enemy-hlist');
  if(ENEMIES.length===0){ box.innerHTML = '<p class="notice">まだ手駒が登録されていません。「＋ 手駒を新規登録」から追加してください。</p>'; return; }
  box.innerHTML = ENEMIES.map(en=>`
    <div class="hcard legion">
      <button class="del" onclick="deleteEnemy('${en.id}')">削除</button>
      <h3>${en.name}</h3>
      <div class="sub">${en.type}／最大行動値${en.maxAction}${en.malice!=null?'／悪意'+en.malice:''}</div>
      ${en.notes ? `<div class="notes">${en.notes}</div>` : ''}
      <div class="card-actions">
        <button class="ghost" onclick="togglePalette('${en.id}', false, this)">パレット生成</button>
        <span class="copy-msg" id="en-copy-${en.id}"></span>
      </div>
      <textarea class="palette-out" id="en-pal-${en.id}" style="display:none;" readonly onclick="this.select(); copyPalette('${en.id}', false);"></textarea>
      ${en.maneuvers.map((m,idx)=>maneuverLine(m, en.id, false, idx)).join('')}
    </div>
  `).join('');
}
function deleteEnemy(id){
  ENEMIES = ENEMIES.filter(e=>e.id!==id);
  saveEnemies();
  renderEnemyList();
}

// ---------- init ----------
loadStore();
renderPCList();
renderEnemyList();
</script>
</body>
</html>
