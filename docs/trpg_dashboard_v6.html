<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TRPG Session Board</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Serif+JP:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0c08;--bg1:#1a1208;--bg2:#221810;--bg3:#2e2010;
  --border:#5a4020;--border2:#3a2810;--border3:#2a1e08;
  --gold:#d4a840;--gold2:#a07828;--gold3:#6a5020;
  --text:#e0d0a8;--text2:#c0a060;--text3:#a08040;--text4:#8a6a30;--text5:#6a5020;
  --red:#c04030;--red2:#8a2020;--green:#4a9a4a;--blue:#4060c0;
  --hp-hi:#4a9a4a;--hp-mid:#c09030;--hp-lo:#c04030;
  --fsize:14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Noto Serif JP',serif;font-size:var(--fsize);min-height:100vh;}

/* ── NAV ── */
nav{display:flex;align-items:center;background:var(--bg1);border-bottom:2px solid var(--border);padding:0 20px;position:sticky;top:0;z-index:300;gap:0;}
.nav-title{font-family:'Cinzel',serif;font-size:13px;color:var(--gold);letter-spacing:3px;padding:13px 18px 13px 0;border-right:1px solid var(--border2);margin-right:10px;white-space:nowrap;}
.nb{font-family:'Cinzel',serif;font-size:12px;padding:14px 16px;background:none;border:none;border-bottom:3px solid transparent;color:var(--text4);cursor:pointer;transition:all .2s;letter-spacing:1px;}
.nb.on,.nb:hover{color:var(--gold);border-bottom-color:var(--gold);}

/* ── PAGE ── */
.page{display:none;padding:16px 20px 60px;}
.page.on{display:block;}

/* ── SECTION ── */
.sec-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border2);}
.sec-title{font-family:'Cinzel',serif;font-size:13px;color:var(--gold);letter-spacing:2px;}
.sec-gap{margin-top:36px;}
.sec-actions{display:flex;gap:6px;align-items:center;}

/* ── BUTTONS ── */
.btn{font-family:'Cinzel',serif;font-size:12px;padding:6px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:4px;color:var(--gold);cursor:pointer;transition:all .2s;letter-spacing:1px;}
.btn:hover{background:#3a2810;border-color:var(--gold);}
.btn-sm{font-size:11px;padding:4px 10px;}
.btn-ghost{background:none;border-color:var(--border2);color:var(--text4);}
.btn-ghost:hover{color:var(--gold);border-color:var(--gold);}
.btn-danger{color:var(--red);border-color:var(--red2);background:none;}
.btn-danger:hover{background:#2a0808;border-color:var(--red);}

/* ── CARD GRID ── */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}

/* ── CARD ── */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;overflow:hidden;transition:border-color .2s;cursor:grab;}
.card:active{cursor:grabbing;}
.card:hover{border-color:var(--gold2);}
.card.dragging{opacity:.35;border-style:dashed;transform:scale(.97);}
.card.drag-over-card{border-color:var(--gold);border-style:dashed;}

/* ── CARD HEAD ── */
.card-head{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg1);border-bottom:1px solid var(--border2);}
.head-info{flex:1;min-width:0;}

/* ── DRAG HANDLE ── */
.drag-handle{font-size:14px;color:var(--text5);cursor:grab;padding:2px 4px;flex-shrink:0;line-height:1;user-select:none;}
.drag-handle:active{cursor:grabbing;}

/* ── AVATAR ── */
.ava{background:var(--bg3);border:1px solid var(--border);border-radius:5px;overflow:hidden;position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ava img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
.ava .drop-hint{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.65);font-size:9px;color:var(--text5);text-align:center;padding:2px;opacity:0;transition:opacity .15s;}
.ava:hover .drop-hint,.ava.drag-over .drop-hint{opacity:1;}
.ava.drag-over{border-color:var(--gold);}

/* ── EDITABLE ── */
[contenteditable]{outline:none;border-radius:2px;transition:background .15s;}
[contenteditable]:hover{background:rgba(212,168,64,.07);}
[contenteditable]:focus{background:rgba(212,168,64,.12);box-shadow:0 0 0 1px var(--gold3);}
.ed-name{font-family:'Cinzel',serif;font-size:14px;color:var(--gold);font-weight:600;display:block;}
.ed-sub{font-size:12px;color:var(--text4);display:block;margin-top:2px;}

/* ── CARD BODY ── */
.card-body{padding:10px 12px;}

/* ── BARS ── */
.bar-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
.bar-lbl{font-size:12px;color:var(--text4);width:24px;flex-shrink:0;}
.bar-bg{flex:1;height:7px;background:var(--bg3);border-radius:4px;overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;transition:width .4s;}
.bar-inputs{display:flex;gap:3px;align-items:center;flex-shrink:0;}
.bar-in{width:42px;background:var(--bg1);border:1px solid var(--border2);border-radius:3px;color:var(--text);font-size:13px;padding:2px 5px;text-align:center;font-family:'Noto Serif JP',serif;}
.bar-in:focus{outline:none;border-color:var(--border);}
.bar-sep{font-size:11px;color:var(--text5);}

/* ── SECTION LABELS ── */
.slbl{font-family:'Cinzel',serif;font-size:10px;color:var(--text5);letter-spacing:1px;margin:8px 0 4px;padding-bottom:2px;border-bottom:1px solid var(--border3);}

/* ── STATS ── */
.stats-grid{display:flex;gap:4px;flex-wrap:wrap;}
.stat-chip{background:var(--bg3);border:1px solid var(--border2);border-radius:4px;padding:3px 6px;text-align:center;min-width:44px;}
.stat-key{font-size:10px;color:var(--text4);display:block;}
.stat-num{font-size:13px;color:var(--text);font-weight:600;display:block;min-width:22px;}

/* ── SKILLS ── */
.skill-row{border-bottom:1px solid var(--border3);}
.skill-row:last-child{border-bottom:none;}
.skill-header{display:flex;align-items:center;gap:4px;padding:4px 0;cursor:pointer;user-select:none;}
.skill-arrow{font-size:9px;color:var(--text5);flex-shrink:0;transition:transform .15s;width:12px;text-align:center;}
.skill-row.open .skill-arrow{transform:rotate(90deg);}
.skill-txt{font-size:13px;color:var(--text3);flex:1;line-height:1.5;}
.skill-del{font-size:10px;color:var(--text5);cursor:pointer;flex-shrink:0;padding:1px 4px;border-radius:2px;opacity:0;}
.skill-header:hover .skill-del{opacity:1;}
.skill-del:hover{color:var(--red);}
.skill-detail{display:none;padding:4px 6px 6px 16px;}
.skill-row.open .skill-detail{display:block;}
.skill-detail-area{width:100%;background:var(--bg1);border:1px solid var(--border3);border-radius:3px;color:var(--text4);font-family:'Noto Serif JP',serif;font-size:12px;padding:5px 7px;resize:none;line-height:1.7;min-height:52px;}
.skill-detail-area:focus{outline:none;border-color:var(--border2);}
.skill-add{font-size:11px;color:var(--text5);cursor:pointer;margin-top:4px;padding:2px 6px;border:1px dashed var(--border3);border-radius:3px;display:inline-block;}
.skill-add:hover{color:var(--gold);border-color:var(--gold3);}

/* ── STATUS ── */
.status-row{display:flex;gap:3px;flex-wrap:wrap;align-items:center;}
.sbadge{font-size:11px;padding:2px 7px;border-radius:3px;border:1px solid;cursor:pointer;}
.sbadge:hover{opacity:.7;}
.s-ok{background:#0a1e0a;border-color:#2a6020;color:#5a9040;}
.s-bad{background:#2a0a0a;border-color:var(--red2);color:var(--red);}
.s-warn{background:#2a1a06;border-color:#8a5010;color:#c08030;}
/* status dropdown button */
.status-wrap{position:relative;display:inline-block;}
.status-add{font-size:11px;color:var(--text5);cursor:pointer;padding:2px 6px;border:1px dashed var(--border3);border-radius:3px;}
.status-add:hover{color:var(--gold);border-color:var(--gold3);}
.status-popup{display:none;position:fixed;background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:8px;z-index:500;width:220px;box-shadow:0 4px 20px rgba(0,0,0,.7);}
.status-popup.show{display:block;}
.status-popup-title{font-family:'Cinzel',serif;font-size:9px;color:var(--text5);letter-spacing:1px;margin-bottom:6px;padding-bottom:3px;border-bottom:1px solid var(--border3);}
.stpl-list{display:flex;flex-direction:column;gap:2px;margin-bottom:6px;}
.stpl-item{display:flex;align-items:center;gap:6px;padding:3px 5px;border-radius:3px;cursor:pointer;transition:background .1s;}
.stpl-item:hover{background:var(--bg3);}
.stpl-badge{font-size:10px;padding:1px 7px;border-radius:3px;border:1px solid;white-space:nowrap;}
.stpl-del{font-size:9px;color:var(--text5);margin-left:auto;padding:0 3px;cursor:pointer;opacity:0;flex-shrink:0;}
.stpl-item:hover .stpl-del{opacity:1;}
.stpl-del:hover{color:var(--red);}
.stpl-custom{display:flex;flex-direction:column;gap:4px;padding-top:6px;border-top:1px solid var(--border3);}
.stpl-custom-row1{display:flex;gap:4px;align-items:center;}
.stpl-custom-row1 input{flex:1;min-width:0;background:var(--bg1);border:1px solid var(--border2);border-radius:3px;color:var(--text);font-size:11px;padding:4px 6px;font-family:'Noto Serif JP',serif;}
.stpl-custom-row1 input:focus{outline:none;border-color:var(--border);}
.stpl-color-row{display:flex;gap:5px;align-items:center;}
.stpl-color-lbl{font-size:10px;color:var(--text5);}
.stpl-color-opt{width:20px;height:20px;border-radius:3px;border:2px solid transparent;cursor:pointer;transition:border-color .15s;flex-shrink:0;}
.stpl-color-opt.sel{border-color:var(--gold);}
.stpl-color-ok{font-size:10px;padding:4px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:3px;color:var(--gold);cursor:pointer;white-space:nowrap;margin-left:auto;}

/* ── CARD FOOTER ── */
.card-footer{display:flex;gap:6px;padding:8px 12px;background:var(--bg1);border-top:1px solid var(--border3);justify-content:flex-end;}
.cfbtn{font-size:10px;padding:3px 9px;border-radius:3px;border:1px solid;cursor:pointer;transition:all .15s;background:none;}
.cfbtn-hide{border-color:var(--border2);color:var(--text5);}
.cfbtn-hide:hover{border-color:var(--gold3);color:var(--gold);}
.cfbtn-del{border-color:var(--red2);color:#6a3020;}
.cfbtn-del:hover{border-color:var(--red);color:var(--red);background:#2a0808;}

/* ── MEMO textarea ── */
.memo-area{width:100%;background:var(--bg1);border:1px solid var(--border2);border-radius:3px;color:var(--text2);font-family:'Noto Serif JP',serif;font-size:13px;padding:6px;resize:none;line-height:1.7;}
.memo-area:focus{outline:none;border-color:var(--border);}

/* ── ENEMY STATS ── */
.en-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:4px;}
.en-stats2{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:7px;}
.estat{background:var(--bg3);border-radius:3px;padding:4px 5px;text-align:center;}
.estat-lbl{font-size:10px;color:var(--text5);display:block;}
.estat-val{font-size:13px;color:var(--text);font-weight:600;display:block;min-width:20px;}
.weak-row{display:flex;gap:4px;flex-wrap:wrap;margin:3px 0 6px;align-items:center;}
.wtag{font-size:11px;padding:2px 6px;border-radius:3px;cursor:pointer;}
.weak{background:#2a0a0a;border:1px solid #7a2020;color:#c04040;}
.resist{background:#0a1020;border:1px solid #204060;color:#4080c0;}
.wtag:hover{opacity:.7;}
.tag-add{font-size:11px;color:var(--text5);cursor:pointer;padding:2px 6px;border:1px dashed var(--border3);border-radius:3px;}
.tag-add:hover{color:var(--gold);border-color:var(--gold3);}
.note-area{width:100%;background:var(--bg1);border:1px solid var(--border2);border-radius:3px;color:var(--text4);font-family:'Noto Serif JP',serif;font-size:13px;padding:5px 6px;resize:none;line-height:1.7;}
.note-area:focus{outline:none;border-color:var(--border);}

/* ── WAITING ROOM ── */
.waiting-room{background:var(--bg1);border:1px solid var(--border2);border-radius:8px;padding:12px;margin-top:10px;}
.waiting-label{font-family:'Cinzel',serif;font-size:11px;color:var(--text5);letter-spacing:2px;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.waiting-label::after{content:'';flex:1;height:1px;background:var(--border3);}
.waiting-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;}
.waiting-chip{background:var(--bg2);border:1px dashed var(--border2);border-radius:6px;padding:8px 10px;display:flex;align-items:center;gap:8px;cursor:pointer;transition:all .2s;}
.waiting-chip:hover{border-color:var(--gold);background:var(--bg3);}
.wchip-ava{width:32px;height:38px;background:var(--bg3);border:1px solid var(--border2);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;overflow:hidden;position:relative;}
.wchip-ava img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
.wchip-name{font-size:12px;color:var(--text3);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.wchip-show{font-size:10px;color:var(--text5);flex-shrink:0;}
.waiting-empty{font-size:12px;color:var(--text5);text-align:center;padding:12px;font-style:italic;}

/* ── MEMO PAGE ── */
.memo-page-wrap{max-width:1100px;}
.memo-board{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:20px;}
.memo-board-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border2);}
.memo-board-name{font-family:'Cinzel',serif;font-size:15px;background:none;border:none;border-bottom:1px solid transparent;color:var(--gold);padding:2px 6px;min-width:60px;max-width:300px;}
.memo-board-name:hover{border-bottom-color:var(--border2);}
.memo-board-name:focus{outline:none;border-bottom-color:var(--gold);}
.memo-board-actions{display:flex;gap:6px;margin-left:auto;align-items:center;}
.memo-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}
.memo-card{background:var(--bg1);border:1px solid var(--border2);border-radius:6px;overflow:hidden;position:relative;}
.memo-card:hover .mcard-del{opacity:1;}
.mcard-del{position:absolute;top:5px;right:5px;font-size:10px;padding:1px 5px;background:#2a0a08;border:1px solid var(--red2);border-radius:3px;color:#8a3020;cursor:pointer;opacity:0;transition:opacity .2s;}
.mcard-del:hover{color:var(--red);border-color:var(--red);}
.memo-card-title{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border3);color:var(--gold2);font-family:'Cinzel',serif;font-size:13px;padding:8px 12px;letter-spacing:1px;}
.memo-card-title:focus{outline:none;background:rgba(212,168,64,.04);}
.memo-card-body{width:100%;background:transparent;border:none;color:var(--text2);font-family:'Noto Serif JP',serif;font-size:14px;padding:10px 12px;resize:vertical;line-height:1.9;min-height:140px;}
.memo-card-body:focus{outline:none;}
.memo-add-board{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px;background:var(--bg1);border:2px dashed var(--border2);border-radius:10px;cursor:pointer;transition:all .2s;color:var(--text5);font-family:'Cinzel',serif;font-size:12px;letter-spacing:1px;}
.memo-add-board:hover{border-color:var(--gold3);color:var(--gold);}

/* ── SAVE INDICATOR ── */
.save-indicator{font-size:11px;color:var(--text5);padding:0 12px;transition:color .3s;}
.save-indicator.saved{color:var(--green);}
.save-indicator.saving{color:var(--gold);}

/* ── MODAL ── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:500;align-items:center;justify-content:center;}
.modal-bg.show{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:24px;width:500px;max-width:96vw;max-height:92vh;overflow-y:auto;}
.modal-title{font-family:'Cinzel',serif;font-size:15px;color:var(--gold);margin-bottom:18px;letter-spacing:1px;}
.modal-tabs{display:flex;gap:5px;margin-bottom:16px;}
.modal-tab{font-size:12px;padding:6px 14px;background:var(--bg3);border:1px solid var(--border2);border-radius:4px;color:var(--text4);cursor:pointer;}
.modal-tab.on{color:var(--gold);border-color:var(--border);}
.msec{display:none;}
.msec.on{display:block;}
.fl{font-size:12px;color:var(--text4);margin-bottom:5px;display:block;}
.fi{width:100%;background:var(--bg1);border:1px solid var(--border2);border-radius:4px;color:var(--text);font-family:'Noto Serif JP',serif;font-size:13px;padding:8px 10px;margin-bottom:12px;}
.fi:focus{outline:none;border-color:var(--border);}
.fi-grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.fi-grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
.fi-grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;}
.modal-hint{font-size:12px;color:var(--text5);line-height:1.8;margin-bottom:12px;padding:10px;background:var(--bg1);border-radius:4px;border:1px solid var(--border3);}
.modal-hint b{color:var(--text3);}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;}
.modal-cancel{font-size:12px;padding:7px 16px;background:none;border:1px solid var(--border2);border-radius:4px;color:var(--text4);cursor:pointer;font-family:'Noto Serif JP',serif;}
.modal-ok{font-family:'Cinzel',serif;font-size:12px;padding:7px 18px;background:var(--bg3);border:1px solid var(--border);border-radius:4px;color:var(--gold);cursor:pointer;letter-spacing:1px;}
.modal-ok:hover{background:#3a2810;border-color:var(--gold);}
.modal-ok:disabled{opacity:.35;cursor:not-allowed;}
.load-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text4);min-height:22px;margin-top:6px;}

/* ── COOKING STAGE ── */
.cook-stage{background:var(--bg1);border:1px solid var(--border2);border-radius:8px;padding:16px 20px;margin-bottom:14px;display:flex;flex-direction:column;align-items:center;gap:12px;min-height:140px;position:relative;overflow:hidden;}
.cook-stage-chars{display:flex;gap:24px;align-items:flex-end;justify-content:center;}
.stage-char{display:flex;flex-direction:column;align-items:center;gap:6px;transition:opacity .3s;}
.stage-char.active{opacity:1;}
.stage-char.inactive{opacity:.3;}
.stage-char-ava{width:64px;height:76px;border-radius:6px;border:2px solid var(--border2);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:36px;background:var(--bg2);position:relative;transition:border-color .3s;}
.stage-char.active .stage-char-ava{border-color:var(--gold);}
.stage-char-ava img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
.stage-char-name{font-size:11px;color:var(--text4);font-family:'Cinzel',serif;}
.stage-char.active .stage-char-name{color:var(--gold);}

/* ぴょこぴょこアニメ */
@keyframes bounce{
  0%,100%{transform:translateY(0);}
  20%{transform:translateY(-14px);}
  40%{transform:translateY(-6px);}
  60%{transform:translateY(-10px);}
  80%{transform:translateY(-3px);}
}
.stage-char.bouncing .stage-char-ava{animation:bounce .6s ease;}

/* ダイスエリア */
.cook-dice-area{display:flex;gap:16px;align-items:center;justify-content:center;min-height:50px;}
.dice-box{display:flex;flex-direction:column;align-items:center;gap:4px;}
.dice-face{width:44px;height:44px;background:var(--bg2);border:2px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:20px;color:var(--text);transition:all .15s;position:relative;}
.dice-face.rolling{animation:diceRoll .08s linear infinite;}
.dice-face.settled-ok{border-color:var(--green);color:var(--green);box-shadow:0 0 8px rgba(74,154,74,.4);}
.dice-face.settled-ng{border-color:var(--red);color:var(--red);box-shadow:0 0 8px rgba(192,64,48,.4);}
.dice-face.settled-12{border-color:#ffd700;color:#ffd700;box-shadow:0 0 12px rgba(255,215,0,.5);}
.dice-face.settled-2{border-color:#6a2020;color:#6a2020;}
.dice-total{font-size:11px;color:var(--text5);}
@keyframes diceRoll{0%{transform:rotate(-4deg);}50%{transform:rotate(4deg);}100%{transform:rotate(-4deg);}}

/* 結果エフェクト */
.cook-result-overlay{position:fixed;inset:0;pointer-events:none;z-index:400;}
.particle{position:absolute;border-radius:50%;animation:particleFall linear forwards;}
@keyframes particleFall{
  0%{transform:translateY(-20px) rotate(0deg);opacity:1;}
  100%{transform:translateY(100vh) rotate(720deg);opacity:0;}
}
@keyframes shakeScreen{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-8px);}
  40%{transform:translateX(8px);}
  60%{transform:translateX(-5px);}
  80%{transform:translateX(5px);}
}
@keyframes smokeRise{
  0%{transform:translateY(0) scale(1);opacity:.6;}
  100%{transform:translateY(-80px) scale(2.5);opacity:0;}
}
.cook-wrap{max-width:860px;margin:0 auto;}
.cook-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;}
.cook-panel{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:14px;}
.cook-panel-title{font-family:'Cinzel',serif;font-size:12px;color:var(--gold);letter-spacing:2px;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--border2);}
.cook-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:4px;cursor:pointer;transition:background .15s;border:1px solid transparent;margin-bottom:4px;font-size:13px;}
.cook-item:hover{background:var(--bg3);}
.cook-item.selected{background:var(--bg3);border-color:var(--gold);color:var(--gold);}
.cook-item.disabled{opacity:.35;cursor:not-allowed;}
.cook-sel-mark{font-size:11px;color:var(--gold);margin-left:auto;flex-shrink:0;}
.cook-diff{font-size:10px;color:var(--text5);margin-left:auto;}
.cook-add-row{display:flex;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border3);}
.cook-add-row input{flex:1;background:var(--bg1);border:1px solid var(--border2);border-radius:3px;color:var(--text);font-size:12px;padding:5px 8px;font-family:'Noto Serif JP',serif;}
.cook-add-row input:focus{outline:none;border-color:var(--border);}
.cook-add-row input[type=number]{width:60px;flex:none;}
.cook-start{width:100%;padding:14px;font-family:'Cinzel',serif;font-size:14px;letter-spacing:3px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--gold);cursor:pointer;transition:all .2s;margin-bottom:20px;}
.cook-start:hover:not(:disabled){background:#3a2810;border-color:var(--gold);box-shadow:0 0 12px rgba(212,168,64,.2);}
.cook-start:disabled{opacity:.4;cursor:not-allowed;}
.cook-log-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.cook-log{background:var(--bg1);border:1px solid var(--border2);border-radius:8px;padding:16px;min-height:200px;font-size:13px;line-height:2.2;color:var(--text2);}
.cook-log-line{display:block;padding:1px 0;}
.cook-log-line.result-great{color:#ffd700;font-family:'Cinzel',serif;font-size:15px;letter-spacing:1px;margin-top:8px;}
.cook-log-line.result-ok{color:var(--green);font-family:'Cinzel',serif;font-size:15px;margin-top:8px;}
.cook-log-line.result-fail{color:var(--red);font-family:'Cinzel',serif;font-size:15px;margin-top:8px;}
.cook-log-line.result-bad{color:#8a2020;font-family:'Cinzel',serif;font-size:15px;margin-top:8px;}
.cook-log-line.dish-name{color:var(--gold);font-family:'Cinzel',serif;font-size:16px;letter-spacing:2px;margin-top:6px;}
.cook-log-line.separator{color:var(--border);margin:4px 0;}
.cook-log-line.dice-ok{font-size:11px;color:#4a7a4a;padding-left:8px;margin-top:-4px;}
.cook-log-line.dice-ng{font-size:11px;color:#7a3030;padding-left:8px;margin-top:-4px;}
.cook-log-line.dice-summary{font-size:11px;color:var(--text5);margin:4px 0;}
.cook-log-line.generating{color:var(--text5);font-style:italic;}
.cook-sel-count{font-size:11px;color:var(--text5);margin-bottom:8px;}

::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
</style>

// Status templates: {t: label, c: class(ok/warn/bad)}
let statusTemplates = [

/* ━━━━━━ HELPERS ━━━━━━ */
const hpColor = p => p>60?'var(--hp-hi)':p>30?'var(--hp-mid)':'var(--hp-lo)';

function setupDrop(el, cb){
  el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('drag-over');});
  el.addEventListener('dragleave',()=>el.classList.remove('drag-over'));
  el.addEventListener('drop',e=>{
    e.preventDefault();el.classList.remove('drag-over');
    const f=e.dataTransfer.files[0];
    if(f&&f.type.startsWith('image/')){const r=new FileReader();r.onload=ev=>cb(ev.target.result);r.readAsDataURL(f);}
  });
  el.addEventListener('click',()=>{
    const i=document.createElement('input');i.type='file';i.accept='image/*';
    i.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>cb(ev.target.result);r.readAsDataURL(f);};
    i.click();
  });
}

/* ━━━━━━ DRAG TO REORDER ━━━━━━ */
function initCardDrag(el, type, idx){
  el.setAttribute('draggable','true');
  el.addEventListener('dragstart', e=>{
    // only start drag from handle or card head
    dragSrcType=type; dragSrcIdx=idx;
    e.dataTransfer.effectAllowed='move';
    setTimeout(()=>el.classList.add('dragging'),0);
  });
  el.addEventListener('dragend', ()=>{
    el.classList.remove('dragging');
    document.querySelectorAll('.drag-over-card').forEach(c=>c.classList.remove('drag-over-card'));
  });
  el.addEventListener('dragover', e=>{
    e.preventDefault();
    if(dragSrcType===type && dragSrcIdx!==idx) el.classList.add('drag-over-card');
  });
  el.addEventListener('dragleave', ()=>el.classList.remove('drag-over-card'));
  el.addEventListener('drop', e=>{
    e.preventDefault();
    el.classList.remove('drag-over-card');
    if(dragSrcType!==type || dragSrcIdx===idx || dragSrcIdx===null) return;
    const arr = type==='char'?chars:enemies;
    const moved = arr.splice(dragSrcIdx,1)[0];
    arr.splice(idx,0,moved);
    dragSrcIdx=null;
    if(type==='char'){renderChars();save();}
    else{renderEnemies();save();}
  });
}

/* ━━━━━━ STATUS POPUP ━━━━━━ */
// color options: ok=green, warn=yellow, bad=red
const STATUS_COLORS = [
  {c:'ok',  bg:'#0a1e0a', bc:'#2a6020', tc:'#5a9040', label:'緑'},
  {c:'warn',bg:'#2a1a06', bc:'#8a5010', tc:'#c08030', label:'黄'},
  {c:'bad', bg:'#2a0a0a', bc:'#8a2020', tc:'#c04040', label:'赤'},
];
let customColorSel = {}; // ci -> 'ok'|'warn'|'bad'

function buildStatusPopup(ci){
  const col = customColorSel[ci]||'bad';
  const colorOpts = STATUS_COLORS.map(sc=>`
    <div class="stpl-color-opt${col===sc.c?' sel':''}"
      style="background:${sc.bg};border-color:${col===sc.c?'var(--gold)':sc.bc};"
      onclick="customColorSel[${ci}]='${sc.c}';rerenderColorOpts(${ci});event.stopPropagation()"
      title="${sc.label}"></div>`).join('');
  const tplHtml = statusTemplates.map((tpl,ti)=>`
    <div class="stpl-item" onclick="applyStatus(${ci},${ti});event.stopPropagation()">
      <span class="stpl-badge s-${tpl.c}">${tpl.t}</span>
      <span class="stpl-del" onclick="deleteTemplate(${ti});event.stopPropagation()">✕</span>
    </div>`).join('');
  return `
    <div class="status-popup" id="spop-${ci}">
      <div class="status-popup-title">Status Template</div>
      <div class="stpl-list">${tplHtml}</div>
      <div class="stpl-custom">
        <div class="stpl-custom-row1">
          <input id="scustom-${ci}" placeholder="カスタム入力..."
            onclick="event.stopPropagation()"
            onkeydown="if(event.key==='Enter'){applyCustomStatus(${ci});event.stopPropagation();}">
        </div>
        <div class="stpl-color-row" id="scol-${ci}">
          <span class="stpl-color-lbl">色：</span>
          ${colorOpts}
          <button class="stpl-color-ok" onclick="applyCustomStatus(${ci});event.stopPropagation()">追加</button>
        </div>
      </div>
    </div>`;
}

function rerenderColorOpts(ci){
  const col = customColorSel[ci]||'bad';
  const row = document.getElementById('scol-'+ci);
  if(!row) return;
  const opts = row.querySelectorAll('.stpl-color-opt');
  STATUS_COLORS.forEach((sc,i)=>{
    if(opts[i]){
      opts[i].classList.toggle('sel', col===sc.c);
      opts[i].style.borderColor = col===sc.c?'var(--gold)':sc.bc;
    }
  });
}

function toggleStatusPopup(ci, e){
  e.stopPropagation();
  const pop = document.getElementById('spop-'+ci);
  if(!pop) return;
  const wasShown = pop.classList.contains('show');
  document.querySelectorAll('.status-popup').forEach(p=>p.classList.remove('show'));
  if(!wasShown){
    pop.classList.add('show');
    // fixed座標をボタン位置から計算
    const btn = e.currentTarget;
    const rect = btn.getBoundingClientRect();
    const popH = 220; // 推定高さ
    const spaceAbove = rect.top;
    const spaceBelow = window.innerHeight - rect.bottom;
    if(spaceAbove > popH || spaceAbove > spaceBelow){
      // 上に表示
      pop.style.top = Math.max(4, rect.top - popH - 4) + 'px';
    } else {
      // 下に表示
      pop.style.top = (rect.bottom + 4) + 'px';
    }
    // 横位置：右に飛び出さないよう調整
    let left = rect.left;
    if(left + 220 > window.innerWidth - 8) left = window.innerWidth - 228;
    pop.style.left = Math.max(4, left) + 'px';
  }
}

function applyStatus(ci, ti){
  const tpl = statusTemplates[ti];
  if(!tpl) return;
  if(tpl.c!=='ok') chars[ci].status = chars[ci].status.filter(s=>s.t!=='正常');
  const exists = chars[ci].status.findIndex(s=>s.t===tpl.t);
  if(exists>=0) chars[ci].status.splice(exists,1);
  else chars[ci].status.push({...tpl});
  if(!chars[ci].status.length) chars[ci].status.push({t:'正常',c:'ok'});
  pushHistory();renderChars();save();
}

function applyCustomStatus(ci){
  const inp = document.getElementById('scustom-'+ci);
  const t = inp.value.trim();
  if(!t) return;
  const c = customColorSel[ci]||'bad';
  chars[ci].status = chars[ci].status.filter(s=>s.t!=='正常');
  chars[ci].status.push({t,c});
  if(!statusTemplates.find(s=>s.t===t)) statusTemplates.push({t,c});
  inp.value='';
  pushHistory();renderChars();save();
}

function deleteTemplate(ti){
  statusTemplates.splice(ti,1);

}

/* ━━━━━━ UNDO / REDO ━━━━━━ */
const HISTORY_MAX = 50;
let history = [];
let historyIdx = -1;
let isUndoRedo = false;

function snapshot(){
  return JSON.parse(JSON.stringify({chars, enemies, memoBoards, statusTemplates}));
}

function pushHistory(){
  if(isUndoRedo) return;
  // 現在位置より先の履歴を削除
  history = history.slice(0, historyIdx + 1);
  history.push(snapshot());
  if(history.length > HISTORY_MAX) history.shift();
  historyIdx = history.length - 1;
  updateUndoUI();
}

function undo(){
  if(historyIdx <= 0) return;
  historyIdx--;
  isUndoRedo = true;
  applySnapshot(history[historyIdx]);
  isUndoRedo = false;
  save();
  updateUndoUI();
}

function redo(){
  if(historyIdx >= history.length - 1) return;
  historyIdx++;
  isUndoRedo = true;
  applySnapshot(history[historyIdx]);
  isUndoRedo = false;
  save();
  updateUndoUI();
}

function applySnapshot(snap){
  chars = JSON.parse(JSON.stringify(snap.chars));
  enemies = JSON.parse(JSON.stringify(snap.enemies));
  memoBoards = JSON.parse(JSON.stringify(snap.memoBoards));
  statusTemplates = JSON.parse(JSON.stringify(snap.statusTemplates||statusTemplates));
  renderChars(); renderEnemies(); renderMemoBoards();
}

function updateUndoUI(){
  const u = document.getElementById('undo-btn');
  const r = document.getElementById('redo-btn');
  if(u) u.style.opacity = historyIdx > 0 ? '1' : '0.35';
  if(r) r.style.opacity = historyIdx < history.length-1 ? '1' : '0.35';
}

// Ctrl+Z / Ctrl+Y / Ctrl+Shift+Z
document.addEventListener('keydown', e=>{
  if((e.ctrlKey||e.metaKey) && e.key==='z' && !e.shiftKey){e.preventDefault();undo();}
  if((e.ctrlKey||e.metaKey) && (e.key==='y' || (e.key==='z' && e.shiftKey))){e.preventDefault();redo();}
});

// スキルは文字列 or {name, detail} のどちらでも受け付ける
function skillName(s){ return typeof s==='string'?s:(s.name||''); }
function skillDetail(s){ return typeof s==='string'?'':(s.detail||''); }
function skillObj(s){ return typeof s==='string'?{name:s,detail:''}:{name:s.name||'',detail:s.detail||''}; }

function buildSkillsHtml(skills, type, idx){
  return (skills||[]).map((s,si)=>{

    return `

/* ━━━━━━ YTSHEET PARSER ━━━━━━ */
function parseYtsheet(html){
  const doc=new DOMParser().parseFromString(html,'text/html');
  const allText=doc.body?doc.body.innerText:'';
  let name='';
  const titleEl=doc.querySelector('title');
  if(titleEl) name=titleEl.textContent.split(' - ')[0].trim();
  let clsStr='';
  const meta=doc.querySelector('meta[property="og:description"]')||doc.querySelector('meta[name="description"]');
  if(meta){const d=meta.getAttribute('content')||'';const m=d.match(/技能:([^\s　]+)/);if(m)clsStr=m[1].replace(/,/g,'／');}
  const hpM=allText.match(/ＨＰ\s*\*?\*?(\d+)\*?\*?/);
  const mpM=allText.match(/ＭＰ\s*\*?\*?(\d+)\*?\*?/);
  const hp=hpM?parseInt(hpM[1]):20, mp=mpM?parseInt(mpM[1]):10;
  const stats={};
  [['器用度','器用'],['敏捷度','敏捷'],['筋力','筋力'],['生命力','生命'],['知力','知力'],['精神力','精神']].forEach(([l,s])=>{
    const m=allText.match(new RegExp(l+'\\s*\\n?\\s*(\\d+)'));if(m)stats[s]=parseInt(m[1]);
  });
  const skills=[];
  for(const m of allText.matchAll(/《([^》]+)》/g)) skills.push(`《${m[1]}》`);
  for(const m of allText.matchAll(/【([^】]+)】/g)) skills.push(`【${m[1]}】`);
  return {name:name||'キャラクター',cls:clsStr||'',ava:'⚔️',img:null,memo:'',
    hp,hpmax:hp,mp,mpmax:mp,stats,
    skills:skills.length?skills:['（自動取得できませんでした）'],
    status:[{t:'正常',c:'ok'}],hidden:false};
}

/* ━━━━━━ CHAR MODAL ━━━━━━ */
function openCharModal(){
  document.getElementById('yt-file').value='';

function switchMTab(btn,tab){
  currentCMTab=tab;
  document.querySelectorAll('.modal-tab').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  document.querySelectorAll('.msec').forEach(s=>s.classList.remove('on'));
  document.getElementById('cm-'+tab).classList.add('on');
  document.getElementById('char-ok').textContent=tab==='ytsheet'?'読み込む':'追加';
}
async function submitChar(){
  if(currentCMTab==='manual'){addManualChar();return;}
  const file=document.getElementById('yt-file').files[0];
  if(!file){alert('HTMLファイルを選択してください');return;}
  const loadEl=document.getElementById('yt-loading');
  loadEl.innerHTML='<span style="color:var(--text4);">解析中...</span>';
  try{
    const data=parseYtsheet(await file.text());
    chars.push(data);renderChars();save();
    closeModal('char-modal');loadEl.innerHTML='';
  }catch(err){
    loadEl.innerHTML='<span style="color:var(--red);">読み込みに失敗しました。手動入力をお試しください。</span>';
    console.error(err);
  }
}
function addManualChar(){

/* ━━━━━━ COOKING GAME ━━━━━━ */
let ingredients = [
  {name:'魔物の肉',diff:2},{name:'野草',diff:2},{name:'魔香草',diff:5},
  {name:'レーション',diff:6},{name:'トマト',diff:3},{name:'エッグプラント',diff:3},
  {name:'にんじん',diff:4},{name:'りんご',diff:2},{name:'魔晶石',diff:8},
  {name:'サハギン肉',diff:5},{name:'羊肉',diff:4},{name:'山羊乳',diff:4},
  {name:'胡椒',diff:3},{name:'岩塩',diff:5},{name:'菜種油',diff:7},
  {name:'ヘビ肉',diff:6},{name:'小麦',diff:2},{name:'カチカチパン',diff:6},
  {name:'妖精ベリー',diff:3},
];
let selIngredients = []; // 選択中の素材インデックス
let selChefs = [];       // 選択中のキャラインデックス

function roll2d6(){ return Math.floor(Math.random()*6)+1 + Math.floor(Math.random()*6)+1; }
function rollDetail(){ const a=Math.floor(Math.random()*6)+1, b=Math.floor(Math.random()*6)+1; return {total:a+b,d1:a,d2:b}; }

function renderCookingPage(){
  // 素材リスト
  const ingList = document.getElementById('ing-list');
  if(ingList){
    ingList.innerHTML = ingredients.map((ing,i)=>{
      const sel = selIngredients.includes(i);
      const dis = !sel && selIngredients.length>=3;
      return `<div class="cook-item${sel?' selected':''}${dis?' disabled':''}" onclick="toggleIng(${i})">
        <span>${ing.name}</span>
        ${sel?'<span class="cook-sel-mark">✓</span>':''}
      </div>`;
    }).join('');
    document.getElementById('ing-count').textContent = `${selIngredients.length} / 3 選択中`;
  }
  // キャラリスト（登録済みキャラのみ）
  const chefList = document.getElementById('chef-list');
  if(chefList){
    const visibleChars = chars.filter(c=>!c.hidden);
    if(!visibleChars.length){
      chefList.innerHTML='<div style="font-size:12px;color:var(--text5);padding:8px;">Charactersタブでキャラクターを登録してください</div>';
    } else {
      chefList.innerHTML = visibleChars.map((c,vi)=>{
        const ci = chars.indexOf(c);
        const sel = selChefs.includes(ci);
        const dis = !sel && selChefs.length>=3;
        const bonus = Math.floor((+(c.stats?.['器用']||c.stats?.['器用度']||0))/5)
                    + Math.floor((+(c.stats?.['知力']||0))/5);
        return `<div class="cook-item${sel?' selected':''}${dis?' disabled':''}" onclick="toggleChef(${ci})">
          <span>${c.ava||'⚔️'} ${c.name}</span>
          ${sel?'<span class="cook-sel-mark">✓</span>':'<span class="cook-diff">料理Bonus +${bonus}</span>'}
        </div>`;
      }).join('');
    }
    document.getElementById('chef-count').textContent = `${selChefs.length} / 3 選択中`;
  }
  // スタートボタン
  const btn = document.getElementById('cook-start-btn');
  if(btn) btn.disabled = selIngredients.length<3 || selChefs.length<3;
}

function toggleIng(i){
  if(selIngredients.includes(i)) selIngredients=selIngredients.filter(x=>x!==i);
  else if(selIngredients.length<3) selIngredients.push(i);
  renderCookingPage();
}
function toggleChef(ci){
  if(selChefs.includes(ci)) selChefs=selChefs.filter(x=>x!==ci);
  else if(selChefs.length<3) selChefs.push(ci);
  renderCookingPage();
}

function addIngredient(){
  const name=document.getElementById('new-ing-name').value.trim();
  const diff=parseInt(document.getElementById('new-ing-diff').value)||3;
  if(!name) return;
  ingredients.push({name,diff});
  document.getElementById('new-ing-name').value='';
  renderCookingPage();
}

// ログ表示ヘルパー
function logLine(text, cls=''){
  const log=document.getElementById('cook-log');
  const span=document.createElement('span');

function logWait(ms){ return new Promise(r=>setTimeout(r,ms)); }

/* ━━━━━━ STAGE ANIMATION ━━━━━━ */
function renderStage(chefs, activeIdx){
  const area = document.getElementById('cook-stage-chars');
  area.innerHTML = chefs.map((c,i)=>{
    const isActive = activeIdx===99 || i===activeIdx;
    const avaContent = c.img ? `<img src="${c.img}" alt="">` : (c.ava||'⚔️');
    return `
      <div class="stage-char ${isActive?'active':'inactive'}" id="stchar-${i}">

function bounceChar(idx){
  const el = document.getElementById('stchar-'+idx);
  if(!el) return;
  el.classList.remove('bouncing');
  void el.offsetWidth; // reflow
  el.classList.add('bouncing');
  setTimeout(()=>el.classList.remove('bouncing'), 700);
}

async function animateDice(roll, success){
  const area = document.getElementById('cook-dice-area');
  // 2つのダイスを表示
  area.innerHTML = `
    <div class="dice-box">
      <div class="dice-face rolling" id="die1">?</div>
    </div>
    <div style="font-size:18px;color:var(--text5);">+</div>
    <div class="dice-box">
      <div class="dice-face rolling" id="die2">?</div>
    </div>
    <div style="font-size:18px;color:var(--text5);">=</div>
    <div class="dice-box">
      <div class="dice-face rolling" id="dietotal" style="width:52px;font-size:22px;">?</div>
      <div class="dice-total" id="dietotallbl"></div>
    </div>`;

  // コロコロ演出
  const faces = ['1','2','3','4','5','6'];
  const spinDuration = 800;
  const spinInterval = 80;
  const start = Date.now();
  await new Promise(resolve=>{
    const iv = setInterval(()=>{
      document.getElementById('die1').textContent = faces[Math.floor(Math.random()*6)];
      document.getElementById('die2').textContent = faces[Math.floor(Math.random()*6)];
      document.getElementById('dietotal').textContent = '?';
      if(Date.now()-start >= spinDuration){
        clearInterval(iv);
        resolve();
      }
    }, spinInterval);
  });

  // 結果確定
  const isDouble12 = roll.d1===6 && roll.d2===6;
  const isDouble2  = roll.d1===1 && roll.d2===1;
  const cls = isDouble12 ? 'settled-12' : isDouble2 ? 'settled-2' : success ? 'settled-ok' : 'settled-ng';

  const d1el = document.getElementById('die1');
  const d2el = document.getElementById('die2');
  const dtEl = document.getElementById('dietotal');
  const dlEl = document.getElementById('dietotallbl');
  if(d1el){ d1el.textContent=roll.d1; d1el.classList.remove('rolling'); d1el.classList.add(cls); }
  if(d2el){ d2el.textContent=roll.d2; d2el.classList.remove('rolling'); d2el.classList.add(cls); }
  if(dtEl){ dtEl.textContent=roll.total; dtEl.classList.remove('rolling'); dtEl.classList.add(cls); }
  if(dlEl) dlEl.textContent = success ? '成功！' : '失敗…';
}

/* ━━━━━━ RESULT EFFECTS ━━━━━━ */
function spawnParticles(type){
  const overlay = document.createElement('div');
  overlay.className='cook-result-overlay';
  document.body.appendChild(overlay);

  if(type==='great'){
    // 金キラキラ
    for(let i=0;i<60;i++){
      const p=document.createElement('div');
      p.className='particle';
      const size=Math.random()*8+4;
      const colors=['#ffd700','#ffec6e','#d4a840','#fff8b0','#f0c040'];
      p.style.cssText=`
        width:${size}px;height:${size}px;
        background:${colors[Math.floor(Math.random()*colors.length)]};
        left:${Math.random()*100}vw;top:-20px;
        animation-duration:${1.5+Math.random()*1.5}s;
        animation-delay:${Math.random()*0.8}s;
        border-radius:${Math.random()>0.5?'50%':'2px'};
      `;
      overlay.appendChild(p);
    }
    setTimeout(()=>overlay.remove(), 4000);

  } else if(type==='ok'){
    // 緑ふわっと
    for(let i=0;i<20;i++){
      const p=document.createElement('div');
      p.className='particle';
      p.style.cssText=`
        width:6px;height:6px;
        background:#4a9a4a;
        left:${30+Math.random()*40}vw;top:-10px;
        animation-duration:${1.2+Math.random()}s;
        animation-delay:${Math.random()*0.4}s;
      `;
      overlay.appendChild(p);
    }
    setTimeout(()=>overlay.remove(), 2500);

  } else if(type==='bad'){
    // 画面シェイク
    document.body.style.animation='shakeScreen 0.4s ease';
    setTimeout(()=>document.body.style.animation='', 400);
    // 煙パーティクル
    for(let i=0;i<8;i++){
      const p=document.createElement('div');
      p.style.cssText=`
        position:fixed;
        width:${30+Math.random()*20}px;height:${30+Math.random()*20}px;
        background:rgba(80,60,40,0.5);border-radius:50%;
        left:${35+Math.random()*30}vw;top:60vh;
        animation:smokeRise ${1+Math.random()*0.5}s ease forwards;
        animation-delay:${Math.random()*0.3}s;
        pointer-events:none;z-index:400;
      `;
      document.body.appendChild(p);
      setTimeout(()=>p.remove(), 2000);
    }
    overlay.remove();

  } else {
    // 失敗：薄い煙
    for(let i=0;i<4;i++){
      const p=document.createElement('div');
      p.style.cssText=`
        position:fixed;
        width:20px;height:20px;
        background:rgba(80,60,40,0.3);border-radius:50%;
        left:${40+Math.random()*20}vw;top:65vh;
        animation:smokeRise 1s ease forwards;
        animation-delay:${i*0.1}s;
        pointer-events:none;z-index:400;
      `;
      document.body.appendChild(p);
      setTimeout(()=>p.remove(), 1500);
    }
    overlay.remove();
  }
}

async function startCooking(){
  if(selIngredients.length<3||selChefs.length<3) return;

  const log=document.getElementById('cook-log');
  log.innerHTML='';
  document.getElementById('cook-start-btn').disabled=true;
  const copyBtn = document.getElementById('copy-log-btn');
  if(copyBtn) copyBtn.style.display='none';

  const ings = selIngredients.map(i=>ingredients[i]);
  const chefs = selChefs.map(ci=>chars[ci]);

  const shuffledIngs = [...ings].sort(()=>Math.random()-.5);
  const shuffledChefs = [...chefs].sort(()=>Math.random()-.5);

  const stage = document.getElementById('cook-stage');
  stage.style.display='flex';
  document.getElementById('cook-dice-area').innerHTML='';
  renderStage(shuffledChefs, -1);

  logLine('── 調理開始 ──','separator');
  await logWait(400);

  let charTotal=0, ingTotal=0;
  const chefRolls=[], ingRolls=[];

  for(let i=0;i<3;i++){
    const chef=shuffledChefs[i];
    const ing=shuffledIngs[i];

    renderStage(shuffledChefs, i);
    await logWait(300);

    const dex=+(chef.stats?.['器用']||chef.stats?.['器用度']||0);
    const int_=+(chef.stats?.['知力']||0);
    const bonus=Math.floor(dex/5)+Math.floor(int_/5);

    const chefRoll=rollDetail();
    const ingRoll=rollDetail();
    const chefScore=bonus+chefRoll.total;
    const ingScore=ing.diff+ingRoll.total;

    chefRolls.push(chefRoll);
    ingRolls.push(ingRoll);
    charTotal+=chefScore;
    ingTotal+=ingScore;

    const success=chefScore>=ingScore;

    logLine(cookingActionText(chef.name, ing.name));
    bounceChar(i);
    await logWait(300);

    // ダイスアニメ（キャラ側）
    await animateDice(chefRoll, success);
    await logWait(200);

    // キャラ側・食材側のダイス結果を両方表示（ボーナス・難易度込み）
    const charDiceStr = `🎲 2d6(${chefRoll.d1},${chefRoll.d2})＋調理ボーナス${bonus} = ${chefScore}`;
    const ingDiceStr  = `🎲 2d6(${ingRoll.d1},${ingRoll.d2})＋調理難易度${ing.diff} = ${ingScore}`;
    logLine(`${chef.name}: ${charDiceStr}`, 'dice-summary');
    logLine(`${ing.name}: ${ingDiceStr}`, 'dice-summary');

    // 結果テキスト
    logLine(`${chef.name}は${cookingResultText(success)}`);
    logLine(success ? '  ✓ 成功' : '  ✗ 失敗', success?'dice-ok':'dice-ng');
    await logWait(700);

    if(i<2){logLine('');await logWait(300);}
  }

  // 調理結果
  await logWait(400);
  renderStage(shuffledChefs, 99);
  document.getElementById('cook-dice-area').innerHTML='';
  logLine('');
  logLine('── 調理結果 ──','separator');
  await logWait(500);

  const charWins = charTotal>=ingTotal;
  const hasDouble12 = chefRolls.some(r=>r.d1===6&&r.d2===6);
  const hasDouble1  = chefRolls.some(r=>r.d1===1&&r.d2===1);

  const dicesSummary = shuffledChefs.map((c,i)=>{
    const r=chefRolls[i];
    return `${c.name}(${r.d1},${r.d2})`;
  }).join('　');
  logLine(dicesSummary,'dice-summary');
  await logWait(500);

  if(charWins) [0,1,2].forEach(i=>setTimeout(()=>bounceChar(i), i*120));

  await logWait(400);

  let resultLabel, resultCls, effectType;
  if(charWins && hasDouble12){
    resultLabel='✦ 大成功 ✦'; resultCls='result-great'; effectType='great';
  } else if(charWins){
    resultLabel='◎ 成功'; resultCls='result-ok'; effectType='ok';
  } else if(!charWins && hasDouble1){
    resultLabel='✕ 大失敗'; resultCls='result-bad'; effectType='bad';
  } else {
    resultLabel='△ 失敗'; resultCls='result-fail'; effectType='fail';
  }

  logLine(resultLabel, resultCls);
  spawnParticles(effectType);
  await logWait(600);

  // 料理名生成（成功のみ）
  if(charWins){
    logLine('料理名を考えています…','generating');
    const ingNames = ings.map(i=>i.name).join('・');
    const baseType = getBaseType(ings);
    const isGreat = hasDouble12;
    try{
      const baseInstruction = baseType
        ? `この料理のベース調理法は「${baseType}」です。料理名に必ず「${baseType}」という単語を含めてください。`
        : `ベース素材がないため、カレー・串焼き・鍋・シチュー・丼・キッシュ・パイなどの中からランダムに選んでファンタジーっぽい名前をつけてください。`;
      const resp=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          model:'claude-sonnet-4-20250514',
          max_tokens:80,
          system:`あなたはファンタジーTRPGの料理名ジェネレーターです。
料理名を1つだけ返してください。説明文・句読点・括弧は不要です。
素材名をそのまま使わず料理っぽく変換してください。
${baseInstruction}
大成功の場合は特に豪華で印象的な名前にしてください。
記載例：「魔物肉と魔香草の唐揚げ」「龍草のスープ」「妖精ベリーのパイ」`,
          messages:[{role:'user',content:`使用素材：${ingNames}\n結果：${isGreat?'大成功':'成功'}`}]
        })
      });
      const data=await resp.json();
      let dishName=data.content?.[0]?.text?.trim()||'';
      // APIがbaseTypeを無視した場合は末尾に追記
      if(baseType && dishName && !dishName.includes(baseType)){
        dishName = dishName.replace(/の一品|一品$/,'') + 'の' + baseType;
      }
      if(!dishName) dishName = buildFallbackDishName(ings, baseType);
      const genEl=log.querySelector('.generating');
      if(genEl) genEl.remove();
      logLine(`🍽 ${dishName}`,'dish-name');
    }catch(e){
      console.error('料理名API失敗:', e);
      const genEl=log.querySelector('.generating');
      if(genEl) genEl.remove();
      // APIが失敗してもベース素材は反映する
      const fallbackName = buildFallbackDishName(ings, baseType);
      logLine(`🍽 ${fallbackName}`,'dish-name');
    }
  } else {
    await logWait(300);
    const failMsgs = hasDouble1
      ? ['料理は見るも無残な姿になってしまった…','とても食べられるものではなさそうだ…']
      : ['なんとか形にはなったが、いまひとつだ…','食べられないことはないが…'];
    logLine(failMsgs[Math.floor(Math.random()*failMsgs.length)],'result-fail');
  }

  document.getElementById('cook-start-btn').disabled=false;
  // コピーボタンを表示
  const copyBtn = document.getElementById('copy-log-btn');
  if(copyBtn) copyBtn.style.display='';
}

function copyLog(){
  const log = document.getElementById('cook-log');
  const lines = [...log.querySelectorAll('.cook-log-line')].map(el=>el.textContent).join('\n');
  navigator.clipboard.writeText(lines).then(()=>{
    const btn = document.getElementById('copy-log-btn');
    const orig = btn.textContent;
    btn.textContent='✓ コピーしました';
    setTimeout(()=>btn.textContent=orig, 2000);
  }).catch(()=>{
    // clipboard APIが使えない場合はtextareaで代替
    const ta = document.createElement('textarea');
    ta.value = lines;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    const btn = document.getElementById('copy-log-btn');
    btn.textContent='✓ コピーしました';
    setTimeout(()=>btn.textContent='📋 テキストコピー', 2000);
  });
}

/* フォールバック料理名（API失敗時・ベース素材考慮） */
function buildFallbackDishName(ings, baseType){
  const noBase = ['魔物の肉','サハギン肉','山羊乳','トマト','野草','りんご','妖精ベリー'];
  const subIngs = ings.filter(i=>!noBase.some(n=>i.name===n||i.name.includes(n)));
  const mainIng = subIngs.length ? subIngs[0].name : ings[0].name;
  const cookType = baseType || ['鍋','串焼き','シチュー','カレー','丼'][Math.floor(Math.random()*5)];
  return `${mainIng}の${cookType}`;
}

/* ベース素材判定 → 料理種別を返す */
function getBaseType(ings){
  // ベース素材マップ（複数ある場合はランダム選択）
  const baseMap = [
    {names:['魔物の肉','魔物肉'],  types:['唐揚げ']},
    {names:['サハギン肉'],         types:['煮つけ']},
    {names:['山羊乳'],             types:['スープ']},
    {names:['トマト'],             types:['スープ','サラダ']},
    {names:['野草'],               types:['サラダ']},
  ];
  const candidates=[];
  for(const ing of ings){
    for(const bm of baseMap){
      if(bm.names.some(n=>ing.name===n||ing.name.includes(n))){
        // この素材に対応するtypeをランダムに1つ選んでcandidatesに追加
        candidates.push(bm.types[Math.floor(Math.random()*bm.types.length)]);
        break;
      }
    }
  }
  if(!candidates.length) return null;
  return candidates[Math.floor(Math.random()*candidates.length)];
}

/* ━━━━━━ SAVE / LOAD (Firebase + localStorage fallback) ━━━━━━ */
const SAVE_KEY='trpg_session_board_v1';
let saveTimer=null;
let fbDb=null; // Firebase database reference
let isSyncing=false;

function getPayload(){
  const imgMap={};
  const charsNoImg=chars.map((c,i)=>{if(c.img)imgMap['c'+i]=c.img;return{...c,img:null};});
  const enemiesNoImg=enemies.map((e,i)=>{if(e.img)imgMap['e'+i]=e.img;return{...e,img:null};});
  return {chars:charsNoImg,enemies:enemiesNoImg,memoBoards,statusTemplates,imgMap};
}

function applyPayload(data){
  const imgMap=data.imgMap||{};
  chars=(data.chars||[]).map((c,i)=>({...c,img:imgMap['c'+i]||null}));
  enemies=(data.enemies||[]).map((e,i)=>({...e,img:imgMap['e'+i]||null,hpmax:e.hpmax||e.hp,hit:e.hit||0,evd:e.evd||0,lif:e.lif||0,mnd:e.mnd||0,mp:e.mp||0,mpmax:e.mpmax||0}));
  memoBoards=data.memoBoards||memoBoards;
  if(data.statusTemplates) statusTemplates=data.statusTemplates;
}

function setIndicator(msg, cls){
  const ind=document.getElementById('save-indicator');
  ind.textContent=msg; ind.className='save-indicator'+(cls?' '+cls:'');
}

function save(){
  setIndicator('保存中...','saving');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{
      const payload=getPayload();
      // localStorage (常に保存)
      localStorage.setItem(SAVE_KEY, JSON.stringify(payload));
      // Firebase
      if(fbDb){
        await fbDb.ref('sessionboard').set(payload);
      }
      setIndicator('✓ 保存済み','saved');
      setTimeout(()=>setIndicator(''),2500);
    }catch(e){
      setIndicator('保存失敗','');
      console.error(e);
    }
  },600);
}

function loadSave(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    applyPayload(JSON.parse(raw));
    return true;
  }catch(e){console.error('Load failed:',e);return false;}
}

function clearAllData(){
  if(!confirm('全データをリセットしますか？\nこの操作は元に戻せません。'))return;
  localStorage.removeItem(SAVE_KEY);
  if(fbDb) fbDb.ref('sessionboard').remove();
  location.reload();
}

/* ━━━━━━ FIREBASE INIT ━━━━━━ */
async function initFirebase(){
  try{
    setIndicator('接続中...','saving');
    // Firebase SDKをダイナミックにロード
    const {initializeApp} = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
    const {getDatabase, ref, set, onValue, get} = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js');

    const firebaseConfig={
      apiKey:"AIzaSyBiETeAAq6kLoKcMSVnjUPOGJ00qYDPNFM",
      authDomain:"trpg-session-board.firebaseapp.com",
      databaseURL:"https://trpg-session-board-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId:"trpg-session-board",
      storageBucket:"trpg-session-board.firebasestorage.app",
      messagingSenderId:"728363287201",
      appId:"1:728363287201:web:2c7da1addd73a97f81e6e0"
    };

    const app=initializeApp(firebaseConfig);
    const db=getDatabase(app);

    // まずFirebaseの最新データを取得してローカルに適用
    const snapshot=await get(ref(db,'sessionboard'));
    if(snapshot.exists()){
      applyPayload(snapshot.val());
      localStorage.setItem(SAVE_KEY, JSON.stringify(snapshot.val()));
      renderChars(); renderEnemies(); renderMemoBoards();
    }

    // リアルタイム監視：他のデバイスの変更を受け取る
    onValue(ref(db,'sessionboard'), (snap)=>{
      if(isSyncing) return; // 自分の書き込みは無視
      if(!snap.exists()) return;
      const data=snap.val();
      applyPayload(data);
      localStorage.setItem(SAVE_KEY, JSON.stringify(data));
      renderChars(); renderEnemies(); renderMemoBoards();
      setIndicator('↓ 同期済み','saved');
      setTimeout(()=>setIndicator(''),2000);
    });

    // save()からFirebaseに書き込めるようにdbを保持
    fbDb={
      ref:(path)=>({
        set: async(val)=>{
          isSyncing=true;
          await set(ref(db,path),val);
          setTimeout(()=>isSyncing=false,1000);
        },
        remove: ()=>set(ref(db,'sessionboard'),null)
      })
    };

    setIndicator('✓ Firebase接続済み','saved');
    setTimeout(()=>setIndicator(''),3000);

  }catch(e){
    console.error('Firebase init failed:',e);
    setIndicator('⚠ オフライン（ローカル保存）','');
    setTimeout(()=>setIndicator(''),4000);
  }
}
