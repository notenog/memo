<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>魔物データ図鑑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0f0e0c; --bg2: #1a1916; --bg3: #232220;
  --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.14);
  --text: #e8e4dc; --text2: #9a9589; --text3: #5c574f;
  --gold: #c9a84c; --gold2: #e8c97a; --accent: #7c6a3a;
  --r1: #1a2a1a; --r1t: #5ab85a;
  --r2: #1a2a3a; --r2t: #6aabdd;
  --r3: #1a2e1a; --r3t: #72c472;
  --r4: #2e2412; --r4t: #d4a340;
  --r5: #2e1a1a; --r5t: #d46060;
  --r6: #2a1a2a; --r6t: #c472c4;
  --r7: #1e1a32; --r7t: #8878e8;
  --r8: #1a2a1a; --r8t: #5ab85a;
  --r9: #1a2a3a; --r9t: #6aabdd;
  --r10: #1a2e1a; --r10t: #72c472;
  --r11: #2e2412; --r11t: #d4a340;
  --r12: #2e1a1a; --r12t: #d46060;
  --r13: #2a1a2a; --r13t: #c472c4;

  --radius: 10px; --radius-sm: 6px;
}

.mark-label{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px;cursor:pointer;user-select:none;margin-right:4px;transition:opacity 0.15s;}
.mark-label:hover{opacity:0.8;}
.mark-常時{background:#1a3a1a;color:#6dd46d;border:0.5px solid #3a6a3a;}
.mark-主動作{background:#1a2a3a;color:#6aaee8;border:0.5px solid #2a4a6a;}
.mark-補助動作{background:#2a1a3a;color:#c47de8;border:0.5px solid #4a2a6a;}
.mark-戦闘準備{background:#3a2a1a;color:#e8b46a;border:0.5px solid #6a4a2a;}
.mark-宣言{background:#3a1a1a;color:#e86a6a;border:0.5px solid #6a2a2a;}
.mark-popover{position:fixed;z-index:9999;max-width:280px;background:#1e1c1a;border:0.5px solid var(--gold);border-radius:8px;padding:10px 13px;font-size:12px;line-height:1.7;color:var(--text);box-shadow:0 4px 20px rgba(0,0,0,0.6);pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity 0.15s,transform 0.15s;}
.mark-popover.visible{pointer-events:auto;opacity:1;transform:translateY(0);}
.mark-popover-title{font-weight:700;margin-bottom:5px;color:var(--gold2);}
.mark-popover-close{position:absolute;top:6px;right:8px;background:none;border:none;color:var(--text3);cursor:pointer;font-size:13px;}

body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

.site-header { background: var(--bg2); border-bottom: 0.5px solid var(--border2); padding: 12px 20px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 10; flex-wrap: wrap; }
.site-title { font-family: 'Shippori Mincho', serif; font-size: 18px; font-weight: 700; color: var(--gold2); letter-spacing: 0.1em; margin-right: auto; }
.site-count { font-size: 12px; color: var(--text3); white-space: nowrap; }
.search-wrap { position: relative; }
.search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; stroke: var(--text3); fill: none; stroke-width: 2; stroke-linecap: round; }
.search-wrap input { background: var(--bg3); border: 0.5px solid var(--border2); border-radius: var(--radius-sm); color: var(--text); font-size: 13px; font-family: 'Noto Sans JP', sans-serif; padding: 6px 10px 6px 30px; width: 160px; outline: none; transition: border-color 0.15s; }
.search-wrap input:focus { border-color: var(--gold); }
.search-wrap input::placeholder { color: var(--text3); }

.filter-bar { display: flex; gap: 6px; padding: 10px 20px; flex-wrap: wrap; border-bottom: 0.5px solid var(--border); background: var(--bg2); }
.fbtn { font-size: 11px; font-family: 'Noto Sans JP', sans-serif; padding: 3px 10px; border-radius: 20px; border: 0.5px solid var(--border2); background: transparent; cursor: pointer; color: var(--text2); transition: all 0.15s; }
.fbtn:hover { border-color: var(--gold); color: var(--gold); }
.fbtn.active { background: var(--accent); color: var(--gold2); border-color: var(--gold); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; padding: 20px 48px; }
@media (max-width: 600px) { .grid { padding: 12px 16px; } }
.no-results { grid-column: 1/-1; text-align: center; padding: 48px; color: var(--text3); font-size: 14px; }

.card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); cursor: pointer; overflow: hidden; transition: border-color 0.15s, transform 0.1s; }
.card:hover { border-color: var(--gold); transform: translateY(-1px); }
.card-head { padding: 10px 12px 8px; display: flex; align-items: flex-start; gap: 8px; }
.rbadge { min-width: 26px; height: 26px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
.r1 { background: var(--r1); color: var(--r1t); }
.r2 { background: var(--r2); color: var(--r2t); }
.r3 { background: var(--r3); color: var(--r3t); }
.r4 { background: var(--r4); color: var(--r4t); }
.r5 { background: var(--r5); color: var(--r5t); }
.r6 { background: var(--r6); color: var(--r6t); }
.r7 { background: var(--r7); color: var(--r7t); }
.r8{background:var(--r8);color:var(--r8t);border:1px solid var(--r8t);}
.r9{background:var(--r9);color:var(--r9t);border:1px solid var(--r9t);}
.r10{background:var(--r10);color:var(--r10t);border:1px solid var(--r10t);}
.r11{background:var(--r11);color:var(--r11t);border:1px solid var(--r11t);}
.r12{background:var(--r12);color:var(--r12t);border:1px solid var(--r12t);}
.r13{background:var(--r13);color:var(--r13t);border:1px solid var(--r13t);}
.r14{background:var(--r1);color:var(--r1t);border:1.5px solid var(--r1t);}
.r15{background:var(--r2);color:var(--r2t);border:1.5px solid var(--r2t);}
.r16{background:var(--r3);color:var(--r3t);border:1.5px solid var(--r3t);}
.r17{background:var(--r4);color:var(--r4t);border:1.5px solid var(--r4t);}
.r18{background:var(--r5);color:var(--r5t);border:1.5px solid var(--r5t);}
.r19{background:var(--r6);color:var(--r6t);border:1.5px solid var(--r6t);}
.r20{background:var(--r7);color:var(--r7t);border:1.5px solid var(--r7t);}

.card-name { font-size: 13px; font-weight: 500; color: var(--text); line-height: 1.4; }
.card-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }
.card-cat { font-size: 10px; color: var(--gold); margin-top: 1px; }
.card-stats { display: grid; grid-template-columns: repeat(3,1fr); border-top: 0.5px solid var(--border); }
.cs { text-align: center; padding: 6px 4px; border-right: 0.5px solid var(--border); }
.cs:last-child { border-right: none; }
.cs-l { font-size: 9px; color: var(--text3); margin-bottom: 2px; }
.cs-v { font-size: 13px; font-weight: 500; color: var(--gold2); }

.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 30; align-items: center; justify-content: center; padding: 16px; }
.overlay.open { display: flex; }
.panel { background: var(--bg2); border: 0.5px solid var(--border2); border-radius: var(--radius); width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border2) transparent; }
.panel-head { padding: 14px 16px 12px; border-bottom: 0.5px solid var(--border); display: flex; align-items: flex-start; gap: 10px; position: sticky; top: 0; background: var(--bg2); z-index: 1; }
.panel-name { font-family: 'Shippori Mincho', serif; font-size: 17px; font-weight: 700; color: var(--gold2); }
.panel-sub { font-size: 12px; color: var(--text2); margin-top: 3px; }
.close-btn { margin-left: auto; background: transparent; border: 0.5px solid var(--border2); border-radius: var(--radius-sm); cursor: pointer; color: var(--text2); font-size: 14px; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: border-color 0.15s, color 0.15s; }
.close-btn:hover { border-color: var(--gold); color: var(--gold); }
.fmt-block { padding: 14px 16px; font-family: monospace; font-size: 12px; line-height: 1.9; color: var(--text); white-space: pre; background: var(--bg3); border-bottom: 0.5px solid var(--border); overflow-x: auto; scrollbar-width: thin; }
.copy-bar { padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
.copy-btn { font-family: 'Noto Sans JP', sans-serif; font-size: 12px; padding: 5px 14px; border-radius: var(--radius-sm); border: 0.5px solid var(--gold); background: transparent; color: var(--gold2); cursor: pointer; display: flex; align-items: center; gap: 5px; transition: background 0.15s; }
.copy-btn:hover { background: var(--accent); }
.copy-btn svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.copied-msg { font-size: 12px; color: #72c472; opacity: 0; transition: opacity 0.3s; }
.copied-msg.show { opacity: 1; }
.add-btn { font-family: 'Noto Sans JP', sans-serif; font-size: 12px; padding: 5px 14px; border-radius: var(--radius-sm); border: 0.5px solid var(--gold); background: transparent; color: var(--gold2); cursor: pointer; transition: background 0.15s; white-space: nowrap; }
.add-btn:hover { background: var(--accent); }
.add-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 40; align-items: center; justify-content: center; padding: 16px; }
.add-overlay.open { display: flex; }
.add-panel { background: var(--bg2); border: 0.5px solid var(--border2); border-radius: var(--radius); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; scrollbar-width: thin; }
.add-head { padding: 14px 18px 12px; border-bottom: 0.5px solid var(--border); display: flex; align-items: center; gap: 10px; position: sticky; top: 0; background: var(--bg2); z-index: 1; }
.add-title { font-size: 15px; font-weight: 500; color: var(--gold2); margin-right: auto; }
.add-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.frow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.frow3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.fgroup { display: flex; flex-direction: column; gap: 4px; }
.fgroup label { font-size: 11px; color: var(--text2); }
.fgroup input, .fgroup select, .fgroup textarea { background: var(--bg3); border: 0.5px solid var(--border2); border-radius: var(--radius-sm); color: var(--text); font-size: 13px; font-family: 'Noto Sans JP', sans-serif; padding: 6px 10px; outline: none; width: 100%; transition: border-color 0.15s; }
.fgroup input:focus, .fgroup select:focus, .fgroup textarea:focus { border-color: var(--gold); }
.fgroup select option { background: var(--bg3); }
.fgroup textarea { resize: vertical; min-height: 70px; line-height: 1.6; }
.fsep { font-size: 11px; color: var(--text3); border-bottom: 0.5px solid var(--border); padding-bottom: 4px; margin-top: 4px; }
.add-foot { padding: 12px 18px; border-top: 0.5px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }
.btn-save { font-family: 'Noto Sans JP', sans-serif; font-size: 13px; padding: 6px 20px; border-radius: var(--radius-sm); border: 0.5px solid var(--gold); background: var(--accent); color: var(--gold2); cursor: pointer; }
.btn-cancel { font-family: 'Noto Sans JP', sans-serif; font-size: 13px; padding: 6px 16px; border-radius: var(--radius-sm); border: 0.5px solid var(--border2); background: transparent; color: var(--text2); cursor: pointer; }
.badge-orig { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 8px; background: #2a2010; color: var(--gold); border: 0.5px solid var(--gold); margin-left: 4px; vertical-align: middle; }
</style>
</head>
<body>

<header class="site-header">
  <span class="site-title">📖 魔物データ図鑑</span>
  <span class="site-count" id="siteCount"></span>
  <div class="search-wrap">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="searchInput" placeholder="名前・カテゴリで検索...">
  </div>
  <button class="add-btn" onclick="openAddForm()" title="⚠️ 追加したオリジナルデータはブラウザを閉じると削除されます。&#10;必ずエクスポートでJSONに保存してください。">＋ オリジナル追加</button>
  <div style="position:relative;display:inline-block;" id="exportWrap">
    <button class="add-btn" onclick="toggleExportMenu()" style="border-color:#4a8a6a;color:#7acca8;" id="btnExport">⬇ エクスポート</button>
    <div id="exportMenu" style="display:none;position:absolute;top:100%;left:0;margin-top:4px;background:var(--bg2);border:0.5px solid var(--border2);border-radius:var(--radius-sm);z-index:100;min-width:160px;">
      <button onclick="exportJSON('all');closeExportMenu()" style="display:block;width:100%;text-align:left;padding:8px 14px;background:transparent;border:none;color:#7acca8;cursor:pointer;font-size:13px;" id="btnExportAll">全体(0体)</button>
      <button onclick="exportJSON('original');closeExportMenu()" style="display:block;width:100%;text-align:left;padding:8px 14px;background:transparent;border:none;color:#7acca8;cursor:pointer;font-size:13px;border-top:0.5px solid var(--border);" id="btnExportOrig">オリジナルのみ(0体)</button>
    </div>
  </div>
  <input type="file" id="importInput" accept=".json" style="display:none" onchange="importJSON(event)">
  <button class="add-btn" onclick="document.getElementById('importInput').click()" style="border-color:#4a6a8a;color:#7aa8cc;">⬆ インポート</button>
  <button class="add-btn" onclick="openTekeySettings()" style="border-color:#8a6a2a;color:#e8b84a;">⚙ Tekey設定</button>
</header>

<div class="filter-bar">
  <button class="fbtn active" onclick="setFilter('all',this)">すべて</button>
  <button class="fbtn" onclick="setFilter('蛮族',this)">蛮族</button>
  <button class="fbtn" onclick="setFilter('動物',this)">動物</button>
  <button class="fbtn" onclick="setFilter('植物',this)">植物</button>
  <button class="fbtn" onclick="setFilter('アンデッド',this)">アンデッド</button>
  <button class="fbtn" onclick="setFilter('魔法生物',this)">魔法生物</button>
  <button class="fbtn" onclick="setFilter('魔動機',this)">魔動機</button>
  <button class="fbtn" onclick="setFilter('幻獣',this)">幻獣</button>
  <button class="fbtn" onclick="setFilter('魔神',this)">魔神</button>
  <button class="fbtn" onclick="setFilter('人族',this)">人族</button>
  <button class="fbtn" onclick="setFilter('飛行',this)">✈飛行</button>
  <button class="fbtn" onclick="setFilter('魔法',this)">✨魔法</button>
  <button class="fbtn" onclick="setFilter('毒',this)">☠毒</button>
</div>

<div class="grid" id="grid"></div>

<div class="overlay" id="overlay" onclick="handleOverlayClick(event)">
  <div class="panel">
    <div class="panel-head">
      <div>
        <div class="panel-name" id="pname"></div>
        <div class="panel-sub" id="psub"></div>
      </div>
      <button class="close-btn" onclick="closePanel()">✕</button>
    </div>
    <div class="fmt-block" id="fmtBlock"></div>
    <div class="copy-bar">
      <button class="copy-btn" onclick="copyOne()">
        <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
        このデータをコピー
      </button>
      <button class="copy-btn" onclick="copyPalette()" style="border-color:#7c6a9a;color:#c4a8e8;">
        <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
        チャットパレットをコピー
      </button>
      <span class="copied-msg" id="copiedMsg">コピーしました！</span>
    </div>
  </div>
</div>

<div class="mark-popover" id="markPopover"><button class="mark-popover-close" onclick="closeMarkPopover()">✕</button><div class="mark-popover-title" id="markPopTitle"></div><div id="markPopDesc"></div></div>
<!-- Tekey設定モーダル -->
<div class="add-overlay" id="tekeySettingsOverlay">
  <div class="add-panel">
    <div class="add-head">
      <span class="add-title">⚙ Tekey設定</span>
      <button class="close-btn" onclick="closeTekeySettings()">✕</button>
    </div>
    <div class="add-body">
      <div class="frow">
        <div class="fgroup"><label>ルームID</label><input id="ts_room" placeholder="ルームID"></div>
        <div class="fgroup"><label>ルームパスワード</label><input id="ts_pass" type="password" placeholder="パスワード"></div>
      </div>
      <div style="font-size:11px;color:var(--text3);line-height:1.7;margin-top:4px;">
        ※ 設定はブラウザに保存されます（localStorage）。
      </div>
    </div>
    <div class="add-foot">
      <button class="btn-cancel" onclick="closeTekeySettings()">キャンセル</button>
      <button class="btn-save" onclick="saveTekeySettings()">保存</button>
    </div>
  </div>
</div>

<!-- Tekey追加モーダル -->
<div class="add-overlay" id="tekeyAddOverlay">
  <div class="add-panel">
    <div class="add-head">
      <span class="add-title" id="tekeyAddTitle">コマ生成</span>
      <button class="close-btn" onclick="closeTekeyAdd()">✕</button>
    </div>
    <div class="add-body">
      <div class="frow">
        <div class="fgroup"><label>群れ数</label>
          <input id="tk_count" type="number" min="1" max="26" value="1">
        </div>
        <div class="fgroup"><label>⚔️ 剣のかけら（個数）</label>
          <input id="tk_shard" type="number" min="0" value="0" style="accent-color:#e8b84a;">
        </div>
      </div>
      <div id="tk_shard_preview" style="display:none;font-size:11px;color:#e8b84a;margin-top:-6px;margin-bottom:4px;padding:4px 8px;background:rgba(232,184,74,0.08);border-radius:4px;border:0.5px solid rgba(232,184,74,0.3);"></div>
      <div class="fgroup"><label>コマ画像（ローカルファイル）</label>
        <input type="file" id="tk_image_file" accept="image/*" style="color:var(--text2);font-size:12px;">
        <div style="font-size:11px;color:var(--text3);margin-top:4px;">Firebase Storageにアップロードします。設定済みの場合のみ有効。</div>
      </div>
      <div id="tk_image_preview" style="margin-top:4px;display:none;">
        <img id="tk_image_thumb" style="max-height:60px;border-radius:4px;border:0.5px solid var(--border2);">
        <div style="font-size:11px;color:var(--text3);margin-top:2px;" id="tk_image_url_display"></div>
      </div>
      <div style="font-size:12px;color:var(--text2);margin-top:4px;line-height:1.8;" id="tk_preview"></div>
    </div>
    <div class="add-foot">
      <button class="btn-cancel" onclick="closeTekeyAdd()">キャンセル</button>
      <button class="btn-save" onclick="sendToTekey()" id="tk_sendBtn">送信</button>
    </div>
  </div>
</div>

<!-- オリジナル追加フォーム -->
<div class="add-overlay" id="addOverlay">
  <div class="add-panel">
    <div class="add-head">
      <span class="add-title">✨ オリジナルモンスターを追加</span>
      <button class="close-btn" onclick="closeAddForm()">✕</button>
    </div>
    <div class="add-body">
      <div class="frow">
        <div class="fgroup"><label>種族名 *</label><input id="f_name" placeholder="例：ダークゴブリン"></div>
        <div class="fgroup"><label>魔物Lv *</label><input id="f_rank" type="number" min="1" max="15" placeholder="例：3"></div>
      </div>
      <div class="frow">
        <div class="fgroup"><label>カテゴリ</label>
          <select id="f_cat">
            <option>蛮族</option><option>動物</option><option>植物</option>
            <option>アンデッド</option><option>魔法生物</option><option>魔動機</option>
            <option>幻獣</option><option>魔神</option><option>人族</option><option>オリジナル</option>
          </select>
        </div>
        <div class="fgroup"><label>生息地</label><input id="f_habitat" placeholder="例：森・洞窟"></div>
      </div>
      <div class="fsep">基本ステータス</div>
      <div class="frow3">
        <div class="fgroup"><label>HP</label><input id="f_hp" type="number" placeholder="20"></div>
        <div class="fgroup"><label>MP</label><input id="f_mp" placeholder="10"></div>
        <div class="fgroup"><label>先制値</label><input id="f_init" type="number" placeholder="10"></div>
      </div>
      <div class="frow3">
        <div class="fgroup"><label>移動速度</label><input id="f_move" placeholder="12/―"></div>

function strWidth(s) {
  let w = 0;
  for (const ch of String(s)) {
    const cp = ch.codePointAt(0);
    if (cp > 0x2E7F) w += 2; else w += 1;
  }
  return w;
}
function padR(s, width) {
  const diff = width - strWidth(String(s));
  return String(s) + '　'.repeat(Math.max(0, Math.ceil(diff / 2)));
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function shardResBonus(n) {
  if (n<=0) return 0; if (n<=5) return 1; if (n<=10) return 2; if (n<=15) return 3; return 4;
}
function addToStat(s, n) {
  if (n===0) return String(s);
  const both = String(s).match(/^(\d+)\((\d+)\)$/);
  if (both) return `${parseInt(both[1])+n}(${parseInt(both[2])+n})`;
  const single = String(s).match(/^(\d+)$/);
  if (single) return String(parseInt(single[1])+n);
  return String(s);
}

function formatAbility(raw, forHTML) {
  let label=null, cls=null, rest=raw;
  for (const m of MARK_MAP) {
    if (raw.startsWith(m.mark)) { label=m.label; cls=m.cls; rest=raw.slice(m.mark.length).trim(); break; }
  }
  const sep = rest.indexOf(' — ');
  if (forHTML) {
    const badge = label ? `<span class="mark-label ${cls}" onclick="openMarkPopover(this,'${label}')">[${label}]</span>` : '';
    if (sep===-1) return `${badge}【${esc(rest)}】`;
    return `${badge}【${esc(rest.slice(0,sep).trim())}】\n${esc(rest.slice(sep+3).trim())}`;
  } else {
    const prefix = label ? `[${label}] ` : '';
    if (sep===-1) return `${prefix}【${rest}】`;
    const title=rest.slice(0,sep).trim(), desc=rest.slice(sep+3).trim();
    const words=desc.split(''); let line='',lines=[];
    for (const ch of words) { line+=ch; if (line.length>=30 && '。、．，！？」』）]】'.includes(ch)) { lines.push(line); line=''; } }
    if (line) lines.push(line);
    return `${prefix}【${title}】\n${lines.join('\n')}`;
  }
}

function formatMonster(m) {
  const atkLines = m.attacks.map(a =>
    `${a.part}｜命中力 ${a.hit}　打撃点 ${a.dmg}　回避力 ${a.evd}　防護点 ${a.def}`
  ).join('\n');
  const abilityLines = m.abilities.length
    ? m.abilities.map(ab=>formatAbility(ab,false)).join('\n\n') : '【なし】';
  const lootLines = m.loot.length ? m.loot.map(l=>`　${l}`).join('\n') : '　なし';
  return `💠${m.cat}｜📛${padR(m.name,14)}🦋Lv：${padR(m.rank,6)}🏷️参照：
📖知名度／弱点値：${padR(m.know+'/'+m.knowval,10)}🌀弱点：${m.weakness}

${atkLines}

${abilityLines}

💰️【戦利品】
${lootLines}`;
}

function openMarkPopover(el,label){
  const info=MARK_MAP.find(m=>m.label===label); if(!info)return;
  const pop=document.getElementById('markPopover');
  document.getElementById('markPopTitle').textContent=info.desc;
  document.getElementById('markPopDesc').textContent=info.descDetail;
  const rect=el.getBoundingClientRect(),pw=280;
  let left=rect.left,top=rect.bottom+6;
  if(left+pw>window.innerWidth-8)left=window.innerWidth-pw-8;
  if(top+120>window.innerHeight)top=rect.top-120;
  pop.style.left=left+'px';pop.style.top=top+'px';
  pop.classList.add('visible');markPopOpen=true;
}

  if (!name) { alert('種族名を入力してください。'); return; }

  // 攻撃パース（部位,命中力,打撃点,回避力,防護点）
  const atkRaw = document.getElementById('f_attacks').value.trim();
  const attacks = atkRaw ? atkRaw.split('\n').map(line => {
    const p = line.split(',').map(s => s.trim());
    return { part: p[0]||'武器', hit: p[1]||'―', dmg: p[2]||'―', evd: p[3]||'―', def: p[4]||'―' };
  }) : [{part:'武器', hit:'―', dmg:'―', evd:'―', def:'―'}];

  // 特殊能力パース
  const abRaw = document.getElementById('f_abilities').value.trim();
  const abilities = abRaw ? abRaw.split('\n').map(s => s.trim()).filter(Boolean) : ['なし'];

  // 戦利品パース
  const lootRaw = document.getElementById('f_loot').value.trim();
  const loot = lootRaw ? lootRaw.split('\n').map(s => s.trim()).filter(Boolean) : [];

  const m = {
    cat:      document.getElementById('f_cat').value,
    name,
    rank,
    habitat:  document.getElementById('f_habitat').value.trim() || '―',
    hp:       parseInt(document.getElementById('f_hp').value) || 0,
    mp:       document.getElementById('f_mp').value.trim() || '―',
    init:     parseInt(document.getElementById('f_init').value) || 0,
    move:     document.getElementById('f_move').value.trim() || '―',
    vit:      document.getElementById('f_vit').value.trim() || '―',
    mres:     document.getElementById('f_mres').value.trim() || '―',
    weakness: document.getElementById('f_weakness').value.trim() || '―',
    know:     document.getElementById('f_know').value.trim() || '―',
    knowval:  document.getElementById('f_knowval').value.trim() || '―',
    attacks, abilities, loot,
    tags:     (document.getElementById('f_tags').value.trim() || '') + ',オリジナル',
    isOriginal: true,
  };
  monsters.push(m);
  closeAddForm();
  // フォームをリセット
  ['f_name','f_rank','f_habitat','f_hp','f_mp','f_init','f_move','f_vit','f_mres',
   'f_weakness','f_know','f_knowval','f_attacks','f_abilities','f_loot','f_tags']
    .forEach(id => document.getElementById(id).value = '');
  renderGrid();
}

// ── JSON エクスポート（全体 / オリジナルのみ）──
function exportJSON(mode) {
  const targets = mode === 'all' ? monsters : monsters.filter(m => m.isOriginal);
  if (!targets.length) {
    alert(mode === 'all' ? 'モンスターがいません。' : 'エクスポートするオリジナルモンスターがまだいません。');
    return;
  }
  const json = JSON.stringify(targets, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  const suffix = mode === 'all' ? 'all' : 'originals';
  a.download = `monster_${suffix}_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

// エクスポートボタンの体数表示を更新
function updateExportBtns() {
  const allCount  = monsters.length;
  const origCount = monsters.filter(m => m.isOriginal).length;
  document.getElementById('btnExportAll').textContent  = `全体(${allCount}体)`;

}
function closeExportMenu() {

document.addEventListener('click', e => {

// ── Tekey設定 ──
function openTekeySettings() {
  document.getElementById('ts_room').value      = localStorage.getItem('tekey_room') || '';
  document.getElementById('ts_pass').value      = localStorage.getItem('tekey_pass') || '';
  document.getElementById('tekeySettingsOverlay').classList.add('open');
}
function closeTekeySettings() {
  document.getElementById('tekeySettingsOverlay').classList.remove('open');
}
function saveTekeySettings() {
  localStorage.setItem('tekey_room',     document.getElementById('ts_room').value.trim());
  localStorage.setItem('tekey_pass',     document.getElementById('ts_pass').value.trim());

// ── Tekey追加モーダル ──
let tekeyTarget = null;
let tekeyImageURL = '';

function openTekeyAdd(idx) {
  tekeyTarget = monsters[idx];
  tekeyImageURL = tekeyTarget.image || '';
  document.getElementById('tekeyAddTitle').textContent = `コマ生成 ― ${tekeyTarget.name}`;
  document.getElementById('tk_count').value  = 1;
  document.getElementById('tk_shard').value  = 0;
  document.getElementById('tk_image_file').value = '';
  document.getElementById('tk_image_preview').style.display = 'none';
  updateTekeyPreview();
  document.getElementById('tekeyAddOverlay').classList.add('open');
}
function closeTekeyAdd() {
  document.getElementById('tekeyAddOverlay').classList.remove('open');
}
function updateTekeyPreview() {
  if (!tekeyTarget) return;
  const count = parseInt(document.getElementById('tk_count').value) || 1;
  const shard = parseInt(document.getElementById('tk_shard').value) || 0;
  const prefix = shard > 0 ? '*' : '';
  const names = count === 1
    ? [prefix + tekeyTarget.name]
    : Array.from({length: count}, (_, i) => `${prefix}${tekeyTarget.name}${'ABCDEFGHIJKLMNOPQRSTUVWXYZ'[i]}`);
  document.getElementById('tk_preview').innerHTML =
    `<span style="color:var(--text3)">送信するコマ：</span> ${names.join('、')}`;
  const shardDiv = document.getElementById('tk_shard_preview');
  if (shard > 0) {
    const m = tekeyTarget;
    const rb = shardResBonus(shard);
    const newHp = (parseInt(m.hp)||0) + shard*5;
    const rawMp = String(m.mp)==='―' ? null : (parseInt(m.mp)||0);
    const newMp = rawMp !== null ? rawMp + shard : '―';
    shardDiv.style.display='block';
    shardDiv.innerHTML=`⚔️ かけら×${shard}強化後：HP <b>${newHp}</b>　MP <b>${newMp}</b>　生命 <b>${addToStat(m.vit,rb)}</b>　精神 <b>${addToStat(m.mres,rb)}</b>　（抵抗+${rb}）`;
  } else { shardDiv.style.display='none'; }
}
document.addEventListener('input', e => {
  if (e.target.id === 'tk_count' || e.target.id === 'tk_shard') updateTekeyPreview();
});

// 画像ファイル選択時にプレビュー表示
document.addEventListener('change', e => {
  if (e.target.id !== 'tk_image_file') return;
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    document.getElementById('tk_image_thumb').src = ev.target.result;

// Firebase Storageへ画像アップロード
async function uploadImageToStorage(file) {
  const bucket = 'https://firebasestorage.googleapis.com/v0/b/trpgnog.firebasestorage.app';
  const fbkey  = 'AIzaSyDToH4ftmStWuAec1oiieNTgDDZvfkyyCs';
  if (!bucket) return '';

  const filename = `monster_images/${Date.now()}_${file.name}`;
  const uploadUrl = `${bucket}/o?uploadType=media&name=${encodeURIComponent(filename)}&key=${fbkey}`;

  const res = await fetch(uploadUrl, {
    method: 'POST',
    headers: { 'Content-Type': file.type },
    body: file,
  });
  if (!res.ok) throw new Error('画像アップロード失敗: ' + await res.text());
  const data = await res.json();
  // 公開URLを組み立て
  const publicUrl = `${bucket}/o/${encodeURIComponent(filename)}?alt=media`;
  return publicUrl;
}

// statNum: "4(11)" → ()内を優先
function tekeyStatNum(s) {
  const m = String(s).match(/\((\d+)\)/);
  return m ? m[1] : String(s).match(/^(\d+)/) ? String(s).match(/^(\d+)/)[1] : '0';
}

async function sendToTekey() {
  const endpoint = 'https://us-central1-trpgnog.cloudfunctions.net/tekeyProxy2';
  const room     = localStorage.getItem('tekey_room') || '';
  const pass     = localStorage.getItem('tekey_pass') || '';
  if (!room) {
    alert('先にTekey設定でルームIDを設定してください。');
    return;
  }
  if (!tekeyTarget) return;

  const btn = document.getElementById('tk_sendBtn');
  btn.disabled = true;
  btn.textContent = '準備中...';

  const m      = tekeyTarget;
  const count  = parseInt(document.getElementById('tk_count').value) || 1;

  // 画像アップロード
  let imageUrl = tekeyImageURL;
  const imageFile = document.getElementById('tk_image_file').files[0];
  if (imageFile) {
    try {
      btn.textContent = '画像アップロード中...';
      imageUrl = await uploadImageToStorage(imageFile);
      document.getElementById('tk_image_url_display').textContent = imageUrl;
    } catch (err) {
      alert('画像アップロードに失敗しました。\n' + err.message);
      btn.disabled = false;
      btn.textContent = '送信';
      return;
    }
  }

  // ステータス（生命/精神 表記に合わせる）
  const hp   = parseInt(m.hp) || 0;
  const mp   = String(m.mp) === '―' ? 0 : (parseInt(m.mp) || 0);
  const def  = m.attacks[0] ? (parseInt(m.attacks[0].def) || 0) : 0;
  const hit  = m.attacks[0] ? tekeyStatNum(m.attacks[0].hit) : '0';
  const evd  = m.attacks[0] ? tekeyStatNum(m.attacks[0].evd) : '0';
  const vit  = tekeyStatNum(m.vit);
  const mres = tekeyStatNum(m.mres);
  const init = parseInt(m.init) || 0;
  const values = `HP:${hp}:${hp},MP:${mp}:${mp},防護点:${def},命中:${hit},回避:${evd},生命:${vit},精神:${mres}`;

  // infoにコピーデータと同内容を設定
  const info = formatMonster(m);

  const suffix = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const names  = count === 1
    ? [m.name]
    : Array.from({length: count}, (_, i) => `${m.name}${suffix[i]}`);

  btn.textContent = '送信中...';
  let successCount = 0, failCount = 0;

  for (const name of names) {
    const body = { command:'addCharacter', room, password:pass, name, values, initiative: init, info };
    if (imageUrl) body.image  = imageUrl;

    try {
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (res.ok) { successCount++; }
      else { failCount++; console.error(await res.text()); }
    } catch (err) {
      failCount++;
      console.error(err);
    }
  }

  btn.disabled = false;
  btn.textContent = '送信';
  closeTekeyAdd();
  alert(failCount === 0
    ? `✅ ${successCount}体をTekeyに追加しました！`
    : `⚠️ ${successCount}体成功、${failCount}体失敗しました。`);
}

// ── JSON インポート ──
function importJSON(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!Array.isArray(data)) throw new Error('配列ではありません');
      let added = 0, skipped = 0;
      data.forEach(m => {
        if (!m.name) { skipped++; return; }
        // 同名が既に存在する場合はスキップ
        if (monsters.some(existing => existing.name === m.name && existing.isOriginal)) {
          skipped++;
          return;
        }
        m.isOriginal = true;
        monsters.push(m);
        added++;
      });
      renderGrid();
      alert(`インポート完了：${added}体追加、${skipped}体スキップ（同名重複）`);
    } catch (err) {
      alert('JSONの読み込みに失敗しました。\n' + err.message);
    }
    event.target.value = '';
  };
  reader.readAsText(file, 'utf-8');
}
