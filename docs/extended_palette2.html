<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拡張パレット2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<!--
  拡張パレット2 — Tekey チャットパレットの外部移植ツール
  - Tekeyのチャットパレット書き出しJSON({"palettes":[...]})を相互運用
  - stockは純Tekeyテキストのまま保持（往復を壊さない）
  - 送信行はWYSIWYG（長文・記号もそのまま。送信時のみ《》／→[]/に安全変換）
  - ::: ブロックは「送信しない自分用メモ(カンペ)」としてcallout表示。markdown可
  - 送信はFirebase Functions(tekeyProxy2)経由。endpoint/room等は設定に保存(localStorage)
-->
<style>
  :root{
    --hd:#f3f5f8; --hd-tx:#1e2230; --bg:#ffffff; --panel:#f3f5f8; --panel2:#e8ebf1;
    --bd:#e4e7ec; --bd2:#d7dbe3; --tx:#1e2230; --tx2:#586072; --tx3:#8b92a2;
    --link:#4a3fb0; --link-h:#5b50cc; --send:#4a3fb0; --send-h:#5b50cc; --send-sh:#352c8e;
    --danger:#c0392b; --radius:7px;
    --fs:14px;
    --line-h:#eceaf9; --line-hbd:#d6d1f2; --guide:#e4e7ec; --sep:#e4e7ec;
    --head-bg:#eef0f6; --head-bg2:#f3f5f8; --head-bgh:#e6e9f3;
    --grid:#eceef3; --grid2:#e1e4ec;
    --gold:#9c6f18; --gold-soft:#f6efdc; --gold-line:#e8d6a8;
    --display:"Zen Kaku Gothic New","BIZ UDPGothic",system-ui,sans-serif;
    --body:"BIZ UDPGothic","Zen Kaku Gothic New",system-ui,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  body[data-theme="dark"]{
    --hd:#4a4a4a; --hd-tx:#eceef1; --bg:#424242; --panel:#4a4a4a; --panel2:#3c3c3c;
    --bd:#585858; --bd2:#646464; --tx:#eceef1; --tx2:#b7bdc6; --tx3:#8c939d;
    --link:#aa9eff; --link-h:#c2b8ff; --send:#6a5fd8; --send-h:#8478ea; --send-sh:#473ca8;
    --line-h:#4c4868; --line-hbd:#5c5882; --guide:#5a5a5a; --sep:#585858;
    --head-bg:#525252; --head-bg2:#4b4b4b; --head-bgh:#5a5566;
    --grid:#4a4a4a; --grid2:#545454;
    --gold:#e0b154; --gold-soft:#4e4733; --gold-line:#6a5e3a;
  }
  body[data-theme="dark"] .swatch,body[data-theme="dark"] #f_bot,
  body[data-theme="dark"] .ident input[type=text],body[data-theme="dark"] #compose,
  body[data-theme="dark"] #editArea,body[data-theme="dark"] .fg input{background:#3a3a3a; color:var(--tx)}
  body[data-theme="dark"] .callout.info{background:#1f3a57; border-color:#3c618c; border-left-color:#7cc0ff; color:#d3e6fb}
  body[data-theme="dark"] .callout.warn{background:#4a3a18; border-color:#735d2c; border-left-color:#f2bb4d; color:#f4dfa6}
  body[data-theme="dark"] .callout.alert{background:#4f2723; border-color:#82433c; border-left-color:#ff8578; color:#f8c7c0}
  body[data-theme="dark"] .callout.success{background:#1f4631; border-color:#3d6e4d; border-left-color:#6fd28b; color:#bbeac6}
  body[data-theme="dark"] .callout.note{background:#4f4f4f; border-color:#646464; border-left-color:#a4abb5; color:#d8dce2}
  body[data-theme="dark"] .callout code{background:#2c2c2c}
  /* dark board: 暗い盤面で見やすいよう、カードと角丸ボタンを明るい面に */
  body[data-theme="dark"] .bcard,
  body[data-theme="dark"] .fcard{background:#f2f3f6; color:#23262e; border-color:#cfd2d9}
  body[data-theme="dark"] .bcard-ttl{color:#23262e}
  body[data-theme="dark"] .bcard-meta{color:#5d6470}
  body[data-theme="dark"] .bcard-tags .tag{background:#dde0e6; color:#3a3f4a; border-color:#cbcfd6}
  body[data-theme="dark"] .fcard .fdel{background:#e9eaee; color:#5d6470; border-color:#cccfd6}
  body[data-theme="dark"] .fcard .fhandle{border-color:#e9eaee}
  body[data-theme="dark"] #boardbar .bm{background:#e9eaee; color:#3a3f4a; border-color:#cccfd6}
  body[data-theme="dark"] #boardbar .bm:hover{border-color:#6a5fd8; color:#4a3fb0}
  body[data-theme="dark"] #boardbar .bm.on{background:var(--send); color:#fff; border-color:var(--send)}
  body[data-theme="dark"] .bcard:hover,
  body[data-theme="dark"] .fcard:hover{border-color:#6a5fd8}
  /* dark board: 列・帯も明るく（カードがより白で浮く段差） */
  body[data-theme="dark"] .bcol{background:#d9dce2; border-color:#c4c8d0}
  body[data-theme="dark"] .bcol-head{color:#23262e; border-bottom-color:#c4c8d0}
  body[data-theme="dark"] .bcol-head .cnt{color:#5d6470}
  body[data-theme="dark"] .bcol-del{background:#eef0f3; color:#5d6470; border-color:#c4c8d0}
  body[data-theme="dark"] .bcol-empty{color:#7d838f}
  body[data-theme="dark"] .tband{background:#d9dce2; border-color:#c4c8d0}
  body[data-theme="dark"] .tband-head{border-bottom-color:#c4c8d0}
  body[data-theme="dark"] .tband-label{color:#23262e}
  body[data-theme="dark"] .tband-label:hover{border-color:#c4c8d0}
  body[data-theme="dark"] .tband-label:focus{background:#fff; border-color:#6a5fd8}
  body[data-theme="dark"] .tband-uns{color:#5d6470}
  body[data-theme="dark"] .tband-grip,
  body[data-theme="dark"] .tband-cnt,
  body[data-theme="dark"] .tband-col{color:#5d6470}
  body[data-theme="dark"] .tband-del{background:#eef0f3; color:#5d6470; border-color:#c4c8d0}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--body);
       font-size:var(--fs); color:var(--tx); background:var(--bg);
       display:flex; flex-direction:column; height:100vh; overflow:hidden}
  button{font:inherit; cursor:pointer}
  input,select,textarea{font:inherit; color:var(--tx)}

  /* header */
  .hd{display:flex; align-items:center; gap:12px; background:var(--hd); color:var(--hd-tx);
      padding:11px 18px; border-bottom:1px solid var(--bd); flex:0 0 auto}
  .hd .mark{width:30px; height:30px; flex:none; border-radius:9px; display:grid; place-items:center;
      background:var(--send); color:#fff; font-family:var(--display); font-weight:900; font-size:16px; box-shadow:0 2px 0 var(--send-sh)}
  .hd .ttl{font-family:var(--display); font-weight:700; font-size:17px; line-height:1.15; letter-spacing:.01em}
  .hd .ttl small{display:block; font-family:var(--body); font-weight:400; font-size:11px; color:var(--tx3); margin-top:1px; letter-spacing:.02em}
  .hd .sp{flex:1}
  .hd button{font-family:var(--display); font-weight:500; font-size:13px; background:var(--bg); border:1px solid var(--bd2); color:var(--tx2);
      border-radius:9px; padding:7px 13px}
  .hd button:hover{border-color:var(--link-h); color:var(--link)}

  /* tabs */
  .tabs{display:flex; align-items:stretch; gap:2px; background:var(--panel);
        padding:0 12px; border-bottom:1px solid var(--bd); flex:0 0 auto; overflow-x:auto}
  .tab{display:flex; align-items:center; font-family:var(--display); font-weight:700; font-size:14px; color:var(--tx3);
       padding:11px 15px 12px; border:none; background:none; border-bottom:3px solid transparent; margin-bottom:-1px;
       white-space:nowrap; user-select:none; cursor:pointer}
  .tab:hover{color:var(--tx2)}
  .tab.on{color:var(--link); border-bottom-color:var(--link)}
  .tab .x{margin-left:8px; color:var(--tx3); font-weight:400}
  .tab .x:hover{color:var(--danger)}
  .tab-add{padding:8px 12px; color:var(--tx3); background:none; border:none; align-self:center; font-size:15px; font-weight:500}
  .tab-add:hover{color:var(--link)}

  /* identity + compose */
  .ident{display:flex; align-items:center; gap:10px; padding:9px 18px; border-bottom:1px solid var(--bd);
         flex:0 0 auto; flex-wrap:wrap; background:var(--bg)}
  .ident label{color:var(--tx3); font-size:11px; font-weight:700; font-family:var(--display); letter-spacing:.03em}
  .ident input[type=text]{height:32px; padding:0 10px; border:1px solid var(--bd2); border-radius:9px; background:var(--bg); color:var(--tx)}
  .ident input[type=text]:focus{outline:none; border-color:var(--link); box-shadow:0 0 0 3px var(--line-h)}
  #f_name{width:124px; font-weight:700}
  .swatch{width:32px; height:32px; padding:0; border:1px solid var(--bd2); border-radius:9px; background:none}
  #f_bot{height:32px; padding:0 10px; border:1px solid var(--bd2); border-radius:9px; width:156px; font-family:var(--mono); font-size:13px}

  .composewrap{flex:0 0 auto; border-bottom:1px solid var(--bd); background:var(--bg)}
  .compose{display:flex; gap:10px; padding:12px 16px 8px; align-items:stretch}
  #compose{flex:1; min-height:42px; max-height:160px; padding:10px 12px; border:1.5px solid var(--bd2);
           border-radius:11px; resize:vertical; line-height:1.45; background:var(--bg); color:var(--tx)}
  #compose:focus{outline:none; border-color:var(--link); box-shadow:0 0 0 3px var(--line-h)}
  .btn-send{background:var(--send); color:#fff; border:none; border-radius:11px; padding:0 22px;
       font-family:var(--display); font-weight:700; font-size:15px; min-width:78px; box-shadow:0 2px 0 var(--send-sh)}
  .btn-send:hover{background:var(--send-h)}
  .btn-send:active{transform:translateY(1px); box-shadow:0 1px 0 var(--send-sh)}
  .tpls{display:flex; flex-wrap:wrap; gap:6px; padding:0 16px 12px}
  .tpls button{font-family:var(--mono); font-size:11.5px; font-weight:700; padding:3px 9px; border:1px solid var(--bd2); border-radius:7px;
       background:var(--panel2); color:var(--tx2); cursor:pointer; white-space:nowrap}
  .tpls button:hover{border-color:var(--link-h); color:var(--link); background:var(--line-h)}

  /* main */
  .main{flex:1 1 auto; display:flex; min-height:0}
  .mdcol{flex:0 0 196px; display:flex; flex-direction:column; min-height:0;
         border-left:1px solid var(--bd); background:var(--panel); padding:12px 12px 14px}
  .mdhead{display:flex; align-items:center; justify-content:space-between; gap:4px; padding-bottom:9px; margin-bottom:6px; border-bottom:1px solid var(--sep)}
  .mdtitle{font-family:var(--display); font-size:11px; color:var(--tx3); font-weight:700; letter-spacing:.05em}
  .mdhead button{flex:0 0 auto; width:26px; height:24px; border:1px solid var(--bd2); background:var(--bg);
       color:var(--tx2); border-radius:7px; cursor:pointer; font-size:13px; line-height:1}
  .mdhead button:hover{border-color:var(--link-h); color:var(--link)}
  .mdlist{flex:1 1 auto; overflow-y:auto; padding-top:2px}
  .mdlist h4{margin:14px 2px 7px; font-size:11px; color:var(--tx3); letter-spacing:.04em; font-weight:700; font-family:var(--display)}
  .mdlist h4:first-child{margin-top:2px}
  .mdlist button{display:block; width:100%; text-align:left; font-size:13px; font-weight:700; padding:8px 11px; margin:0 0 7px;
       border:1px solid var(--bd2); border-radius:9px; background:var(--bg); color:var(--tx); cursor:pointer;
       white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .mdlist button:hover{border-color:var(--link-h); color:var(--link); background:var(--line-h)}
  .mdcol.collapsed{flex-basis:34px; padding:12px 4px}
  .mdcol.collapsed .mdlist,.mdcol.collapsed .mdtitle{display:none}
  .mdcol.collapsed .mdhead{justify-content:center; border-bottom:none; padding:0; margin:0}

  /* board (kanban / flow) */
  #board{display:none; flex:1 1 auto; min-width:0; min-height:0; flex-direction:column}
  body.boardmode .railcol,body.boardmode .centercol,body.boardmode .mdcol{display:none}
  body.boardmode #board{display:flex}
  #boardbar{display:flex; gap:6px; padding:8px 12px; border-bottom:1px solid var(--bd); flex:0 0 auto}
  #boardbar .bm{font-family:var(--display); font-weight:700; font-size:13px; padding:6px 14px; border:1px solid var(--bd2);
       border-radius:9px; background:var(--bg); color:var(--tx2); cursor:pointer}
  #boardbar .bm:hover{border-color:var(--link-h); color:var(--link)}
  #boardbar .bm.on{background:var(--send); border-color:var(--send); color:#fff; box-shadow:0 2px 0 var(--send-sh)}
  #boardbar .bm-hint{margin-left:auto; align-self:center; font-size:11px; color:var(--tx3)}
  #boardbar .bm-search{margin-left:auto; width:150px; height:30px; padding:0 11px; border:1px solid var(--bd2); border-radius:9px; background:var(--bg); color:var(--tx); font-size:12.5px}
  #boardbar .bm-search:focus{outline:none; border-color:var(--link); box-shadow:0 0 0 3px var(--line-h)}
  #boardbar .bm-io{margin-left:0; font-family:var(--display); font-weight:700}
  #boardcontent{flex:1 1 auto; min-height:0; min-width:0; overflow:auto}
  #boardcontent.kanban{display:flex; gap:12px; padding:12px; align-items:flex-start}
  #boardcontent.flow{position:relative}
  #boardcontent.timeline{display:flex; flex-direction:column; gap:10px; padding:12px; align-items:stretch}
  .tband{border:1px solid var(--bd); border-left:3px solid var(--bc, var(--bd)); border-radius:12px; background:var(--panel); box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .tband.dragover{outline:2px dashed var(--link); outline-offset:-3px}
  .tband.coldragover{outline:2px solid var(--link); outline-offset:-3px}
  .tband.coldrag{opacity:.5}
  .tband-head{display:flex; align-items:center; gap:6px; padding:6px 10px; border-bottom:1px solid var(--bd); background:color-mix(in srgb, var(--bc, transparent) 13%, transparent); border-radius:0 9px 0 0}
  .tband-grip{cursor:grab; color:var(--tx3); font-size:15px; user-select:none; flex:0 0 auto}
  .tband-col{flex:0 0 auto; width:20px; height:20px; border:none; background:transparent; color:var(--tx2); cursor:pointer; font-size:11px; line-height:1; padding:0}
  .tband-cnt{flex:0 0 auto; font-size:11px; color:var(--tx3); padding:0 2px}
  .tband.tcollapsed .tband-head{border-bottom:none}
  .tband-grip:active{cursor:grabbing}
  .tband-label{flex:1 1 auto; min-width:0; border:1px solid transparent; background:transparent; color:var(--tx); font-weight:600; font-size:14px; padding:4px 7px; border-radius:6px}
  .tband-label:hover{border-color:var(--bd2)}
  .tband-label:focus{outline:none; border-color:var(--link); background:var(--bg)}
  .tband-uns{flex:1 1 auto; color:var(--tx3); font-weight:600; padding:4px 7px}
  .tband-del{flex:0 0 auto; width:20px; height:20px; border:1px solid var(--bd2); background:var(--bg); color:var(--tx3); border-radius:50%; cursor:pointer; line-height:1; font-size:12px}
  .tband-del:hover{color:var(--danger); border-color:var(--danger)}
  .tband-list{padding:8px; display:flex; flex-direction:column; gap:8px; min-height:42px}
  .tband-list .bcard{margin:0}
  .tband-list .bcol-empty{padding:8px}
  #fcanvas{position:relative; width:2400px; height:1500px;
        background-color:var(--bg);
        background-image:
          linear-gradient(var(--grid2) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid2) 1px, transparent 1px),
          linear-gradient(var(--grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid) 1px, transparent 1px);
        background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px}
  .fsvg{position:absolute; left:0; top:0; width:2400px; height:1500px; overflow:visible}
  .fsvg .flink{stroke:var(--tx3); stroke-width:2; fill:none; pointer-events:none}
  .fsvg marker path{fill:var(--tx3)}
  .fsvg .flinkhit{stroke:transparent; stroke-width:14; pointer-events:stroke; cursor:pointer}
  .fsvg .ftemp{stroke:var(--link); stroke-width:2; stroke-dasharray:5 4; fill:none; pointer-events:none}
  .flabel{position:absolute; transform:translate(-50%,-50%); z-index:3; pointer-events:auto; cursor:pointer;
        background:var(--bg); border:1px solid var(--bd2); border-radius:9px; padding:2px 10px; font-size:13px; font-weight:600;
        color:var(--tx2); white-space:nowrap; max-width:200px; overflow:hidden; text-overflow:ellipsis; box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .flabel:hover{border-color:var(--link); color:var(--link)}
  .fcard{position:absolute; width:182px; background:var(--bg); border:1px solid var(--bd2); border-left-width:4px;
         border-radius:9px; padding:8px 11px; cursor:grab; z-index:2; user-select:none; touch-action:none;
         box-shadow:0 1px 4px rgba(0,0,0,.10); transition:border-color .1s, box-shadow .1s}
  .fcard:hover{border-color:var(--link); box-shadow:0 4px 12px rgba(0,0,0,.14)}
  .fcard .fhandle{position:absolute; left:50%; transform:translateX(-50%); width:15px; height:15px;
         border-radius:50%; background:var(--link); border:2px solid var(--bg); cursor:crosshair; opacity:.55}
  .fcard:hover .fhandle{opacity:1}
  .fcard .fhandle-t{top:-9px}
  .fcard .fhandle-b{bottom:-9px}
  .fcard .fdel{position:absolute; top:-8px; right:-8px; width:19px; height:19px; border-radius:50%;
         border:1px solid var(--bd2); background:var(--bg); color:var(--tx3); cursor:pointer; line-height:1;
         font-size:12px; padding:0; opacity:0; box-shadow:0 1px 3px rgba(0,0,0,.15)}
  .fcard:hover .fdel{opacity:1}
  .fcard .fdel:hover{color:var(--danger); border-color:var(--danger)}
  .bcard.dim,.fcard.dim{opacity:.16}
  #tagbar{display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:6px 12px; border-bottom:1px solid var(--bd); flex:0 0 auto}
  #tagbar .tagbar-lbl{font-family:var(--display); font-size:11px; font-weight:700; color:var(--tx3); margin-right:2px; letter-spacing:.03em}
  .tfchip{font-size:12px; padding:2px 11px; border-radius:12px; border:1px solid var(--bd2); background:var(--bg); color:var(--tx2); cursor:pointer}
  .tfchip:hover{border-color:var(--link)}
  .tfchip.on{background:var(--link); border-color:var(--link); color:#fff}
  .tfchip.tfclear{color:var(--danger)}
  .fzone{position:absolute; z-index:1; pointer-events:none; border:1.5px dashed var(--zc, var(--bd2)); border-radius:10px;
        background:color-mix(in srgb, var(--zc, var(--link)) 7%, transparent)}
  .fzone-head{position:absolute; top:0; left:0; right:0; height:24px; display:flex; align-items:center; gap:4px;
        padding:0 6px 0 10px; cursor:grab; pointer-events:auto; background:color-mix(in srgb, var(--zc, var(--link)) 14%, transparent); border-radius:9px 9px 0 0}
  .fzone-head:active{cursor:grabbing}
  .fzone-name{flex:1 1 auto; font-size:12px; font-weight:600; color:var(--tx2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .fzone.locked{border-style:solid}
  .fzone.locked .fzone-head{cursor:default}
  .fzone.locked .fzone-name::before{content:"🔒 "; font-size:10px}
  .fzone.locked .fzone-rz{display:none}
  .fzone-del{flex:0 0 auto; width:17px; height:17px; border-radius:50%; border:none; background:transparent; color:var(--tx3); cursor:pointer; font-size:12px; line-height:1; padding:0}
  .fzone-del:hover{color:var(--danger)}
  .fzone-rz{position:absolute; right:0; bottom:0; width:16px; height:16px; cursor:nwse-resize; pointer-events:auto;
        background:linear-gradient(135deg, transparent 50%, var(--zc, var(--bd2)) 50%); border-radius:0 0 9px 0}
  .bcol{flex:0 0 224px; display:flex; flex-direction:column; max-height:100%;
        background:var(--panel); border:1px solid var(--bd); border-radius:12px; box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .bcol-head{padding:9px 12px; font-weight:700; color:var(--tx); border-bottom:1px solid var(--bd);
        display:flex; align-items:center; gap:6px; cursor:grab}
  .bcol-head:active{cursor:grabbing}
  .bcol-name{flex:1 1 auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .bcol-head .cnt{font-size:11px; color:var(--tx3); font-weight:400; font-family:var(--mono)}
  .bcol-del{flex:0 0 auto; width:20px; height:20px; border:1px solid var(--bd2); background:var(--bg);
        color:var(--tx3); border-radius:50%; cursor:pointer; line-height:1; font-size:12px}
  .bcol-del:hover{color:var(--danger); border-color:var(--danger)}
  .bcol-list{flex:1 1 auto; overflow-y:auto; padding:8px; min-height:48px}
  .bcol.dragover{outline:2px dashed var(--link); outline-offset:-3px}
  .bcol.coldragover{outline:2px solid var(--link); outline-offset:-3px}
  .bcol.coldrag{opacity:.5}
  .bcol-add{flex:0 0 150px; align-self:flex-start; padding:11px; border:1px dashed var(--bd2); border-radius:12px;
        color:var(--link); background:transparent; cursor:pointer; text-align:center; font-family:var(--display); font-weight:700; font-size:13px}
  .bcol-add:hover{border-color:var(--link); background:var(--line-h)}

<script>
"use strict";
const DEFAULT_EP = "https://us-central1-trpgnog.cloudfunctions.net/tekeyProxy2";

/* ---------- config (localStorage) ---------- */
const cfg = k => localStorage.getItem(k) || "";
const setCfg = (k,v) => localStorage.setItem(k, v);

/* ---------- state ---------- */
let state = { palettes:[], activeId:null, editMode:false, board:false, lastDeleted:null };
let lineMap = {};            // lineIndex -> raw text (current tab)
let curParams = {};          // {name: value}
let secMap = {};             // uid -> {lineIndex, level}
let expand = {};             // {paletteID: {uid:bool}} UI expand memory

const $ = s => document.querySelector(s);
const el = (c,h) => { const d=document.createElement("div"); if(c)d.className=c; if(h!=null)d.innerHTML=h; return d; };
const esc = s => (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function activeP(){ return state.palettes.find(p=>p.paletteID===state.activeId) || null; }

/* ---------- persistence ---------- */
function persist(){
  try{ localStorage.setItem("ep2_palettes", JSON.stringify({palettes:state.palettes, activeId:state.activeId})); }catch(e){}
}
function restore(){
  try{
    const raw = localStorage.getItem("ep2_palettes");
    if(raw){ const o=JSON.parse(raw); if(o.palettes&&o.palettes.length){ state.palettes=o.palettes; state.activeId=o.activeId||o.palettes[0].paletteID; return true; } }
  }catch(e){}
  return false;
}

/* ---------- text helpers ---------- */
const sendSafe = s => s.replace(/《/g,"[").replace(/》/g,"]").replace(/／/g,"/");
function allParams(){
  const map={};
  state.palettes.forEach(p=>{
    (p.stock||"").split("\n").forEach(ln=>{
      const m=ln.match(/^\/\/\s*([^=]+?)\s*=\s*(.*)$/);
      if(m) map[m[1].trim()]=m[2];
    });
  });
  return map;
}
function expandParams(t){ const map={...allParams(), ...curParams}; return t.replace(/\{([^{}]+)\}/g,(m,k)=> (k in map)? map[k] : m); }
function resolveSend(raw){
  let t = expandParams(raw);
  t = t.replace(/\\n/g,"\n");   // literal backslash-n -> 改行
  return t;
}

/* ---------- parser: stock -> tree ---------- */
let _uid = 0;
function parseStock(stock){
  _uid = 0; curParams = {}; lineMap = {}; secMap = {};
  const lines = (stock||"").split("\n");
  const root = [];
  const stack = [{level:0, children:root}];
  const top = () => stack[stack.length-1];
  let callout = null;

  lines.forEach((ln, idx)=>{
    if(callout){
      if(ln.trim()===":::"){ top().children.push(callout); callout=null; }
      else callout.lines.push(ln);
      return;
    }
    // callout open: ':::xxx' or bare ':::'
    if(/^:::(.+)$/.test(ln) || ln.trim()===":::"){
      const v = ln.replace(/^:::/,"").trim();
      callout = {type:"callout", variant:v, lines:[], uid:++_uid};
      return;
    }
    // headings
    let m;
    if((m=ln.match(/^####(.*)$/))){
      const title=m[1];
      if(title.trim()===""){ if(top().level===2) stack.pop(); }
      else{
        while(top().level>=2) stack.pop();
        const uid=++_uid; secMap[uid]={lineIndex:idx,level:2};
        const sec={type:"section",level:2,title,uid,children:[]};
        top().children.push(sec); stack.push(sec);
      }
      return;
    }
    if((m=ln.match(/^###(.*)$/))){
      const title=m[1];
      if(title.trim()===""){ while(top().level>=2) stack.pop(); if(top().level===1) stack.pop(); }
      else{
        while(top().level>=1) stack.pop();
        const uid=++_uid; secMap[uid]={lineIndex:idx,level:1};
        const sec={type:"section",level:1,title,uid,children:[]};
        top().children.push(sec); stack.push(sec);
      }
      return;
    }
    // param def
    if((m=ln.match(/^\/\/\s*([^=]+?)\s*=\s*(.*)$/))){
      const name=m[1].trim(), val=m[2];
      curParams[name]=val;
      top().children.push({type:"param", name, val});
      return;
    }
    if(ln.trim()===""){ top().children.push({type:"blank"}); return; }
    // sendable line
    lineMap[idx]=ln;
    top().children.push({type:"line", raw:ln, idx});
  });
  return root;
}

/* ---------- inline render ---------- */
function fmtLineText(txt){
  let s=esc(txt);
  s=s.replace(/\|([^|《\n]+)《([^》\n]+)》/g,"<ruby>$1<rt>$2</rt></ruby>");
  s=s.replace(/\\n/g,"<br>");
  s=s.replace(/(@#[0-9a-fA-F]{3,6}\b|@\[[^\]]*\][^\s@]*|@全停止)/g,'<span class="atcmd">$1</span>');
  s=s.replace(/\{([^{}]+)\}/g,'<span class="var">{$1}</span>');
  return s;
}
function looksLikeCmd(tok){
  if(/^@/.test(tok)) return false;                 // @色/@名前 は atcmd 扱い
  return /[dDkK](?:[0-9]|\{)/.test(tok)             // 2d6 / k20 / k{威力} / d6
      || /[<>]=?/.test(tok)                         // 判定の比較
      || /^(choice|resb|cbrb)\(/i.test(tok);        // 関数系
}
function renderLine(raw){
  let color=null;
  const cm = raw.match(/@#([0-9a-fA-F]{3,6})\b/); if(cm) color="#"+cm[1];
  let html;
  const m = raw.match(/^(\s*)(\S+)([\s\S]*)$/);
  if(m && looksLikeCmd(m[2])){
    const body=m[3].replace(/^\s+/,"");
    html='<span class="cmd">'+fmtLineText(m[2])+'</span>'+(body?'<span class="ltxt">'+fmtLineText(body)+'</span>':'');
  } else {
    html=fmtLineText(raw);
  }
  const conv = /[《》／]/.test(raw) ? '<span class="conv" title="送信時に [ ] / へ自動変換されます">⇄</span>' : "";
  return {html:html+conv, color};
}
function mdInline(s){
  s=esc(s);
  s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  s=s.replace(/\*([^*]+)\*/g,"<em>$1</em>");
  s=s.replace(/~~([^~]+)~~/g,"<del>$1</del>");
  s=s.replace(/`([^`]+)`/g,"<code>$1</code>");
  return s;
}
function calloutClass(v){
  const t=(v||"").toLowerCase();
  if(/\b(info|tip)\b/.test(t)) return "info";
  if(/\b(warn|warning|caution)\b/.test(t)) return "warn";
  if(/\b(alert|danger|error|stop)\b/.test(t)) return "alert";
  if(/\b(success|done|ok)\b/.test(t)) return "success";
  return "note";
}
function calloutMeta(variant){
  const v=variant||"";
  const hm=v.match(/#([0-9a-fA-F]{3,6})\b/);
  const color=hm?("#"+hm[1]):null;
  const label=v.replace(/#[0-9a-fA-F]{3,6}\b/,"").trim();
  return {cls: color?"note":calloutClass(label), label, color};
}
function renderCallout(node){
  const {cls,label,color}=calloutMeta(node.variant);
  const wrap=el("callout "+cls); wrap.id="co-"+node.uid; wrap.dataset.uid=node.uid;
  if(color) wrap.style.borderLeftColor=color;
  const head=el("co-head","<span class='co-caret'>▾</span><span class='co-ttl'>"+esc(label||"メモ")+"</span>");
  if(color) head.querySelector(".co-ttl").style.color=color;
  wrap.appendChild(head);
  const body=el("co-body");
  let ul=null;
  node.lines.forEach(ln=>{
    if(/^\s*[-*]\s+/.test(ln)){
      if(!ul){ ul=document.createElement("ul"); body.appendChild(ul); }
      const li=document.createElement("li"); li.innerHTML=mdInline(ln.replace(/^\s*[-*]\s+/,"")); ul.appendChild(li); return;
    }
    ul=null;
    if(ln.trim()===""){ body.appendChild(el(null,"")); return; }
    if(/^#{1,4}\s+/.test(ln)){ body.appendChild(el(null,"<strong>"+mdInline(ln.replace(/^#{1,4}\s+/,""))+"</strong>")); return; }
    body.appendChild(el(null, mdInline(ln)));
  });
  wrap.appendChild(body);
  return wrap;
}

/* ---------- tree render ---------- */
function renderNodes(nodes, parent){
  const p = activeP();
  nodes.forEach(n=>{
    if(n.type==="section"){
      const sec=el("sec sec-l"+n.level); sec.id="sec-"+n.uid; sec.dataset.uid=n.uid;
      const collapsed = expand[p.paletteID] && expand[p.paletteID][n.uid]===false;
      if(collapsed) sec.classList.add("collapsed");
      const head=el("sec-head"); head.dataset.uid=n.uid;
      head.innerHTML='<span class="caret">▾</span><span class="sec-title">'+esc(n.title.trim()||"(無題)")+'</span>';
      const bdy=el("sec-body");
      renderNodes(n.children, bdy);
      sec.appendChild(head); sec.appendChild(bdy); parent.appendChild(sec);
    } else if(n.type==="line"){
      const {html,color}=renderLine(n.raw);
      const d=el("line", html); d.dataset.idx=n.idx; if(color) d.style.color=color;
      parent.appendChild(d);

      parent.appendChild(el("paramdef", esc("// "+n.name+" = "+n.val)));
    } else if(n.type==="callout"){
      parent.appendChild(renderCallout(n));
    } else if(n.type==="blank"){
      parent.appendChild(el("blank"));
    }
  });
}

/* ---------- send ---------- */
function pickName(palName){
  const a=(palName||"").replace(/[\s\u3000]/g,"");
  const b=(cfg("senderName")||"").replace(/[\s\u3000]/g,"");
  const raw = a.length? (palName||"").trim() : b.length? (cfg("senderName")||"").trim() : null;
  return raw || "\u3164";   // U+3164 fallback
}
async function sendChat(message,{name,color,bot}={}){
  const ep=cfg("ep2_endpoint")||DEFAULT_EP;
  const room=cfg("room"), password=cfg("pass"), tab=cfg("tab");
  if(!room) return {ok:false, why:"noroom"};
  const body={command:"sendChat", room, password, message};
  if(name) body.name=name;
  if(tab) body.tab=tab;
  if(color) body.color=color;
  if(bot) body.bot=bot;
  try{
    const res=await fetch(ep,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    return {ok:res.ok, status:res.status};
  }catch(e){ return {ok:false, why:"net"}; }
}
async function doSend(message){
  message=(message||"").trim(); if(!message) return;
  if(!cfg("room")){ toast("ルームID未設定。接続設定を開いてね",true); openSettings(); return; }
  const p=activeP();
  // inlineの @#色 はAPI経由だと解釈されないため、colorパラメータへ回し本文からは除去する
  let color=((p&&p.textColor)||"").replace("#","")||undefined;
  const cm=message.match(/@#([0-9a-fA-F]{3,6})\b/g);
  if(cm&&cm.length){
    color=cm[cm.length-1].slice(2);                       // 末尾(最後)の色を採用
    message=message.replace(/\s*@#[0-9a-fA-F]{3,6}\b/g,"").trim();
  }
  // 同様に @[name]:名前 はnameパラメータへ回す（inlineはAPI未解釈）
  let nameOverride=null;
  const nm=message.match(/@\[name\]:([^@]+)/);
  if(nm){
    nameOverride=nm[1].trim();
    message=message.replace(/\s*@\[name\]:[^@]+/g,"").trim();
  }
  if(!message){ toast("本文が空です（色・コマンドのみ）",true); return; }
  const name=(nameOverride&&nameOverride.length)?nameOverride:pickName(p?p.name:"");
  const bot=$("#f_bot").value.trim()||undefined;
  const r=await sendChat(sendSafe(message),{name,color,bot});
  if(r.ok) toast("送信しました");
  else if(r.why==="noroom") toast("ルームID未設定",true);
  else if(r.why==="net") toast("接続失敗（エンドポイント/CORSを確認）",true);
  else toast("送信失敗（"+(r.status||"?")+"）名前や記号(《》／)を確認",true);
}
function stageLine(idx){
  const raw=lineMap[idx]; if(raw==null) return;
  $("#compose").value=resolveSend(raw);
  $("#compose").focus();
}
function sendLine(idx){
  const raw=lineMap[idx]; if(raw==null) return;
  doSend(resolveSend(raw));
}

/* ---------- board (kanban) ---------- */
const byId = id => state.palettes.find(p=>p.paletteID===id);
function parseBlocks(stock){
  const lines=(stock||"").split("\n"); const blocks=[]; let cur=null, loose=null;
  const flush=()=>{ if(loose){ blocks.push(loose); loose=null; } };
  for(let i=0;i<lines.length;i++){
    const ln=lines[i];
    if(cur===null){
      const m=ln.match(/^###(.*)$/);
      if(m && m[1].trim()!==""){ flush(); cur={type:"section", title:m[1].trim(), lines:[ln]}; }
      else { if(!loose) loose={type:"loose", lines:[]}; loose.lines.push(ln); }
    } else {
      cur.lines.push(ln);
      if(/^###\s*$/.test(ln)){ blocks.push(cur); cur=null; }
    }
  }
  flush(); if(cur) blocks.push(cur);
  return blocks;
}
function countSendable(lines){
  let n=0, inC=false;
  for(const ln of lines){
    if(inC){ if(ln.trim()===":::") inC=false; continue; }
    if(/^:::(.+)$/.test(ln)||ln.trim()===":::"){ inC=true; continue; }
    if(/^###/.test(ln)||/^####/.test(ln)||/^\/\//.test(ln)||ln.trim()==="") continue;
    n++;
  }
  return n;
}
function repColor(lines){ for(const ln of lines){ const m=ln.match(/@#([0-9a-fA-F]{3,6})\b/); if(m) return "#"+m[1]; } return null; }
const labelOf = id => { const p=byId(id); return p?p.label:"?"; };
const cardKey = (tabId, title) => tabId+"\u0000"+title;
// 実在カード一覧（key -> {homeTab, title, ord, lines}）。stockは一切変更しない
function currentCards(){
  const map={};
  state.palettes.forEach(p=>{
    parseBlocks(p.stock).filter(b=>b.type==="section").forEach((s,ord)=>{
      map[cardKey(p.paletteID,s.title)]={homeTab:p.paletteID, title:s.title, ord, lines:s.lines};
    });
  });
  return map;
}
/* board = {cols:[{id,name,tabId|null,cards:[key]}]} 。tabId付き=タブ由来列(削除不可)、null=独自列 */
function loadBoard(){ try{ const o=JSON.parse(localStorage.getItem("ep2_board")||"null"); return (o&&Array.isArray(o.cols))?o:null; }catch(e){ return null; } }
function saveBoard(b){ try{ localStorage.setItem("ep2_board", JSON.stringify(b)); }catch(e){} }
function seedBoard(){
  return {cols: state.palettes.map(p=>({ id:"tab_"+p.paletteID, name:p.label, tabId:p.paletteID,
    cards: parseBlocks(p.stock).filter(b=>b.type==="section").map(s=>cardKey(p.paletteID,s.title)) }))};
}
function syncBoard(){
  const cards=currentCards();
  let b=loadBoard(); if(!b) b=seedBoard();
  const liveTabs=new Set(state.palettes.map(p=>p.paletteID));
  state.palettes.forEach(p=>{ if(!b.cols.some(c=>c.tabId===p.paletteID)) b.cols.push({id:"tab_"+p.paletteID, name:p.label, tabId:p.paletteID, cards:[]}); });
  b.cols=b.cols.filter(c=> c.tabId==null || liveTabs.has(c.tabId));
  b.cols.forEach(c=> c.cards=c.cards.filter(k=>cards[k]));
  const placed=new Set(); b.cols.forEach(c=>c.cards.forEach(k=>placed.add(k)));
  Object.keys(cards).forEach(k=>{ if(!placed.has(k)){ const h=cards[k].homeTab; let col=b.cols.find(c=>c.tabId===h); if(!col){ col={id:"tab_"+h,name:labelOf(h),tabId:h,cards:[]}; b.cols.push(col); } col.cards.push(k); } });
  b.cols.forEach(c=>{ if(c.tabId!=null){ const p=byId(c.tabId); if(p) c.name=p.label; } });
  saveBoard(b);
  return {b, cards};
}
function moveBoardCard(key, dstColId, dstIdx){
  const b=loadBoard(); if(!b) return;
  b.cols.forEach(c=> c.cards=c.cards.filter(k=>k!==key));
  const c=b.cols.find(x=>x.id===dstColId); if(!c) return;
  c.cards.splice(dstIdx,0,key); saveBoard(b); renderBoard();
}
function addColumn(){
  const b=loadBoard()||seedBoard();
  b.cols.push({id:"col_"+Date.now()+"_"+Math.floor(Math.random()*1e4), name:"新しい列", tabId:null, cards:[]});
  saveBoard(b); renderBoard();

function syncTimeline(){

  t.bands.forEach(b=> b.cards=b.cards.filter(k=>cards[k]));
  const placed=new Set(); t.bands.forEach(b=>b.cards.forEach(k=>placed.add(k)));
  const uns=t.bands.find(b=>b.id==="unsorted");
  Object.keys(cards).forEach(k=>{ if(!placed.has(k)) uns.cards.push(k); });

function cardBox(elm){ if(!elm) return null; const hw=elm.offsetWidth/2, hh=elm.offsetHeight/2; return {cx:elm.offsetLeft+hw, cy:elm.offsetTop+hh, hw, hh}; }
function edgePoint(from, box){
  const dx=from.x-box.cx, dy=from.y-box.cy;
  if(!dx&&!dy) return {x:box.cx,y:box.cy};
  const sx=dx?box.hw/Math.abs(dx):Infinity, sy=dy?box.hh/Math.abs(dy):Infinity;
  const s=Math.min(sx,sy); return {x:box.cx+dx*s, y:box.cy+dy*s};
}
function mkLine(cls,p1,p2,marker){ const l=document.createElementNS(SVGNS,"line"); l.setAttribute("class",cls);
  l.setAttribute("x1",p1.x); l.setAttribute("y1",p1.y); l.setAttribute("x2",p2.x); l.setAttribute("y2",p2.y);
  if(marker) l.setAttribute("marker-end","url(#fa)"); return l; }
function redrawLinks(){
  const svg=$("#fsvg"); if(!svg) return; const canvas=$("#fcanvas");
  [...svg.querySelectorAll(".flink,.flinkhit")].forEach(n=>n.remove());
  if(canvas) [...canvas.querySelectorAll(".flabel")].forEach(n=>n.remove());
  const f=loadFlow(); const hid=new Set(f.hidden);
  f.links.forEach((lk,i)=>{
    if(hid.has(lk.from)||hid.has(lk.to)) return;
    const a=flowCardEl(lk.from), b=flowCardEl(lk.to);
    const ba=cardBox(a), bb=cardBox(b); if(!ba||!bb) return;
    const p1=edgePoint({x:bb.cx,y:bb.cy}, ba), p2=edgePoint({x:ba.cx,y:ba.cy}, bb);
    const hit=mkLine("flinkhit",p1,p2,false); hit.dataset.idx=i;
    svg.appendChild(hit); svg.appendChild(mkLine("flink",p1,p2,true));
    if(lk.label && canvas){
      const chip=el("flabel"); chip.dataset.idx=i; chip.textContent=lk.label;
      chip.style.left=((p1.x+p2.x)/2)+"px"; chip.style.top=((p1.y+p2.y)/2)+"px";
      canvas.appendChild(chip);
    }
  });
}

function boardDropOrd(list, y){
  const cards=[...list.querySelectorAll(".bcard:not(.dragging)")];
  for(let i=0;i<cards.length;i++){ const r=cards[i].getBoundingClientRect(); if(y < r.top + r.height/2) return i; }
  return cards.length;
}

/* ---------- section editing ---------- */
function setStock(p, lines){ p.stock=lines.join("\n"); render(); }
function getSecTitle(uid){
  const p=activeP(); const info=secMap[uid]; if(!p||!info) return "";
  return (p.stock.split("\n")[info.lineIndex]||"").replace(/^#{3,4}/,"").trim();
}
function setSecTitle(uid, val){
  const p=activeP(); const info=secMap[uid]; if(!p||!info) return;
  const lines=p.stock.split("\n");
  lines[info.lineIndex]=(info.level===2?"####":"###")+val.trim();
  setStock(p, lines);
}
function inlineEdit(spanEl, initial, commit){
  const inp=document.createElement("input"); inp.type="text"; inp.className="inline-edit"; inp.value=initial;
  spanEl.replaceWith(inp); inp.focus(); inp.select();
  let done=false;
  const fin=save=>{ if(done) return; done=true; if(save) commit(inp.value); else render(); };
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){e.preventDefault(); fin(true);} else if(e.key==="Escape"){e.preventDefault(); fin(false);} });
  inp.addEventListener("blur",()=>fin(true));
}
function scrollToSec(uid){
  const sec=document.getElementById("sec-"+uid);
  if(sec){ sec.classList.remove("collapsed"); sec.scrollIntoView({behavior:"smooth",block:"start"}); }
}

/* ---------- search (本文参照) ---------- */
function highlightEl(node, q){
  const w=document.createTreeWalker(node, NodeFilter.SHOW_TEXT); const ns=[];
  while(w.nextNode()) ns.push(w.currentNode);
  ns.forEach(n=>{
    const t=n.nodeValue, lo=t.toLowerCase(); let i=lo.indexOf(q);
    if(i<0) return;
    const frag=document.createDocumentFragment(); let last=0;
    while(i>=0){
      frag.appendChild(document.createTextNode(t.slice(last,i)));
      const mk=document.createElement("mark"); mk.textContent=t.slice(i,i+q.length); frag.appendChild(mk);
      last=i+q.length; i=lo.indexOf(q,last);
    }
    frag.appendChild(document.createTextNode(t.slice(last)));
    n.parentNode.replaceChild(frag,n);
  });
}
function applySearch(query){
  const q=(query||"").trim().toLowerCase();
  const body=$("#body"); if(!body) return;
  if(!q){ body.querySelectorAll(".sec,.line,.callout,.paramdef,.blank").forEach(e=>e.style.display=""); return; }
  body.querySelectorAll(".blank").forEach(e=>e.style.display="none");
  body.querySelectorAll(".line,.callout,.paramdef").forEach(le=>{
    const hit=le.textContent.toLowerCase().includes(q);
    le.classList.toggle("hit",hit); le.style.display=hit?"":"none";
    if(hit) highlightEl(le,q);
  });
  body.querySelectorAll(".sec").forEach(sec=>{
    const ttl=sec.querySelector(":scope > .sec-head .sec-title");
    const headHit = ttl && ttl.textContent.toLowerCase().includes(q);
    const anyHit = headHit || sec.querySelector(".line.hit,.callout.hit,.paramdef.hit");
    sec.style.display = anyHit ? "" : "none";
    if(anyHit){ sec.classList.remove("collapsed"); if(headHit && ttl) highlightEl(ttl,q); }
  });
}

  $("#body").querySelectorAll(".sec").forEach(s=>{ m[s.dataset.uid]=!s.classList.contains("collapsed"); });

/* ---------- tabs ---------- */
function selectTab(id){
  if(state.editMode) commitEdit();
  state.activeId=id;
  $("#tabs").querySelectorAll(".tab").forEach(t=>t.classList.toggle("on", +t.dataset.id===id));
  renderActiveBody();
}
function addTab(){
  const ids=state.palettes.map(p=>p.paletteID); const nid=(ids.length?Math.max(...ids):0)+1;
  const nlabel=String(state.palettes.length+1);
  const base=activeP();
  state.palettes.push({paletteID:nid, order:state.palettes.length, label:nlabel,
    name:base?base.name:"", stock:"", textColor:"#000000", isSearchOn:true, expandeds:[]});
  state.activeId=nid; render();
}
function delTab(){
  if(state.palettes.length<=1){ toast("最後のタブは削除できません",true); return; }
  const p=activeP(); if(!confirm("タブ「"+p.label+"」を削除しますか？")) return;
  const i=state.palettes.findIndex(x=>x.paletteID===p.paletteID);
  state.lastDeleted={pal:p, index:i};
  state.palettes.splice(i,1);
  state.activeId=state.palettes[Math.max(0,i-1)].paletteID;
  $("#btnUndoDel").disabled=false; render();
}
function undoDel(){
  if(!state.lastDeleted) return;
  const {pal,index}=state.lastDeleted;
  state.palettes.splice(Math.min(index,state.palettes.length),0,pal);
  state.activeId=pal.paletteID; state.lastDeleted=null; $("#btnUndoDel").disabled=true; render();
}
function renameTab(id){
  const p=state.palettes.find(x=>x.paletteID===id); if(!p) return;
  const nv=prompt("タブ名を変更", p.label); if(nv==null) return;
  p.label=nv.trim()||p.label; render();
}

/* ---------- edit mode ---------- */
function commitEdit(){
  if(!state.editMode) return;
  const p=activeP(); if(p) p.stock=$("#editArea").value;
  state.editMode=false;
}
function toggleEdit(){
  if(state.editMode){ commitEdit(); }
  else{ rememberExpand(); state.editMode=true; }
  render();
}

/* ---------- save / load ---------- */
function exportPalettes(strip){
  const out={palettes: state.palettes.map((p,i)=>({
    paletteID:p.paletteID, order:i, label:p.label, name:p.name||"",
    stock: strip? stripCallouts(p.stock||"") : (p.stock||""),
    textColor:p.textColor||"#000000", isSearchOn:p.isSearchOn!==false, expandeds:[]
  }))};
  return JSON.stringify(out, null, 2);
}
function stripCallouts(stock){
  const lines=(stock||"").split("\n"); const out=[]; let inC=false;
  for(const ln of lines){
    if(inC){ if(ln.trim()===":::") inC=false; continue; }
    if(/^:::(.+)$/.test(ln) || ln.trim()===":::"){ inC=true; continue; }
    out.push(ln);
  }
  return out.join("\n");
}
function download(name, text){
  const b=new Blob([text],{type:"application/json"}); const u=URL.createObjectURL(b);
  const a=document.createElement("a"); a.href=u; a.download=name; a.click(); URL.revokeObjectURL(u);
}
function loadJSON(text){
  let o; try{ o=JSON.parse(text); }catch(e){ toast("JSONの読み込みに失敗",true); return; }
  if(!o||!Array.isArray(o.palettes)){ toast("Tekeyパレット形式ではありません",true); return; }
  state.palettes=o.palettes.map((p,i)=>({
    paletteID: p.paletteID!=null?p.paletteID:(i+1), order:p.order!=null?p.order:i,
    label:p.label!=null?String(p.label):String(i+1), name:p.name||"",
    stock:p.stock||"", textColor:p.textColor||"#000000",
    isSearchOn:p.isSearchOn!==false, expandeds:p.expandeds||[]
  }));
  state.activeId=state.palettes[0].paletteID; state.editMode=false; expand={};
  render(); toast(state.palettes.length+"タブを読み込みました");
}

$("#board").addEventListener("dragend",()=>{

  bDrag=null; tDrag=null;

$("#board").addEventListener("dragover",e=>{
  if(boardLayout()==="timeline"){
    if(!tDrag) return; e.preventDefault(); e.dataTransfer.dropEffect="move";
    const band=e.target.closest(".tband");
    $("#board").querySelectorAll(".tband.dragover,.tband.coldragover").forEach(x=>{ if(x!==band) x.classList.remove("dragover","coldragover"); });
    if(band) band.classList.add(tDrag.type==="card"?"dragover":"coldragover");
    return;
  }
  if(!bDrag) return; e.preventDefault(); e.dataTransfer.dropEffect="move";
  const col=e.target.closest(".bcol");
  if(bDrag.type==="card"){
    $("#board").querySelectorAll(".bcol.dragover").forEach(x=>{ if(x!==col) x.classList.remove("dragover"); });
    if(col) col.classList.add("dragover");
  } else {
    $("#board").querySelectorAll(".bcol.coldragover").forEach(x=>{ if(x!==col) x.classList.remove("coldragover"); });
    if(col) col.classList.add("coldragover");
  }
});
$("#board").addEventListener("drop",e=>{
  if(boardLayout()==="timeline"){
    if(!tDrag) return; e.preventDefault();
    const band=e.target.closest(".tband");
    if(tDrag.type==="card"){
      if(!band){ tDrag=null; return; }
      const list=band.querySelector(".tband-list");
      const idx=boardDropOrd(list, e.clientY);
      const key=tDrag.key; tDrag=null; moveTimelineCard(key, band.dataset.band, idx);
    } else {
      const id=tDrag.id; tDrag=null; let before=null;
      if(band){ const r=band.getBoundingClientRect();
        if(e.clientY < r.top+r.height/2) before=band.dataset.band;
        else { const nx=band.nextElementSibling; before=(nx&&nx.classList.contains("tband"))?nx.dataset.band:null; } }
      moveTimelineBand(id, before);
    }
    return;
  }
  if(!bDrag) return; e.preventDefault();
  const col=e.target.closest(".bcol");
  if(bDrag.type==="card"){
    if(!col){ bDrag=null; return; }
    const list=col.querySelector(".bcol-list");
    const dstIdx=boardDropOrd(list, e.clientY);
    const key=bDrag.key; bDrag=null;
    moveBoardCard(key, col.dataset.col, dstIdx);
  } else {
    const id=bDrag.id; bDrag=null;
    let before=null;
    if(col){ const r=col.getBoundingClientRect();
      if(e.clientX < r.left+r.width/2) before=col.dataset.col;
      else { const nx=col.nextElementSibling; before=(nx&&nx.classList.contains("bcol"))?nx.dataset.col:null; }
    }
    moveColumn(id, before);
  }
});

$("#board").addEventListener("pointerdown",e=>{
  if(boardLayout()!=="flow" || e.button!==0) return;
  if(e.target.closest(".fdel")||e.target.closest(".fzone-del")) return;
  const canvas=$("#fcanvas"); if(!canvas) return; const cr=canvas.getBoundingClientRect();
  const card=e.target.closest(".fcard");
  if(!card){
    const zone=e.target.closest(".fzone"); if(!zone) return;
    const z=loadFlow().zones.find(x=>x.id===zone.dataset.id); if(!z) return;
    if(z.locked) return;
    if(e.target.closest(".fzone-rz")){
      fDrag={mode:"zresize", id:z.id, zone, startW:z.w, startH:z.h, sx:e.clientX, sy:e.clientY};
    } else if(e.target.closest(".fzone-head")){
      fDrag={mode:"zmove", id:z.id, zone, dx:e.clientX-cr.left-z.x, dy:e.clientY-cr.top-z.y};
    } else return;
    e.preventDefault(); return;
  }
  if(e.target.closest(".fhandle")){
    const box=cardBox(card); const start={x:box.cx,y:box.cy};
    const temp=mkLine("ftemp",start,start,false); $("#fsvg").appendChild(temp);
    fDrag={mode:"link", from:card.dataset.key, fromEl:card, temp};
  } else {
    fDrag={mode:"move", key:card.dataset.key, card, moved:false, sx:e.clientX, sy:e.clientY,
      dx:e.clientX-cr.left-card.offsetLeft, dy:e.clientY-cr.top-card.offsetTop};
    card.style.zIndex=5;
  }
  e.preventDefault();
});
document.addEventListener("pointermove",e=>{
  if(!fDrag) return;
  const canvas=$("#fcanvas"); if(!canvas) return; const cr=canvas.getBoundingClientRect();
  if(fDrag.mode==="move"){
    let x=Math.max(0, e.clientX-cr.left-fDrag.dx), y=Math.max(0, e.clientY-cr.top-fDrag.dy);
    fDrag.card.style.left=x+"px"; fDrag.card.style.top=y+"px"; fDrag.lastX=x; fDrag.lastY=y;
    if(Math.abs(e.clientX-fDrag.sx)>4||Math.abs(e.clientY-fDrag.sy)>4) fDrag.moved=true;
    redrawLinks();
  } else if(fDrag.mode==="link" && fDrag.temp){
    const box=cardBox(fDrag.fromEl); if(!box) return;
    const px=e.clientX-cr.left, py=e.clientY-cr.top;
    const p1=edgePoint({x:px,y:py},box);
    fDrag.temp.setAttribute("x1",p1.x); fDrag.temp.setAttribute("y1",p1.y);
    fDrag.temp.setAttribute("x2",px); fDrag.temp.setAttribute("y2",py);
  } else if(fDrag.mode==="zmove"){
    let x=Math.max(0, e.clientX-cr.left-fDrag.dx), y=Math.max(0, e.clientY-cr.top-fDrag.dy);
    fDrag.zone.style.left=x+"px"; fDrag.zone.style.top=y+"px"; fDrag.lastX=x; fDrag.lastY=y;
  } else if(fDrag.mode==="zresize"){
    let w=Math.max(140, fDrag.startW+(e.clientX-fDrag.sx)), h=Math.max(90, fDrag.startH+(e.clientY-fDrag.sy));
    fDrag.zone.style.width=w+"px"; fDrag.zone.style.height=h+"px"; fDrag.lastW=w; fDrag.lastH=h;
  }
});
document.addEventListener("pointerup",e=>{
  if(!fDrag) return;
  if(fDrag.mode==="move"){
    if(fDrag.card) fDrag.card.style.zIndex="";
    if(fDrag.moved) saveFlowPos(fDrag.key, fDrag.lastX, fDrag.lastY);
    else {
      const cur=currentCards()[fDrag.key];
      if(cur){ setBoard(false); selectTab(cur.homeTab);
        requestAnimationFrame(()=>{ const t=$("#body").querySelectorAll("#body > .sec-l1")[cur.ord]; if(t){ t.classList.remove("collapsed"); t.scrollIntoView({behavior:"smooth",block:"start"}); } }); }
    }
  } else if(fDrag.mode==="link"){
    if(fDrag.temp) fDrag.temp.remove();
    const tgt=document.elementFromPoint(e.clientX,e.clientY); const tc=tgt&&tgt.closest&&tgt.closest(".fcard");
    if(tc && tc.dataset.key!==fDrag.from) addLink(fDrag.from, tc.dataset.key);
  } else if(fDrag.mode==="zmove"){
    if(fDrag.lastX!=null) updateZone(fDrag.id,{x:Math.round(fDrag.lastX), y:Math.round(fDrag.lastY)});
  } else if(fDrag.mode==="zresize"){
    if(fDrag.lastW!=null) updateZone(fDrag.id,{w:Math.round(fDrag.lastW), h:Math.round(fDrag.lastH)});
  }
  fDrag=null;
});
$("#board").addEventListener("dblclick",e=>{
  const zname=e.target.closest(".fzone-name");
  if(zname){
    const zone=zname.closest(".fzone"); const id=zone.dataset.id;
    const z=loadFlow().zones.find(x=>x.id===id); if(!z) return;
    const inp=document.createElement("input"); inp.className="inline-edit"; inp.value=z.name;
    zname.replaceWith(inp); inp.focus(); inp.select();
    let done=false; const fin=s=>{ if(done)return; done=true; if(s) renameZone(id, inp.value); else renderBoard(); };
    inp.addEventListener("pointerdown",ev=>ev.stopPropagation());
    inp.addEventListener("keydown",ev=>{ ev.stopPropagation(); if(ev.key==="Enter"){ev.preventDefault();fin(true);} else if(ev.key==="Escape"){ev.preventDefault();fin(false);} });
    inp.addEventListener("blur",()=>fin(true));
    return;
  }
  const name=e.target.closest(".bcol-name"); if(!name) return;
  const head=name.closest(".bcol-head"); const col=head.dataset.col;
  const b=loadBoard(); const cobj=b&&b.cols.find(c=>c.id===col);
  if(!cobj || cobj.tabId!=null){ toast("タブ由来の列名はパレット側で変更してください"); return; }
  const inp=document.createElement("input"); inp.className="inline-edit"; inp.value=cobj.name; inp.draggable=false;
  name.replaceWith(inp); inp.focus(); inp.select();
  let done=false; const fin=s=>{ if(done)return; done=true; if(s) renameColumn(col, inp.value); else renderBoard(); };
  inp.addEventListener("mousedown",ev=>ev.stopPropagation());
  inp.addEventListener("keydown",ev=>{ ev.stopPropagation(); if(ev.key==="Enter"){ev.preventDefault();fin(true);} else if(ev.key==="Escape"){ev.preventDefault();fin(false);} });
  inp.addEventListener("blur",()=>fin(true));
});
/* card right-click menu: color + tags */
const CARD_COLORS=["#d83a2f","#e08a1e","#caa600","#2e7d46","#2f6fb3","#7a4fb3","#5b6772"];
function openCardMenu(key, x, y){
  const m=loadCardMeta()[key]||{}; const menu=$("#ctxmenu");
  let h="<div class='ctx-sec'>色</div><div class='ctx-colors'>";
  CARD_COLORS.forEach(c=> h+="<button class='ctx-sw' data-color='"+c+"' style='background:"+c+"' title='"+c+"'></button>");
  h+="<button class='ctx-sw ctx-none' data-color='' title='色なし'>×</button></div>";
  h+="<div class='ctx-sec'>タグ</div>";
  if(m.tags&&m.tags.length) h+="<div class='ctx-tags'>"+m.tags.map(t=>"<span class='tag'>"+esc(t)+"<button class='ctx-tagdel' data-tag='"+esc(t)+"'>×</button></span>").join("")+"</div>";
  h+="<input class='ctx-tagin' placeholder='タグを追加 (Enter)'>";
  menu.innerHTML=h; menu.dataset.key=key; menu.dataset.zid=""; menu.dataset.bandid=""; menu.dataset.tagname=""; menu.dataset.x=x; menu.dataset.y=y;
  menu.style.display="block";
  menu.style.left=Math.min(x, innerWidth-186)+"px";
  menu.style.top=Math.min(y, innerHeight-200)+"px";
  const inp=menu.querySelector(".ctx-tagin"); if(inp) inp.focus();
}
function openZoneMenu(id, x, y){
  const z=loadFlow().zones.find(z=>z.id===id); if(!z) return;
  const menu=$("#ctxmenu");
  let h="<div class='ctx-sec'>エリアの色</div><div class='ctx-colors'>";
  CARD_COLORS.forEach(c=> h+="<button class='ctx-sw' data-color='"+c+"' style='background:"+c+"' title='"+c+"'></button>");
  h+="<button class='ctx-sw ctx-none' data-color='' title='色なし'>×</button></div>";
  h+="<button class='ctx-lock'>"+(z.locked?"🔓 固定を解除":"🔒 固定する")+"</button>";
  menu.innerHTML=h; menu.dataset.zid=id; menu.dataset.key=""; menu.dataset.bandid=""; menu.dataset.tagname="";
  menu.style.display="block";
  menu.style.left=Math.min(x, innerWidth-186)+"px";
  menu.style.top=Math.min(y, innerHeight-160)+"px";
}
function openBandMenu(id, x, y){
  const menu=$("#ctxmenu");
  let h="<div class='ctx-sec'>帯の色</div><div class='ctx-colors'>";
  CARD_COLORS.forEach(c=> h+="<button class='ctx-sw' data-color='"+c+"' style='background:"+c+"' title='"+c+"'></button>");
  h+="<button class='ctx-sw ctx-none' data-color='' title='色なし'>×</button></div>";
  menu.innerHTML=h; menu.dataset.bandid=id; menu.dataset.key=""; menu.dataset.zid=""; menu.dataset.tagname="";
  menu.style.display="block";
  menu.style.left=Math.min(x, innerWidth-186)+"px";
  menu.style.top=Math.min(y, innerHeight-120)+"px";
}
function closeCardMenu(){ const m=$("#ctxmenu"); m.style.display="none"; m.innerHTML=""; m.dataset.key=""; m.dataset.zid=""; m.dataset.bandid=""; m.dataset.tagname=""; }
$("#board").addEventListener("contextmenu",e=>{
  const hit=e.target.closest(".flinkhit"); if(hit){ e.preventDefault(); if(confirm("この接続を削除しますか？")) deleteLink(+hit.dataset.idx); return; }
  const fl=e.target.closest(".flabel"); if(fl){ e.preventDefault(); if(confirm("この接続を削除しますか？")) deleteLink(+fl.dataset.idx); return; }
  const tfc=e.target.closest(".tfchip");
  if(tfc && tfc.dataset.tag){ e.preventDefault(); openTagMenu(tfc.dataset.tag, e.clientX, e.clientY); return; }
  const card=e.target.closest(".bcard,.fcard");
  if(card){ e.preventDefault(); openCardMenu(card.dataset.key, e.clientX, e.clientY); return; }
  const zone=e.target.closest(".fzone");
  if(zone){ e.preventDefault(); openZoneMenu(zone.dataset.id, e.clientX, e.clientY); return; }
  const band=e.target.closest(".tband");
  if(band){ e.preventDefault(); openBandMenu(band.dataset.band, e.clientX, e.clientY); return; }
});
$("#ctxmenu").addEventListener("click",e=>{
  const menu=$("#ctxmenu");
  const tagname=menu.dataset.tagname;
  if(tagname){ const tsw=e.target.closest(".ctx-sw"); if(tsw){ setTagColor(tagname, tsw.dataset.color||null); closeCardMenu(); } return; }
  const bandid=menu.dataset.bandid;
  if(bandid){
    const bsw=e.target.closest(".ctx-sw"); if(bsw){ setBandColor(bandid, bsw.dataset.color||null); closeCardMenu(); }
    return;
  }
  const zid=menu.dataset.zid;
  if(zid){
    const zsw=e.target.closest(".ctx-sw"); if(zsw){ setZoneColor(zid, zsw.dataset.color||null); closeCardMenu(); return; }
    if(e.target.closest(".ctx-lock")){ toggleZoneLock(zid); closeCardMenu(); return; }
    return;
  }
  const key=menu.dataset.key; if(!key) return;
  const sw=e.target.closest(".ctx-sw"); if(sw){ setCardColor(key, sw.dataset.color||null); closeCardMenu(); return; }
  const td=e.target.closest(".ctx-tagdel"); if(td){ removeCardTag(key, td.dataset.tag); openCardMenu(key, +$("#ctxmenu").dataset.x, +$("#ctxmenu").dataset.y); return; }
});
$("#ctxmenu").addEventListener("keydown",e=>{
  if(e.target.classList.contains("ctx-tagin") && e.key==="Enter"){ e.preventDefault(); addCardTag($("#ctxmenu").dataset.key, e.target.value); closeCardMenu(); }
  if(e.key==="Escape") closeCardMenu();
});
document.addEventListener("click",e=>{ if(!e.target.closest("#ctxmenu") && !e.target.closest(".bcard")) closeCardMenu(); });

$("#s_cancel").addEventListener("click",()=>$("#settings").classList.remove("open"));
$("#s_save").addEventListener("click",saveSettings);
$("#settings").addEventListener("click",e=>{ if(e.target.id==="settings") $("#settings").classList.remove("open"); });
